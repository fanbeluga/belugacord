<!-- index.html — Полный фронтенд (Файлы, Фото, Видео, Кружки, Голосовые, Звонки) -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BelugaCord 4.5 BETA</title>
<style>
  :root {
    --bg: #0e1621; --bg-panel: #17212b; --bg-hover: #202b36;
    --accent: #51a2e8; --text: #ffffff; --text-muted: #7d8e9e;
    --border: #101921; --red: #e53935; --green: #4caf50;
    --purple: #8e44ad;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { background: #000; display: flex; justify-content: center; height: 100vh; overflow: hidden; }
  .app { width: 100%; max-width: 480px; height: 100%; background: var(--bg); display: flex; flex-direction: column; position: relative; color: var(--text); }
  .hidden { display: none !important; }
  
  /* Header */
  .header { background: var(--bg-panel); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; z-index: 10; flex-shrink: 0; }
  .header-title { font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .header-logo { width: 32px; height: 32px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  
  /* Chat list */
  .chat-list { flex: 1; overflow-y: auto; padding-bottom: 70px; }
  .chat-item { display: flex; padding: 12px 16px; gap: 12px; cursor: pointer; }
  .chat-item:hover { background: var(--bg-hover); }
  .avatar { width: 54px; height: 54px; border-radius: 50%; object-fit: cover; background: #333; flex-shrink: 0; }
  .chat-info { flex: 1; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
  .chat-top { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .chat-name { font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-time { font-size: 12px; color: var(--text-muted); }
  .chat-bottom { display: flex; justify-content: space-between; align-items: center; }
  .chat-msg { font-size: 14px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-badge { background: var(--accent); color: #fff; font-size: 12px; padding: 2px 6px; border-radius: 10px; font-weight: bold; }
  
  /* Bottom Nav */
  .bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; background: var(--bg-panel); display: flex; justify-content: space-around; padding: 8px 0 16px 0; border-top: 1px solid var(--border); z-index: 20; }
  .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); font-size: 11px; gap: 4px; cursor: pointer; width: 25%; }
  .nav-item.active { color: var(--accent); }
  .nav-icon { font-size: 22px; }
  
  /* Screen / Chat UI */
  .chat-screen { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg); display: flex; flex-direction: column; z-index: 50; transform: translateX(100%); transition: transform 0.2s; }
  .chat-screen.active { transform: translateX(0); }
  .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .bubble { max-width: 80%; padding: 8px 12px; border-radius: 12px; font-size: 15px; line-height: 1.4; word-break: break-word; }
  .bubble.in { background: var(--bg-panel); align-self: flex-start; border-bottom-left-radius: 4px; }
  .bubble.out { background: #2b5278; align-self: flex-end; border-bottom-right-radius: 4px; }
  .bubble img, .bubble video { max-width: 100%; border-radius: 8px; margin-top: 4px; }
  .chat-input-area { background: var(--bg-panel); padding: 8px 12px; display: flex; align-items: center; gap: 8px; }
  .chat-input { flex: 1; background: var(--bg); border: none; color: var(--text); padding: 12px; border-radius: 8px; font-size: 16px; outline: none; }
  .btn-icon { background: transparent; border: none; color: var(--text-muted); font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px; }
  
  /* Modals */
  .modal-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .modal-overlay.active { opacity: 1; pointer-events: auto; }
  .modal-content { background: var(--bg-panel); width: 90%; max-width: 400px; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .modal-input { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 8px; font-size: 16px; outline: none; }
  .btn-primary { background: var(--accent); color: #fff; border: none; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
  .btn-text { background: transparent; color: var(--accent); border: none; font-size: 16px; cursor: pointer; padding: 8px; }
  
  /* Auth */
  .auth-screen { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg); z-index: 200; display: flex; flex-direction: column; padding: 24px; }
  .auth-logo { text-align: center; margin-top: 60px; margin-bottom: 40px; font-size: 80px; }
  .auth-title { font-size: 24px; font-weight: 600; text-align: center; margin-bottom: 8px; }
  .auth-input-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 8px; }
  .auth-input { background: var(--bg-panel); border: 1px solid var(--border); color: var(--text); padding: 14px; border-radius: 10px; font-size: 16px; outline: none; }
  
  /* Call Overlay */
  .call-overlay { position: absolute; top:0; left:0; right:0; bottom:0; background: #000; z-index: 300; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  .call-video { width: 100%; height: 100%; object-fit: cover; position: absolute; }
  .call-video-local { width: 120px; height: 160px; position: absolute; bottom: 20px; right: 20px; background: #222; border-radius: 8px; object-fit: cover; border: 2px solid var(--accent); z-index: 301; }
</style>
</head>
<body>
<div class="app">

  <!-- AUTH -->
  <div class="auth-screen" id="authScreen">
    <div class="auth-logo">🐋</div>
    <div class="auth-title">BelugaCord</div>
    <div style="text-align:center;color:var(--text-muted);font-size:14px;margin-bottom:32px">Анонимный мессенджер</div>
    <div class="auth-input-group">
      <label style="color:var(--accent);font-size:14px">Логин</label>
      <input type="text" class="auth-input" id="loginUser" placeholder="_fan_beluga_ / admin / mod">
    </div>
    <div class="auth-input-group">
      <label style="color:var(--accent);font-size:14px">Пароль</label>
      <input type="password" class="auth-input" id="loginPass" placeholder="12344321 / admin123 / mod123">
    </div>
    <button class="btn-primary" onclick="login()">Войти</button>
  </div>

  <!-- MAIN -->
  <div id="mainApp" class="hidden" style="height:100%;display:flex;flex-direction:column;">
    <div class="header">
      <div class="header-title"><div class="header-logo">🐋</div> BelugaCord</div>
      <div style="color:var(--text-muted);font-size:24px;cursor:pointer" onclick="openModal('settingsModal')">⋮</div>
    </div>
    
    <div class="chat-list">
      <div class="chat-item" onclick="openChat('general', 'Общий чат')">
        <img src="https://ui-avatars.com/api/?name=G&background=51a2e8&color=fff&rounded=true" class="avatar">
        <div class="chat-info">
          <div class="chat-top"><div class="chat-name">Общий чат</div></div>
          <div class="chat-bottom"><div class="chat-msg">Нажмите чтобы войти</div></div>
        </div>
      </div>
      <div class="chat-item" onclick="botFather()">
        <img src="https://ui-avatars.com/api/?name=BF&background=51a2e8&color=fff&rounded=true" class="avatar">
        <div class="chat-info">
          <div class="chat-top"><div class="chat-name">BotFather</div></div>
          <div class="chat-bottom"><div class="chat-msg">Создай своего бота</div></div>
        </div>
      </div>
      <div class="chat-item" onclick="openModal('settingsModal')">
        <img src="https://ui-avatars.com/api/?name=S&background=e67e22&color=fff&rounded=true" class="avatar">
        <div class="chat-info">
          <div class="chat-top"><div class="chat-name">Мой профиль</div></div>
          <div class="chat-bottom"><div class="chat-msg">Настройки и панели</div></div>
        </div>
      </div>
    </div>

    <div class="bottom-nav">
      <div class="nav-item active"><div class="nav-icon">💬</div><div>Чаты</div></div>
      <div class="nav-item" onclick="openModal('settingsModal')"><div class="nav-icon">👤</div><div>Контакты</div></div>
      <div class="nav-item" onclick="openModal('settingsModal')"><div class="nav-icon">⚙️</div><div>Настройки</div></div>
      <div class="nav-item" onclick="openModal('settingsModal')"><div class="nav-icon">😺</div><div>Профиль</div></div>
    </div>
  </div>

  <!-- CHAT SCREEN -->
  <div class="chat-screen" id="chatScreen">
    <div class="header">
      <div style="font-size:24px;cursor:pointer" onclick="closeChat()">←</div>
      <div class="header-title" id="chatTitle">Чат</div>
      <button class="btn-icon" onclick="startCall()">📞</button>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    
    <div class="chat-input-area">
      <input type="file" id="fileInput" style="display:none" onchange="uploadFile(this)">
      <button class="btn-icon" onclick="document.getElementById('fileInput').click()">📎</button>
      
      <input type="text" class="chat-input" id="chatInput" placeholder="Сообщение" onkeypress="if(event.key==='Enter') sendMsg()">
      
      <button class="btn-icon" onmousedown="startRec(false)" onmouseup="stopRec()" ontouchstart="startRec(false)" ontouchend="stopRec()">🎙️</button>
      <button class="btn-icon" onmousedown="startRec(true)" onmouseup="stopRec()" ontouchstart="startRec(true)" ontouchend="stopRec()">⭕</button>
    </div>
  </div>

  <!-- SETTINGS MODAL -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-content">
      <div style="font-size:20px;font-weight:600;text-align:center">Настройки</div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <button class="btn-primary" onclick="openPanel('mod')">Панель Модера</button>
        <button class="btn-primary" style="background:#e67e22" onclick="openPanel('admin')">Панель Админа</button>
        <button class="btn-primary" style="background:#8e44ad" onclick="openPanel('owner')">Панель Владельца</button>
      </div>
      <button class="btn-text" onclick="closeModal('settingsModal')">Закрыть</button>
    </div>
  </div>

  <!-- PANEL MODAL -->
  <div class="modal-overlay" id="panelModal">
    <div class="modal-content">
      <div style="font-size:20px;font-weight:600;text-align:center" id="panelTitle">Панель</div>
      <input type="password" class="modal-input" id="panelPass" placeholder="Пароль">
      <button class="btn-primary" onclick="checkPanelPass()">Войти</button>
      <button class="btn-text" onclick="closeModal('panelModal')">Отмена</button>
    </div>
  </div>

  <!-- CALL OVERLAY -->
  <div id="callOverlay" class="call-overlay hidden">
    <video id="remoteVideo" class="call-video" autoplay playsinline></video>
    <video id="localVideo" class="call-video-local" autoplay playsinline muted></video>
    <button class="btn-primary" style="position:absolute;bottom:40px;width:80px;background:red;z-index:310;" onclick="endCall()">Сброс</button>
  </div>

</div>

<script>
  let currentUser = '', ws, currentChat = 'general';
  let peerConnection, localStream;
  let mediaRecorder, audioChunks = [];

  const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

  async function login() {
    const u = document.getElementById('loginUser').value;
    const p = document.getElementById('loginPass').value;
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username: u, password: p})
      });
      if (!res.ok) throw new Error(await res.text());
      
      currentUser = u;
      document.getElementById('authScreen').classList.add('hidden');
      document.getElementById('mainApp').classList.remove('hidden');
      connectWS();
    } catch(e) { alert('Ошибка: ' + e.message); }
  }

  function connectWS() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws/${currentUser}`);
    
    ws.onmessage = async (e) => {
      const d = JSON.parse(e.data);
      
      // Чат
      if (d.event === 'history') {
        document.getElementById('chatMessages').innerHTML = '';
        d.messages.forEach(m => renderMsg(m.sender, m.text, m.type, m.file_url));
      } else if (d.event === 'new_message') {
        renderMsg(d.sender, d.text, d.type, d.file_url);
      }
      
      // WebRTC Сигналинг
      if (d.event === 'call_offer') {
        if (confirm(`Входящий звонок от ${d.sender}`)) {
          document.getElementById('callOverlay').classList.remove('hidden');
          await setupPeer(false, d.sender, d.offer);
        }
      } else if (d.event === 'call_answer') {
        await peerConnection.setRemoteDescription(new RTCSessionDescription(d.answer));
      } else if (d.event === 'call_ice') {
        await peerConnection.addIceCandidate(new RTCIceCandidate(d.candidate));
      } else if (d.event === 'call_end') {
        endCallUI();
      }
      
      // Троллинг
      if (d.event === 'flip') {
        document.body.style.transition = 'transform 0.5s';
        document.body.style.transform = 'rotate(180deg)';
        setTimeout(() => document.body.style.transform = 'rotate(0deg)', 5000);
      }
      if (d.event === 'vibrate') navigator.vibrate?.([500, 200, 500]);
      if (d.event === 'blink') {
        document.body.style.background = '#000';
        setTimeout(() => document.body.style.background = '', 500);
      }
    };
  }

  function openChat(id, title) {
    currentChat = id;
    document.getElementById('chatTitle').innerText = title;
    document.getElementById('chatScreen').classList.add('active');
  }
  function closeChat() { document.getElementById('chatScreen').classList.remove('active'); }

  function sendMsg() {
    const inp = document.getElementById('chatInput');
    if (!inp.value.trim()) return;
    ws.send(JSON.stringify({event: 'message', chat_id: currentChat, text: inp.value, type: 'text'}));
    inp.value = '';
  }

  function renderMsg(sender, text, type, url) {
    const div = document.createElement('div');
    div.className = `bubble ${sender === currentUser ? 'out' : 'in'}`;
    let content = `<div style="font-size:11px;color:#51a2e8;margin-bottom:2px">${sender}</div>`;
    
    if (type === 'image') content += `<img src="${url}">`;
    else if (type === 'video') content += `<video src="${url}" controls></video>`;
    else if (type === 'voice') content += `<audio src="${url}" controls></audio>`;
    else if (type === 'file') content += `<a href="${url}" target="_blank" style="color:#fff;text-decoration:none;">📎 ${text}</a>`;
    else content += text;
    
    div.innerHTML = content;
    const container = document.getElementById('chatMessages');
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
  }

  async function uploadFile(inp) {
    const file = inp.files[0];
    if (!file) return;
    
    const form = new FormData();
    form.append('file', file);
    
    alert('Загрузка... Не закрывайте приложение.');
    try {
      const res = await fetch('/api/upload', {method:'POST', body: form});
      const data = await res.json();
      
      let type = 'file';
      if (file.type.startsWith('image/')) type = 'image';
      else if (file.type.startsWith('video/')) type = 'video';
      else if (file.type.startsWith('audio/')) type = 'voice';

      ws.send(JSON.stringify({event: 'message', chat_id: currentChat, text: file.name, type: type, file_url: data.url}));
    } catch(e) { alert('Ошибка загрузки'); }
    inp.value = '';
  }

  async function startRec(isVideo = false) {
    try {
      const constraints = isVideo ? { video: { facingMode: "user" }, audio: true } : { audio: true };
      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      
      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = async () => {
        const blob = new Blob(audioChunks, { type: isVideo ? 'video/webm' : 'audio/webm' });
        const file = new File([blob], `rec_${Date.now()}.webm`, { type: blob.type });
        
        const form = new FormData();
        form.append('file', file);
        const res = await fetch('/api/upload', {method:'POST', body: form});
        const data = await res.json();
        
        ws.send(JSON.stringify({event: 'message', chat_id: currentChat, text: 'Медиа', type: isVideo ? 'video' : 'voice', file_url: data.url}));
        
        stream.getTracks().forEach(t => t.stop());
      };
      
      mediaRecorder.start();
    } catch(err) { alert('Нет доступа к микрофону/камере (нужен HTTPS)'); }
  }

  function stopRec() {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      mediaRecorder.stop();
    }
  }

  async function startCall() {
    const target = prompt('Кому звоним? (Введите @username)');
    if (!target) return;
    
    document.getElementById('callOverlay').classList.remove('hidden');
    await setupPeer(true, target);
    
    const offer = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offer);
    ws.send(JSON.stringify({event: 'call_offer', target: target, offer: offer}));
  }

  async function setupPeer(isCaller, target, offer = null) {
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    document.getElementById('localVideo').srcObject = localStream;
    
    peerConnection = new RTCPeerConnection(rtcConfig);
    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
    
    peerConnection.ontrack = (event) => {
      document.getElementById('remoteVideo').srcObject = event.streams[0];
    };
    
    peerConnection.onicecandidate = (event) => {
      if (event.candidate) {
        ws.send(JSON.stringify({event: 'call_ice', target: target, candidate: event.candidate}));
      }
    };
    
    if (!isCaller && offer) {
      await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);
      ws.send(JSON.stringify({event: 'call_answer', target: target, answer: answer}));
    }
  }

  function endCall() {
    const target = prompt('Кому звонили? (Введите @username для отключения)');
    if (target) ws.send(JSON.stringify({event: 'call_end', target: target}));
    endCallUI();
  }

  function endCallUI() {
    if (peerConnection) { peerConnection.close(); peerConnection = null; }
    if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
    document.getElementById('callOverlay').classList.add('hidden');
  }

  // Settings / Panels
  function openModal(id) { document.getElementById(id).classList.add('active'); }
  function closeModal(id) { document.getElementById(id).classList.remove('active'); }

  let activePanel = '';
  function openPanel(panel) {
    activePanel = panel;
    document.getElementById('panelTitle').innerText = 
      panel === 'mod' ? 'Панель Модера' : 
      panel === 'admin' ? 'Панель Админа' : 'Панель Владельца';
    document.getElementById('panelPass').value = '';
    closeModal('settingsModal');
    openModal('panelModal');
  }

  function checkPanelPass() {
    const p = document.getElementById('panelPass').value;
    let ok = false;
    if (activePanel === 'mod' && p === 'mod123') ok = true;
    if (activePanel === 'admin' && p === 'admin123') ok = true;
    if (activePanel === 'owner' && p === '12344321') ok = true;
    
    if (!ok) return alert('Неверный пароль!');
    
    closeModal('panelModal');
    
    let endpoints = '';
    if (activePanel === 'mod') endpoints = 'mute | warn | kick';
    if (activePanel === 'admin') endpoints = 'ban | unban | force_logout';
    if (activePanel === 'owner') endpoints = 'give_coins | give_premium | give_scam | flip | vibrate | blink';
    
    const action = prompt(`Действия:\n${endpoints}\n\nВведите действие:`);
    if (!action) return;
    
    const target = prompt('Введите @username цели:');
    if (!target) return;
    
    let val = '';
    if (action === 'mute' || action === 'give_coins' || action === 'give_premium') {
      val = prompt('Значение (минуты/монеты/дни):') || '1';
    }
    
    executeApiCall(activePanel, action, target, val);
  }

  async function executeApiCall(panel, action, target, value) {
    const url = `/api/${panel}/${action}`;
    try {
      await fetch(url, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({target, value})
      });
      alert('Выполнено!');
    } catch(e) { alert('Ошибка: ' + e.message); }
  }

  async function botFather() {
    const name = prompt('Имя бота (например, my_bot):');
    if (!name) return;
    try {
      const res = await fetch('/api/botfather/newbot', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({target: name})
      });
      const data = await res.json();
      alert(`Бот создан!\nИмя: @${data.bot}\nТокен: ${data.token}`);
    } catch(e) { alert('Ошибка: ' + e.message); }
  }
</script>
</body>
</html>
