<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BelugaCord</title>
<link rel="icon" href="icon-192x192.png">
<style>
:root{--bg:#151c26;--card:#1d2733;--head:#202c3a;--acc:#4fa3ea;--txt:#fff;--dim:#8a99ab;--line:#121a23;--in:#1e2c3b;--nav:#1e2a38;--sel:#2b4259;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#eef1f5;--card:#fff;--head:#fff;--acc:#2a8bd8;--txt:#000;--dim:#7d8a99;--line:#e3e7ec;--in:#fff;--nav:#fff;--sel:#dcecfb}
html,body{height:100%;background:#000}*{box-sizing:border-box;margin:0}
body{color:var(--txt);font:16px/1.3 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
button,input,textarea{font:inherit;color:inherit;border:0;background:none;outline:none}button{cursor:pointer}
#app{max-width:480px;height:100%;margin:0 auto;position:relative;background:var(--bg);overflow:hidden}
.scr{position:absolute;inset:0;display:none;flex-direction:column}.scr.on{display:flex}
.sc{flex:1;overflow:auto;padding:0 0 110px}
.ov{z-index:3;background:var(--bg)}
.hd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;font-size:22px;font-weight:500;flex:none}
.dots{color:var(--dim);padding:0 8px;font-size:22px}
.srch{margin:6px 14px 10px;background:var(--head);border-radius:24px;padding:13px 18px;color:var(--dim);display:block;width:calc(100% - 28px)}
.row{display:flex;gap:14px;padding:9px 16px;align-items:center;cursor:pointer}.row:active{background:var(--card)}
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:500;flex:none;position:relative;background-size:cover;background-position:center}
.mid{flex:1;min-width:0}.r1,.r2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.r1 b{font-weight:500;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pre{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dim{color:var(--dim)}.sm{font-size:13px}
.t{color:var(--dim);font-size:13px;white-space:nowrap}.pin{background:var(--card);border-radius:12px;padding:2px 10px;font-size:13px;color:var(--dim)}
.bd{background:var(--acc);color:#fff;border-radius:14px;min-width:26px;height:26px;padding:0 8px;font-size:14px;display:grid;place-items:center}.bd.m{background:var(--sel);color:var(--dim)}
.card{background:var(--card);border-radius:18px;margin:10px 14px;overflow:hidden}
.li{display:flex;align-items:center;gap:16px;padding:13px 16px;width:100%;text-align:left}.li+.li{border-top:1px solid var(--line)}
.li .v{margin-left:auto;color:var(--acc)}.ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px;flex:none}
.cap{color:var(--acc);padding:14px 20px 4px;font-size:15px}
#nav{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--nav);border-radius:32px;display:flex;padding:6px;z-index:2;box-shadow:0 4px 20px #0007}
#nav button{flex:1;padding:7px 0 6px;border-radius:26px;color:var(--dim);font-size:13px;position:relative;display:grid;justify-items:center;gap:1px}
#nav button.on{background:var(--sel);color:var(--acc);font-weight:500}#nav .e{font-size:22px;line-height:26px}
.back{width:44px;height:44px;border-radius:50%;background:var(--head);display:grid;place-items:center;font-size:22px;flex:none}
.top{display:flex;gap:8px;padding:10px 12px;align-items:center;flex:none}
.pill{flex:1;background:var(--head);border-radius:26px;padding:6px 14px 6px 6px;display:flex;gap:10px;align-items:center;min-width:0;cursor:pointer}
.pill b{font-weight:500;display:block;font-size:17px;line-height:1.1}
#msgs{flex:1;overflow:auto;padding:8px 10px;display:flex;flex-direction:column;gap:3px;background-image:radial-gradient(#ffffff0a 2px,transparent 2.5px);background-size:34px 34px}
.chip{align-self:center;background:#0005;color:#fff;border-radius:14px;padding:3px 14px;font-size:14px;margin:6px 0}
.b{max-width:80%;padding:7px 11px 5px;border-radius:18px 18px 18px 5px;background:var(--in);align-self:flex-start;word-break:break-word;font-size:17px;white-space:pre-wrap;position:relative}
.b.out{background:linear-gradient(135deg,#9a3fc0,#6f55dc);align-self:flex-end;border-radius:18px 18px 5px 18px;color:#fff}
.b .mt{float:right;margin:9px 0 -3px 10px;font-size:12px;color:var(--dim);display:inline-flex;align-items:center}.b.out .mt{color:#ffffffb0}
.svc{align-self:center;margin:8px 0;text-align:center}.svc .t2{background:#0005;color:#fff;border-radius:14px;padding:3px 12px;font-size:13px;display:inline-block;margin-bottom:6px}
.bar{display:flex;gap:8px;padding:8px 10px 12px;align-items:center;flex:none}
.in{flex:1;background:var(--head);border-radius:26px;display:flex;align-items:center;padding:0 6px 0 14px;min-height:50px}.in input{flex:1;min-width:0;padding:12px 8px;font-size:17px;background:none}
.in button{width:40px;height:40px;border-radius:50%;color:var(--dim);font-size:22px}
#sb{width:50px;height:50px;border-radius:50%;background:#2a9df4;color:#fff;font-size:22px;flex:none}
.fld{display:block;width:100%;background:var(--head);color:var(--txt);border-radius:12px;padding:12px 14px;margin:8px 0;border:0;font-size:16px;outline:none}
.pillb{display:block;text-align:center;background:var(--acc);color:#fff;border-radius:12px;padding:12px;margin-top:10px;font-size:16px;width:100%;text-decoration:none;cursor:pointer}
.pillb.r{background:#d6455d}.pillb.t{background:var(--sel);color:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini{background:#3a3326;color:#ffc94a;border-radius:14px;padding:7px 14px}
#sheet{position:absolute;inset:0;z-index:5;background:#0008;display:none;align-items:flex-end}#sheet.on{display:flex}
#sh{background:var(--card);border-radius:22px 22px 0 0;width:100%;max-height:78%;overflow:auto;padding:16px 0 calc(16px + env(safe-area-inset-bottom,0px))}
#sh h3{font-weight:500;padding:0 20px 10px;font-size:19px}
#toast{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;border-radius:20px;padding:9px 18px;display:none;z-index:9;white-space:nowrap}
#auth{position:absolute;inset:0;z-index:8;background:var(--bg);display:flex;flex-direction:column;justify-content:center;padding:0 28px}
#auth .logo{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,#9a3fc0,#2a9df4);display:grid;place-items:center;font-size:40px;margin:0 auto 18px}
#auth h1{text-align:center;font-weight:500;font-size:26px;margin-bottom:4px}#auth p{text-align:center;color:var(--dim);margin-bottom:22px}
#auth .err{color:#ef4444;font-size:14px;min-height:18px;text-align:center;margin:-4px 0 6px}
#auth .sw{text-align:center;color:var(--acc);margin-top:14px;cursor:pointer}
.tile{background:var(--card);border-radius:18px;aspect-ratio:.82;position:relative;overflow:hidden;display:grid;place-items:center;cursor:pointer;padding-bottom:42px}
.seg{display:flex;background:var(--card);border-radius:24px;margin:10px 14px;padding:5px;gap:2px}.seg button{flex:1;padding:9px 6px;border-radius:20px;color:var(--dim);font-size:15px}.seg .on{background:var(--sel);color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:6px 12px}
.big{display:grid;justify-items:center;padding:14px 0 6px;text-align:center}
</style>
</head>
<body>
<div id="app">
  <div id="auth"></div>

  <div class="scr on" id="s-chats">
    <div class="hd"><span>BelugaCord</span><span class="dots" onclick="go('settings')">⋮</span></div>
    <input class="srch" id="q" placeholder="Поиск чатов, каналов, групп" oninput="globalSearch()">
    <div class="sc" id="chl"></div>
  </div>

  <div class="scr" id="s-contacts">
    <div class="hd"><span>Контакты</span><span class="dots" onclick="openSearch('users')">🔍</span></div>
    <div class="sc" id="cts"></div>
  </div>

  <div class="scr" id="s-settings">
    <div class="hd"><span>Настройки</span><span class="dots">⋮</span></div>
    <div class="sc" id="set"></div>
  </div>

  <div class="scr" id="s-profile">
    <div class="hd"><span>Профиль</span><span class="dots">⋮</span></div>
    <div class="sc" id="prf"></div>
  </div>

  <div class="scr ov" id="chat">
    <div class="top">
      <button class="back" onclick="closeChat()">←</button>
      <div class="pill" onclick="openProfile()"><span id="pa"></span><div><b id="pn"></b><span class="dim sm" id="ps"></span></div></div>
      <button class="back" onclick="showChatMenu()">⋮</button>
    </div>
    <div id="msgs"></div>
    <div class="bar" id="bar">
      <div class="in"><input id="txt" placeholder="Сообщение" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}">
        <button onclick="sendMedia('voice')" title="Голосовое">🎤</button>
        <button onclick="sendMedia('circle')" title="Видео-кружок">📹</button>
        <button onclick="sendMedia('file')" title="Файл">📎</button>
      </div>
      <button id="sb" onclick="send()">➤</button>
    </div>
  </div>

  <div class="scr ov" id="pg">
    <div class="top"><button class="back" onclick="closePg()">←</button><div id="pgt" style="flex:1;font-size:22px;padding-left:6px"></div></div>
    <div class="sc" id="pgb"></div>
  </div>

  <div id="nav">
    <button data-t="chats" class="on" onclick="go('chats')"><span class="e">💬</span>Чаты</button>
    <button data-t="contacts" onclick="go('contacts')"><span class="e">👤</span>Контакты</button>
    <button data-t="settings" onclick="go('settings')"><span class="e">⚙️</span>Настройки</button>
    <button data-t="profile" onclick="go('profile')"><span class="e">🙂</span>Профиль</button>
  </div>

  <div id="sheet" onclick="if(event.target===this)closeS()"><div id="sh"></div></div>
  <div id="toast"></div>
</div>
<input type="file" id="mediaInput" style="display:none" onchange="uploadMedia(this)">
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const API = ""; 
let TOKEN = localStorage.getItem("bc_token") || "";
let ME = null, CUR = null, TAB = "chats";
let CHATS = [], CHANNELS = [], GROUPS = [];
let UPLOAD_KIND = null;

const hm = t => new Date(t).toLocaleTimeString("ru", {hour:"2-digit", minute:"2-digit"});
const av = (c, s) => {
  const bg = c.avatar ? `background-image:url('${c.avatar}')` : `background:linear-gradient(#a855f7,#6366f1)`;
  const letter = c.avatar ? "" : (c.name||c.username||"?")[0].toUpperCase();
  return `<span class="av" style="width:${s}px;height:${s}px;font-size:${s*.4}px;${bg}">${letter}</span>`;
};

async function api(path, method="GET", body=null) {
  const headers = {"Content-Type":"application/json"};
  if (TOKEN) headers["Authorization"] = "Bearer " + TOKEN;
  const res = await fetch(API + path, {method, headers, body: body ? JSON.stringify(body) : null});
  if (res.status === 401) { logout(); throw new Error("Auth"); }
  const data = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(data.detail || "Ошибка сервера");
  return data;
}

function toast(t) {
  const e = $("toast"); e.textContent = t; e.style.display = "block";
  clearTimeout(e.t); e.t = setTimeout(() => e.style.display = "none", 2500);
}

function sheet(html) { $("sh").innerHTML = html; $("sheet").classList.add("on"); }
function closeS() { $("sheet").classList.remove("on"); }

function go(t) {
  TAB = t;
  document.querySelectorAll(".scr:not(.ov)").forEach(s => s.classList.toggle("on", s.id === "s-"+t));
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
  if (t === "profile") drawProfile();
  if (t === "settings") drawSettings();
  if (t === "contacts") drawContacts();
}

function logout() {
  TOKEN = ""; localStorage.removeItem("bc_token"); ME = null;
  location.reload();
}

// --- АВТОРИЗАЦИЯ ---
function drawAuth(reg=false) {
  $("auth").style.display = "flex";
  $("auth").innerHTML = `
    <div class="logo">😼</div>
    <h1>BelugaCord</h1>
    <p>${reg ? "Создание аккаунта" : "Вход в аккаунт"}</p>
    ${reg ? '<input id="a_n" class="fld" placeholder="Имя">' : ""}
    <input id="a_u" class="fld" placeholder="@юзернейм" autocapitalize="off">
    <input id="a_p" class="fld" type="password" placeholder="Пароль">
    <div class="err" id="a_e"></div>
    <button class="pillb" onclick="doAuth(${reg})">${reg ? "Зарегистрироваться" : "Войти"}</button>
    <div class="sw" onclick="drawAuth(${!reg})">${reg ? "Уже есть аккаунт? Войти" : "Нет аккаунта? Создать"}</div>
  `;
}

async function doAuth(reg) {
  const u = $("a_u").value.trim().replace(/^@/,"").toLowerCase(), p = $("a_p").value;
  if (!u || p.length < 4) return $("a_e").textContent = "Юзернейм и пароль (от 4 символов)";
  try {
    const data = await api(reg ? "/api/register" : "/api/login", "POST", reg ? {username:u, name:$("a_n").value.trim()||u, password:p} : {username:u, password:p});
    TOKEN = data.token; localStorage.setItem("bc_token", TOKEN);
    $("auth").style.display = "none";
    initApp();
  } catch(e) { $("a_e").textContent = e.message; }
}

// --- ИНИЦИАЛИЗАЦИЯ ---
async function initApp() {
  try {
    ME = await api("/api/me");
    await loadAll();
    drawChats();
    go("chats");
  } catch(e) { if(e.message!=="Auth") toast(e.message); }
}

async function loadAll() {
  try {
    CHANNELS = await api("/api/channels/search?q=");
  } catch(e) { CHANNELS = []; }
  try {
    GROUPS = await api("/api/groups");
  } catch(e) { GROUPS = []; }
  // Заглушка для личных чатов (в будущем — запрос к /api/chats)
  CHATS = [];
}

// --- ГЛАВНЫЙ ЭКРАН (ЧАТЫ / КАНАЛЫ / ГРУППЫ) ---
function drawChats() {
  let html = "";
  if (CHANNELS.length) {
    html += `<div class="cap">Каналы</div>`;
    html += CHANNELS.map(c => `
      <div class="row" onclick="openChannel(${c.id})">
        ${av({name:c.title, avatar:c.avatar}, 56)}
        <div class="mid"><div class="r1"><b>${esc(c.title)}</b><span class="t">${c.subs||0} 👥</span></div>
        <div class="r2"><span class="pre">@${esc(c.uname)}</span></div></div>
      </div>`).join("");
  }
  if (GROUPS.length) {
    html += `<div class="cap" style="margin-top:10px">Группы</div>`;
    html += GROUPS.map(g => `
      <div class="row" onclick="openGroup(${g.id})">
        ${av({name:g.name, avatar:g.avatar}, 56)}
        <div class="mid"><div class="r1"><b>${esc(g.name)}</b><span class="t">${g.members||0} 👥</span></div>
        <div class="r2"><span class="pre">${esc(g.bio||"")}</span></div></div>
      </div>`).join("");
  }
  if (!CHANNELS.length && !GROUPS.length) {
    html = `<div class="dim" style="text-align:center;padding:40px">Пока пусто.<br>Создай канал или группу в настройках.</div>`;
  }
  $("chl").innerHTML = html;
}

function drawContacts() {
  $("cts").innerHTML = `<div class="card">
    <button class="li" onclick="openSearch('users')"><span class="ico" style="background:#2a8bd8">🔍</span>Найти людей</button>
    <button class="li" onclick="openSearch('channels')"><span class="ico" style="background:#2fb344">📣</span>Найти каналы</button>
  </div>`;
}

// --- ПРОФИЛЬ ---
function drawProfile() {
  if (!ME) return;
  $("prf").innerHTML = `
    <div class="big">
      ${av(ME, 120)}
      <div style="font-size:24px;font-weight:500;margin-top:10px">${esc(ME.name)} ${ME.premium?'<span style="color:var(--acc)">⭐</span>':''}</div>
      <div class="dim">@${esc(ME.username)}</div>
      <div class="dim">◈ ${ME.becoins} бекоинов</div>
    </div>
    <div class="card">
      <div class="li" style="display:block">${esc(ME.bio||"Нет описания")}<div class="dim sm">О себе</div></div>
      <button class="li" onclick="editProfile()"><span class="ico" style="background:#4fa3ea">✏️</span>Редактировать профиль</button>
    </div>
    <div class="card">
      <button class="li" onclick="go('settings')"><span class="ico" style="background:#64748b">⚙️</span>Настройки</button>
      <button class="li" onclick="logout()"><span class="ico" style="background:#d6455d">🚪</span>Выйти</button>
    </div>
  `;
}

function editProfile() {
  sheet(`<h3>Редактировать профиль</h3>
    <div style="padding:0 20px">
      <input id="ep_n" class="fld" placeholder="Имя" value="${esc(ME.name)}">
      <textarea id="ep_b" class="fld" placeholder="О себе" rows="3">${esc(ME.bio)}</textarea>
      <button class="pillb" onclick="saveProfile()">Сохранить</button>
    </div>`);
}

async function saveProfile() {
  try {
    await api("/api/me/edit", "POST", {name:$("ep_n").value.trim(), bio:$("ep_b").value.trim()});
    ME = await api("/api/me");
    closeS(); drawProfile(); toast("Сохранено");
  } catch(e) { toast(e.message); }
}

// --- НАСТРОЙКИ ---
function drawSettings() {
  if (!ME) return;
  let ownerPanel = "";
  if (ME.role === "owner") {
    ownerPanel = `<div class="card"><button class="li" onclick="openOwnerPanel()"><span class="ico" style="background:#d6455d">👑</span>Панель владельца</button></div>`;
  }
  $("set").innerHTML = `
    <div class="card">
      <button class="li" onclick="createChannel()"><span class="ico" style="background:#2a8bd8">📣</span>Создать канал</button>
      <button class="li" onclick="createGroup()"><span class="ico" style="background:#2fb344">👥</span>Создать группу</button>
    </div>
    ${ownerPanel}
    <div class="card">
      <button class="li" onclick="theme()"><span class="ico" style="background:#64748b">🌓</span>Сменить тему</button>
    </div>
  `;
}

function theme() { const r=document.documentElement; r.dataset.theme = r.dataset.theme==="light" ? "dark" : "light"; }
</script>
<script>
// --- ЧАТЫ И СООБЩЕНИЯ ---
async function openChannel(id) {
  const ch = CHANNELS.find(c => c.id === id);
  if (!ch) return;
  CUR = {type:"channel", id:ch.id, title:ch.title, avatar:ch.avatar, uname:ch.uname};
  $("pa").innerHTML = av(ch, 42);
  $("pn").textContent = ch.title;
  $("ps").textContent = "@" + ch.uname;
  $("chat").classList.add("on");
  $("nav").style.display = "none";
  const posts = await api(`/api/channels/${ch.id}/posts`);
  let html = '<div class="chip">Посты</div>';
  if (!posts.length) html += '<div class="dim" style="text-align:center">Пусто</div>';
  posts.forEach(p => {
    const isOwner = ME.role === "owner" || (ch.owner_id === ME.id);
    html += `<div class="b">${esc(p.text)}<span class="mt">${hm(p.ts)}</span>
      ${isOwner ? `<div style="margin-top:5px;font-size:12px" class="dim">✏️ <span onclick="editPost(${p.id},'${esc(p.text)}')">ред</span> | 🗑 <span onclick="delPost(${p.id})">удал</span></div>` : ""}
    </div>`;
  });
  $("msgs").innerHTML = html;
  $("msgs").scrollTop = 1e9;
  $("bar").style.display = ch.owner_id === ME.id || ME.role === "owner" ? "flex" : "none";
  $("sb").onclick = sendPost;
  $("txt").onkeydown = (e) => { if(e.key==="Enter"){ e.preventDefault(); sendPost(); } };
}

async function sendPost() {
  const t = $("txt").value.trim(); if (!t || !CUR) return;
  try {
    await api(`/api/channels/${CUR.id}/post`, "POST", {text:t});
    $("txt").value = ""; openChannel(CUR.id);
  } catch(e) { toast(e.message); }
}

async function editPost(pid, oldText) {
  const t = prompt("Изменить пост:", oldText);
  if (t) { await api(`/api/channels/posts/${pid}/edit`, "POST", {text:t}); openChannel(CUR.id); }
}

async function delPost(pid) {
  if (confirm("Удалить пост?")) { await api(`/api/channels/posts/${pid}/delete`, "POST"); openChannel(CUR.id); }
}

async function openGroup(id) {
  const g = GROUPS.find(x => x.id === id); if (!g) return;
  CUR = {type:"group", id:g.id, title:g.name, avatar:g.avatar};
  $("pa").innerHTML = av(g, 42);
  $("pn").textContent = g.name;
  $("ps").textContent = g.members + " участников";
  $("chat").classList.add("on");
  $("nav").style.display = "none";
  const msgs = await api(`/api/groups/${g.id}/msgs`);
  let html = '<div class="chip">Группа</div>';
  msgs.forEach(m => {
    const out = m.frm === ME.id ? "out" : "";
    html += `<div class="b ${out}"><b style="font-size:12px;color:var(--acc)">${esc(m.author)}</b><br>${esc(m.text)}<span class="mt">${hm(m.ts)}</span></div>`;
  });
  $("msgs").innerHTML = html;
  $("msgs").scrollTop = 1e9;
  $("bar").style.display = "flex";
  $("sb").onclick = sendGroupMsg;
  $("txt").onkeydown = (e) => { if(e.key==="Enter"){ e.preventDefault(); sendGroupMsg(); } };
}

async function sendGroupMsg() {
  const t = $("txt").value.trim(); if (!t || !CUR) return;
  await api(`/api/groups/${CUR.id}/send`, "POST", {text:t});
  $("txt").value = ""; openGroup(CUR.id);
}

function closeChat() {
  CUR = null; $("chat").classList.remove("on"); $("nav").style.display = "flex"; drawChats();
}

function send() { CUR?.type === "channel" ? sendPost() : sendGroupMsg(); }

// --- МЕДИА (ЗАГРУЗКА) ---
function sendMedia(kind) { UPLOAD_KIND = kind; $("mediaInput").click(); }
async function uploadMedia(input) {
  const file = input.files[0]; if (!file) return;
  const fd = new FormData(); fd.append("file", file); fd.append("kind", UPLOAD_KIND); fd.append("to", 0);
  try {
    const res = await fetch("/api/upload", {method:"POST", headers:{Authorization:"Bearer "+TOKEN}, body:fd});
    if (!res.ok) throw new Error("Ошибка загрузки");
    toast("Файл загружен (в демо не отображается)");
  } catch(e) { toast(e.message); }
  input.value = "";
}

// --- СОЗДАНИЕ И РЕДАКТИРОВАНИЕ ---
function createChannel() {
  sheet(`<h3>Создать канал</h3>
    <div style="padding:0 20px">
      <input id="c_t" class="fld" placeholder="Название канала">
      <input id="c_u" class="fld" placeholder="@юзернейм (лат., от 5 символов)">
      <textarea id="c_b" class="fld" placeholder="Описание" rows="2"></textarea>
      <button class="pillb" onclick="doCreateChannel()">Создать</button>
    </div>`);
}

async function doCreateChannel() {
  try {
    const data = await api("/api/channels", "POST", {title:$("c_t").value, uname:$("c_u").value, bio:$("c_b").value});
    closeS(); await loadAll(); drawChats(); openChannel(data.id);
    toast("Канал создан");
  } catch(e) { toast(e.message); }
}

function createGroup() {
  sheet(`<h3>Создать группу</h3>
    <div style="padding:0 20px">
      <input id="g_n" class="fld" placeholder="Название группы">
      <textarea id="g_b" class="fld" placeholder="Описание" rows="2"></textarea>
      <button class="pillb" onclick="doCreateGroup()">Создать</button>
    </div>`);
}

async function doCreateGroup() {
  try {
    await api("/api/groups", "POST", {name:$("g_n").value, bio:$("g_b").value});
    closeS(); await loadAll(); drawChats(); toast("Группа создана");
  } catch(e) { toast(e.message); }
}

// --- ГЛОБАЛЬНЫЙ ПОИСК ---
async function globalSearch() {
  const q = $("q").value.trim();
  if (!q) return drawChats();
  try {
    const data = await api(`/api/search?q=${encodeURIComponent(q)}`);
    let html = "";
    if (data.users.length) {
      html += `<div class="cap">Пользователи</div>`;
      html += data.users.map(u => `<div class="row" onclick="openChatWith(${u.id})">${av(u,50)}<div class="mid"><b>${esc(u.name)}</b><div class="dim sm">@${esc(u.username)}</div></div></div>`).join("");
    }
    if (data.channels.length) {
      html += `<div class="cap">Каналы</div>`;
      html += data.channels.map(c => `<div class="row" onclick="openChannel(${c.id})">${av({name:c.name, avatar:c.avatar},50)}<div class="mid"><b>${esc(c.name)}</b><div class="dim sm">@${esc(c.username)}</div></div></div>`).join("");
    }
    if (data.groups.length) {
      html += `<div class="cap">Группы</div>`;
      html += data.groups.map(g => `<div class="row" onclick="openGroup(${g.id})">${av({name:g.name},50)}<div class="mid"><b>${esc(g.name)}</b></div></div>`).join("");
    }
    if (!html) html = '<div class="dim" style="text-align:center;padding:40px">Ничего не найдено</div>';
    $("chl").innerHTML = html;
  } catch(e) { toast(e.message); }
}

function openSearch() { go("contacts"); }
function openProfile() { if (CUR) toast("Профиль собеседника в разработке"); }
function openChatWith(id) { toast("Личные сообщения в разработке (добавим позже)"); }
function showChatMenu() { if (CUR?.type==="group") { groupMenu(); } else { toast("Меню канала"); } }

// --- ПАНЕЛЬ ВЛАДЕЛЬЦА ---
function openOwnerPanel() {
  $("pgt").textContent = "👑 Панель Владельца";
  $("pgb").innerHTML = `
    <div class="seg">
      <button class="on" onclick="ownerTab('stats',this)">Стата</button>
      <button onclick="ownerTab('users',this)">Юзеры</button>
      <button onclick="ownerTab('channels',this)">Каналы</button>
      <button onclick="ownerTab('groups',this)">Группы</button>
      <button onclick="ownerTab('broadcast',this)">Рассылка</button>
    </div>
    <div id="ownerContent"></div>
  `;
  $("pg").classList.add("on");
  ownerTab('stats');
}

async function ownerTab(tab, btn) {
  if (btn) { document.querySelectorAll(".seg button").forEach(b=>b.classList.remove("on")); btn.classList.add("on"); }
  const c = $("ownerContent");
  if (tab === 'stats') {
    const s = await api("/api/owner/stats");
    c.innerHTML = `<div class="card" style="padding:16px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div>👥 Юзеры: <b>${s.users}</b></div>
        <div>⛔ Баны: <b>${s.banned}</b></div>
        <div>⭐ Премиум: <b>${s.premium}</b></div>
        <div>💬 Сообщений: <b>${s.messages}</b></div>
        <div>📣 Каналов: <b>${s.channels}</b></div>
        <div>👥 Групп: <b>${s.groups}</b></div>
        <div>📝 Постов: <b>${s.posts}</b></div>
      </div>
    </div>`;
  }
  if (tab === 'users') {
    const users = await api("/api/owner/users");
    c.innerHTML = `<div class="card">${users.map(u => `
      <div class="row">
        ${av(u, 44)}
        <div class="mid"><b>${esc(u.name)}</b><div class="dim sm">@${esc(u.username)} · ◈${u.becoins} ${u.banned?'⛔':''} ${u.role==='owner'?'👑':''}</div></div>
        <button class="mini" onclick="userActions(${u.id},'${esc(u.username)}')">⋮</button>
      </div>`).join("")}</div>`;
  }
  if (tab === 'channels') {
    const chs = await api("/api/owner/all_channels");
    c.innerHTML = `<div class="card">${chs.map(ch => `
      <div class="row">
        ${av({name:ch.title, avatar:ch.avatar}, 44)}
        <div class="mid"><b>${esc(ch.title)}</b><div class="dim sm">@${esc(ch.uname)} · ${ch.subs} подписчиков</div></div>
        <button class="mini" style="background:#d6455d;color:#fff" onclick="ownerDelChannel(${ch.id})">🗑</button>
      </div>`).join("")}</div>`;
  }
  if (tab === 'groups') {
    const gs = await api("/api/owner/all_groups");
    c.innerHTML = `<div class="card">${gs.map(g => `
      <div class="row">
        ${av({name:g.name, avatar:g.avatar}, 44)}
        <div class="mid"><b>${esc(g.name)}</b><div class="dim sm">${g.members} участников</div></div>
        <button class="mini" style="background:#d6455d;color:#fff" onclick="ownerDelGroup(${g.id})">🗑</button>
      </div>`).join("")}</div>`;
  }
  if (tab === 'broadcast') {
    c.innerHTML = `<div class="card" style="padding:16px">
      <textarea id="bc_t" class="fld" rows="3" placeholder="Текст рассылки всем юзерам..."></textarea>
      <button class="pillb" onclick="doBroadcast()">Отправить всем</button>
    </div>`;
  }
}

function userActions(id, uname) {
  sheet(`<h3>@${esc(uname)}</h3>
    <div style="padding:0 20px">
      <button class="pillb" onclick="giveCoins(${id})">💰 Выдать бекоины</button>
      <button class="pillb" onclick="givePrem(${id})">⭐ Выдать Premium</button>
      <button class="pillb r" onclick="ownerBan(${id})">⛔ Забанить</button>
      <button class="pillb t" onclick="ownerUnban(${id})">✅ Разбанить</button>
    </div>`);
}

async function giveCoins(id) {
  const a = prompt("Сколько бекоинов выдать?", "100");
  if (a) { await api("/api/owner/coins", "POST", {user_id:id, amount:+a}); toast("Выдано"); closeS(); }
}
async function givePrem(id) {
  const d = prompt("Сколько дней Premium?", "7");
  if (d) { await api("/api/owner/premium", "POST", {user_id:id, days:+d}); toast("Выдано"); closeS(); }
}
async function ownerBan(id) { await api("/api/owner/ban", "POST", {user_id:id}); toast("Забанен"); closeS(); ownerTab('users'); }
async function ownerUnban(id) { await api("/api/owner/unban", "POST", {user_id:id}); toast("Разбанен"); closeS(); ownerTab('users'); }
async function ownerDelChannel(id) { if(confirm("Удалить канал?")) { await api(`/api/owner/channel/delete`, "POST", new URLSearchParams({cid:id})); ownerTab('channels'); } }
async function ownerDelGroup(id) { if(confirm("Удалить группу?")) { await api(`/api/owner/group/delete`, "POST", new URLSearchParams({gid:id})); ownerTab('groups'); } }
async function doBroadcast() {
  const t = $("bc_t").value.trim(); if (!t) return;
  const r = await api("/api/owner/broadcast", "POST", {text:t});
  toast(`Отправлено ${r.sent} юзерам`); $("bc_t").value = "";
}

function closePg() { $("pg").classList.remove("on"); }

// --- СТАРТ ---
if (TOKEN) initApp(); else drawAuth(false);
</script>
</body>
</html>
