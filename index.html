<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BelugaCord</title>
<style>
:root{--bg:#151c26;--card:#1d2733;--head:#202c3a;--acc:#4fa3ea;--txt:#fff;--dim:#8a99ab;--line:#121a23;--in:#1e2c3b;--nav:#1e2a38;--sel:#2b4259}
html,body{height:100%;background:#000;margin:0;font:16px/1.3 -apple-system,sans-serif;color:var(--txt)}
#app{max-width:480px;height:100vh;margin:0 auto;position:relative;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
.scr{position:absolute;inset:0;display:none;flex-direction:column}.scr.on{display:flex}
.sc{flex:1;overflow:auto;padding:0 0 110px}
.hd{display:flex;justify-content:space-between;padding:12px 16px;font-size:22px;font-weight:500}
.srch{margin:6px 14px;background:var(--head);border-radius:24px;padding:13px 18px;border:0;color:#fff;outline:none;width:calc(100% - 28px)}
.row{display:flex;gap:14px;padding:9px 16px;align-items:center;cursor:pointer}.row:active{background:var(--card)}
.av{border-radius:50%;display:grid;place-items:center;color:#fff;flex:none;background:linear-gradient(#a855f7,#6366f1);background-size:cover;background-position:center}
.mid{flex:1;overflow:hidden}.r1{display:flex;justify-content:space-between}.r1 b{font-size:17px}.dim{color:var(--dim);font-size:13px}
.card{background:var(--card);border-radius:18px;margin:10px 14px;overflow:hidden}
.li{display:flex;gap:16px;padding:13px 16px;width:100%;text-align:left;border:0;background:none;color:#fff;border-bottom:1px solid var(--line);cursor:pointer}
.ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px}
#nav{position:absolute;left:12px;right:12px;bottom:12px;background:var(--nav);border-radius:32px;display:flex;padding:6px;z-index:2}
#nav button{flex:1;padding:8px 0;border-radius:26px;color:var(--dim);background:none;border:0;font-size:13px}
#nav button.on{background:var(--sel);color:var(--acc)}
.back{width:44px;height:44px;border-radius:50%;background:var(--head);display:grid;place-items:center;font-size:22px;border:0;color:#fff;cursor:pointer}
.top{display:flex;gap:8px;padding:10px 12px;align-items:center}
#msgs{flex:1;overflow:auto;padding:8px 10px;display:flex;flex-direction:column;gap:3px}
.b{max-width:80%;padding:8px 12px;border-radius:18px;background:var(--in);align-self:flex-start;word-break:break-word;position:relative}
.b.out{background:linear-gradient(135deg,#9a3fc0,#6f55dc);align-self:flex-end}
.b .mt{float:right;margin:8px 0 -2px 10px;font-size:11px;color:#aaa;display:inline-block}
.pinned{background:#2a2f4a;border:1px solid #4fa3ea;border-radius:12px;margin:4px 0;padding:4px 8px;font-size:13px;color:#8ab4f8}
.rx{display:flex;gap:4px;margin-top:4px}.rx span{background:#ffffff22;padding:2px 6px;border-radius:10px;font-size:12px;cursor:pointer}
.bar{display:flex;gap:8px;padding:8px 10px;align-items:center;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.in{flex:1;background:var(--head);border-radius:26px;display:flex;padding:0 10px;align-items:center}
.in input{flex:1;padding:12px 8px;border:0;background:none;color:#fff;outline:none;min-width:0}
.in button{background:none;border:0;font-size:20px;color:var(--dim);cursor:pointer}
#sb{width:50px;height:50px;border-radius:50%;background:#2a9df4;color:#fff;font-size:22px;border:0;cursor:pointer}
.fld{display:block;width:100%;background:var(--head);color:#fff;border-radius:12px;padding:12px;margin:8px 0;border:0;outline:none;box-sizing:border-box}
.pillb{display:block;text-align:center;background:var(--acc);color:#fff;border-radius:12px;padding:12px;margin-top:10px;border:0;width:100%;cursor:pointer}
#auth{position:absolute;inset:0;z-index:9;background:var(--bg);display:flex;flex-direction:column;justify-content:center;padding:0 28px}
#auth h1{text-align:center}#auth p{text-align:center;color:var(--dim)}
#sheet{position:absolute;inset:0;z-index:5;background:#0008;display:none;align-items:flex-end}#sheet.on{display:flex}
#sh{background:var(--card);border-radius:22px 22px 0 0;width:100%;max-height:80%;overflow:auto;padding:16px}
#toast{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;border-radius:20px;padding:9px 18px;display:none;z-index:9;font-size:14px}
.mini{background:#3a3326;color:#ffc94a;border-radius:10px;padding:4px 10px;border:0;font-size:13px;cursor:pointer}
.seg{display:flex;background:var(--card);border-radius:24px;margin:10px 14px;padding:5px;gap:2px}
.seg button{flex:1;padding:9px;border-radius:20px;border:0;background:none;color:var(--dim)}
.seg .on{background:var(--sel);color:var(--acc)}
</style>
</head>
<body>
<div id="app">
  <div id="auth"></div>

  <div class="scr on" id="s-chats">
    <div class="hd"><span>BelugaCord</span><span style="cursor:pointer" onclick="go('settings')">⋮</span></div>
    <input class="srch" id="q" placeholder="Поиск" oninput="globalSearch()">
    <div class="sc" id="chl"></div>
  </div>

  <div class="scr" id="s-contacts">
    <div class="hd"><span>Контакты</span><span style="cursor:pointer" onclick="go('chats')">💬</span></div>
    <div class="sc" id="cts"></div>
  </div>

  <div class="scr" id="s-settings">
    <div class="hd"><span>Настройки</span><span style="cursor:pointer" onclick="go('chats')">💬</span></div>
    <div class="sc" id="set"></div>
  </div>

  <div class="scr" id="s-profile">
    <div class="hd"><span>Профиль</span><span style="cursor:pointer" onclick="go('chats')">💬</span></div>
    <div class="sc" id="prf"></div>
  </div>

  <div class="scr" id="chat" style="z-index:3;background:var(--bg)">
    <div class="top">
      <button class="back" onclick="closeChat()">←</button>
      <div style="flex:1;padding:0 10px;overflow:hidden"><b id="pn" style="font-size:17px"></b><div class="dim" id="ps"></div></div>
      <button class="back" onclick="chatMenu()">⋮</button>
    </div>
    <div id="msgs"></div>
    <div class="bar">
      <div class="in">
        <button onclick="sendMedia('voice')">🎤</button>
        <button onclick="sendMedia('circle')">📹</button>
        <button onclick="sendMedia('file')">📎</button>
        <input id="txt" placeholder="Сообщение..." onkeydown="if(event.key==='Enter')send()">
      </div>
      <button id="sb" onclick="send()">➤</button>
    </div>
  </div>

  <div class="scr" id="pg" style="z-index:4;background:var(--bg)">
    <div class="top"><button class="back" onclick="closePg()">←</button><div id="pgt" style="font-size:20px;flex:1"></div></div>
    <div class="sc" id="pgb"></div>
  </div>

  <div id="nav">
    <button class="on" onclick="go('chats')">💬 Чаты</button>
    <button onclick="go('contacts')">👤 Контакты</button>
    <button onclick="go('settings')">⚙️ Настройки</button>
    <button onclick="go('profile')">🙂 Профиль</button>
  </div>

  <div id="sheet" onclick="if(event.target.id==='sheet')closeS()"><div id="sh"></div></div>
  <div id="toast"></div>
</div>
<input type="file" id="mediaInput" style="display:none" onchange="uploadMedia(this)">
<input type="file" id="avatarInput" style="display:none" onchange="uploadAvatar(this)">

<script>
let TOKEN = localStorage.getItem("bc_token") || "";
let ME = null, CUR = null, WS = null, REC = null, REC_TYPE = null, REC_CHUNKS = [], AVATAR_TARGET = null;
const $ = id => document.getElementById(id);
const esc = s => String(s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hm = t => new Date(t).toLocaleTimeString("ru",{hour:"2-digit",minute:"2-digit"});

async function api(path, method="GET", body=null) {
  const headers = {"Content-Type":"application/json"};
  if (TOKEN) headers["Authorization"] = "Bearer " + TOKEN;
  const res = await fetch(path, {method, headers, body: body ? JSON.stringify(body) : null});
  if (res.status === 401) { logout(); throw new Error("Auth"); }
  return res.json();
}

function toast(t) { const e=$("toast"); e.textContent=t; e.style.display="block"; clearTimeout(e.t); e.t=setTimeout(()=>e.style.display="none",2500); }
function sheet(h) { $("sh").innerHTML=h; $("sheet").classList.add("on"); }
function closeS() { $("sheet").classList.remove("on"); }
function go(t) { document.querySelectorAll(".scr").forEach(s=>s.classList.remove("on")); $("s-"+t).classList.add("on"); if(t==="profile")drawProfile(); if(t==="settings")drawSettings(); if(t==="contacts")drawContacts(); }
function logout() { TOKEN=""; localStorage.removeItem("bc_token"); location.reload(); }

// --- АВТОРИЗАЦИЯ ---
function drawAuth(reg=false) {
  $("auth").style.display="flex";
  $("auth").innerHTML = `<div style="font-size:60px;text-align:center">😼</div><h1>BelugaCord</h1><p>${reg?"Регистрация":"Вход"}</p>
  ${reg?'<input id="a_n" class="fld" placeholder="Имя">':''}
  <input id="a_u" class="fld" placeholder="@юзернейм"><input id="a_p" class="fld" type="password" placeholder="Пароль">
  <div id="a_e" style="color:red;text-align:center"></div>
  <button class="pillb" onclick="doAuth(${reg})">${reg?"Создать":"Войти"}</button>
  <div style="text-align:center;margin-top:14px;color:var(--acc);cursor:pointer" onclick="drawAuth(${!reg})">${reg?"Уже есть аккаунт?":"Нет аккаунта? Создать"}</div>`;
}
async function doAuth(reg) {
  const u=$("a_u").value.trim().toLowerCase(), p=$("a_p").value;
  if (u.length<5||p.length<4) return $("a_e").textContent="Юз от 5, пароль от 4 символов";
  try {
    const d = await api(reg?"/api/register":"/api/login", "POST", reg?{username:u,name:$("a_n").value||u,password:p}:{username:u,password:p});
    TOKEN=d.token; localStorage.setItem("bc_token",TOKEN); $("auth").style.display="none"; init();
  } catch(e) { $("a_e").textContent=e.detail||"Ошибка"; }
}

// --- ИНИЦИАЛИЗАЦИЯ ---
async function init() {
  ME = await api("/api/me"); if (!ME || ME.detail) return drawAuth();
  connectWS(); loadChats(); go("chats");
}
function connectWS() {
  if (WS) WS.close();
  WS = new WebSocket(`ws${location.protocol==="https:"?"s":""}://${location.host}/ws?token=${TOKEN}`);
  WS.onmessage = e => {
    const d = JSON.parse(e.data);
    if (d.type === "msg") {
      if (CUR && (d.msg.frm === CUR.id || d.msg.to === CUR.id)) {
        if (d.msg.frm !== ME.id) renderMsg(d.msg, false);
      }
      if (CUR?.type === "dm") loadChats();
    }
  };
  WS.onclose = () => setTimeout(connectWS, 3000);
}

// --- ЧАТЫ ---
async function loadChats() {
  try {
    const chats = await api("/api/chats");
    let h = `<div class="card">`;
    if (!chats.length) h += `<div style="padding:20px;text-align:center;color:var(--dim)">Нет сообщений. Найди друга в поиске!</div>`;
    chats.forEach(c => {
      h += `<div class="row" onclick="openDM(${c.id},'${esc(c.name)}','${c.avatar||""}')">
      <span class="av" style="width:50px;height:50px;${c.avatar?`background-image:url('${c.avatar}')`:''}">${c.avatar?"":esc(c.name[0])}</span>
      <div class="mid"><div class="r1"><b>${esc(c.name)}</b><span class="dim">${c.last_ts?hm(c.last_ts):""}</span></div>
      <div class="dim" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.last_msg||"")}</div></div></div>`;
    });
    h += `</div>`;
    $("chl").innerHTML = h;
  } catch(e) { $("chl").innerHTML = "Ошибка загрузки"; }
}

// --- ЛИЧНЫЕ СООБЩЕНИЯ (DM) ---
async function openDM(id, name, avatar) {
  CUR = { type:"dm", id, name, avatar };
  $("pn").textContent = name;
  $("ps").textContent = "Личный чат";
  $("chat").classList.add("on");
  $("nav").style.display = "none";
  const msgs = await api(`/api/chat/${id}`);
  $("msgs").innerHTML = "";
  msgs.forEach(m => renderMsg(m, m.frm === ME.id));
  $("msgs").scrollTop = 1e9;
}

function send() {
  const t = $("txt").value.trim(); if (!t || !CUR) return;
  $("txt").value = "";
  if (CUR.type === "dm") {
    if (WS && WS.readyState === WebSocket.OPEN) WS.send(JSON.stringify({type:"msg", to:CUR.id, text:t}));
    else api("/api/dm/send", "POST", {to:CUR.id, text:t}).then(() => openDM(CUR.id, CUR.name, CUR.avatar));
  } else if (CUR.type === "channel") {
    api(`/api/channels/${CUR.id}/post`, "POST", {text:t}).then(() => openChannel(CUR.id, CUR.name));
  } else if (CUR.type === "group") {
    api(`/api/groups/${CUR.id}/send`, "POST", {text:t}).then(() => openGroup(CUR.id, CUR.name));
  }
}

function renderMsg(m, out) {
  const d = document.createElement("div"); d.className = "b " + (out?"out":"");
  if (m.pinned) d.innerHTML = `<div class="pinned">📌 Закреплено</div>`;
  if (m.file_path) {
    if (m.kind === "circle") d.innerHTML += `<video src="${m.file_path}" autoplay loop muted playsinline style="width:180px;height:180px;border-radius:50%;object-fit:cover;display:block"></video>`;
    else if (m.kind === "voice") d.innerHTML += `<audio controls src="${m.file_path}" style="width:200px;height:36px"></audio>`;
    else d.innerHTML += `<a href="${m.file_path}" target="_blank" style="color:inherit">📎 ${esc(m.file_name)}</a>`;
  } else d.innerHTML += esc(m.text);
  d.innerHTML += `<span class="mt">${hm(m.ts)}</span>`;
  d.oncontextmenu = (e) => { e.preventDefault(); pinMsg(m.id); };
  $("msgs").appendChild(d); $("msgs").scrollTop = 1e9;
}

async function pinMsg(mid) {
  await api(`/api/pin_dm/${mid}`, "POST");
  toast("Закрепление изменено");
  if (CUR?.type === "dm") openDM(CUR.id, CUR.name, CUR.avatar);
}

// --- МЕДИА (ГОЛОСОВЫЕ И КРУЖКИ) ---
function sendMedia(kind) {
  if (kind === "file") { REC_TYPE = "file"; $("mediaInput").click(); return; }
  startRecording(kind);
}

async function startRecording(kind) {
  try {
    const stream = await navigator.mediaDevices.getUserMedia(kind === "circle" ? {video:{width:320,height:320,facingMode:"user"}} : {audio:true});
    REC_CHUNKS = []; REC_TYPE = kind;
    REC = new MediaRecorder(stream);
    REC.ondataavailable = e => REC_CHUNKS.push(e.data);
    REC.onstop = async () => {
      stream.getTracks().forEach(t=>t.stop());
      const blob = new Blob(REC_CHUNKS, {type: kind==="circle" ? "video/webm" : "audio/webm"});
      const file = new File([blob], `rec_${Date.now()}.webm`, {type: blob.type});
      uploadFile(file, kind);
    };
    REC.start();
    toast(kind==="circle" ? "Запись кружка... нажми еще раз чтобы отправить" : "Запись голосового... нажми еще раз чтобы отправить");
    $("sb").onclick = () => { if(REC&&REC.state==="recording"){REC.stop(); $("sb").onclick=send;} };
    if (kind === "circle") setTimeout(() => { if(REC&&REC.state==="recording") REC.stop(); }, 59000);
  } catch(e) { toast("Нет доступа к микрофону/камере"); }
}

async function uploadFile(file, kind) {
  if (!CUR) return;
  const fd = new FormData(); fd.append("file", file); fd.append("kind", kind); fd.append("to", CUR.id);
  const res = await fetch("/api/upload", {method:"POST", headers:{Authorization:"Bearer "+TOKEN}, body:fd});
  if (res.ok) {
    const msg = await res.json();
    renderMsg(msg, true);
  } else toast("Ошибка загрузки");
}

async function uploadMedia(input) {
  const f = input.files[0]; if (f) await uploadFile(f, "file");
  input.value = "";
}

// --- КАНАЛЫ И ГРУППЫ ---
async function openChannel(id, title) {
  CUR = {type:"channel", id, name:title};
  $("pn").textContent = title; $("ps").textContent = "Канал";
  $("chat").classList.add("on"); $("nav").style.display = "none";
  const posts = await api(`/api/channels/${id}/posts`);
  $("msgs").innerHTML = "";
  if (!posts.length) $("msgs").innerHTML = '<div class="dim" style="text-align:center;padding:20px">Постов пока нет</div>';
  posts.forEach(p => {
    const d = document.createElement("div"); d.className = "b";
    if (p.pinned) d.innerHTML = `<div class="pinned">📌 Закреплено</div>`;
    if (p.file_path) {
      if (p.kind === "circle") d.innerHTML += `<video src="${p.file_path}" autoplay loop muted playsinline style="width:180px;height:180px;border-radius:50%;object-fit:cover;display:block"></video>`;
      else d.innerHTML += `<a href="${p.file_path}" target="_blank">📎 ${esc(p.file_name)}</a>`;
    } else d.innerHTML += esc(p.text);
    d.innerHTML += `<span class="mt">${hm(p.ts)}</span>`;
    d.oncontextmenu = (e) => { e.preventDefault(); pinPost(p.id); };
    $("msgs").appendChild(d);
  });
  $("msgs").scrollTop = 1e9;
}

async function openGroup(id, name) {
  CUR = {type:"group", id, name};
  $("pn").textContent = name; $("ps").textContent = "Группа";
  $("chat").classList.add("on"); $("nav").style.display = "none";
  const msgs = await api(`/api/groups/${id}/msgs`);
  $("msgs").innerHTML = "";
  msgs.forEach(m => {
    const d = document.createElement("div"); d.className = "b " + (m.frm===ME.id?"out":"");
    d.innerHTML = `<b style="font-size:12px;color:var(--acc)">${esc(m.author)}</b><br>`;
    if (m.file_path) d.innerHTML += `<a href="${m.file_path}" target="_blank">📎 ${esc(m.file_name)}</a>`;
    else d.innerHTML += esc(m.text);
    d.innerHTML += `<span class="mt">${hm(m.ts)}</span>`;
    $("msgs").appendChild(d);
  });
  $("msgs").scrollTop = 1e9;
}

async function pinPost(pid) {
  await api(`/api/channels/pin/${pid}`, "POST");
  toast("Пост закреплен");
  if (CUR?.type === "channel") openChannel(CUR.id, CUR.name);
}

function closeChat() { CUR=null; $("chat").classList.remove("on"); $("nav").style.display="flex"; loadChats(); }

// --- ПОИСК ---
async function globalSearch() {
  const q = $("q").value.trim(); if (!q) return loadChats();
  const d = await api(`/api/search?q=${q}`);
  let h = "";
  if (d.users.length) { h += `<div class="cap" style="padding:10px;color:var(--acc)">Люди</div>`; d.users.forEach(u => h += `<div class="row" onclick="openDM(${u.id},'${esc(u.name)}','')"><span class="av" style="width:44px;height:44px">${esc(u.name[0])}</span><div class="mid"><b>${esc(u.name)}</b><div class="dim">@${esc(u.username)}</div></div></div>`); }
  if (d.channels.length) { h += `<div class="cap" style="padding:10px;color:var(--acc)">Каналы</div>`; d.channels.forEach(c => h += `<div class="row" onclick="openChannel(${c.id},'${esc(c.name)}')"><span class="av" style="width:44px;height:44px;background:#2a8bd8">📣</span><div class="mid"><b>${esc(c.name)}</b><div class="dim">@${esc(c.username)}</div></div></div>`); }
  if (d.groups.length) { h += `<div class="cap" style="padding:10px;color:var(--acc)">Группы</div>`; d.groups.forEach(g => h += `<div class="row" onclick="openGroup(${g.id},'${esc(g.name)}')"><span class="av" style="width:44px;height:44px;background:#2fb344">👥</span><div class="mid"><b>${esc(g.name)}</b></div></div>`); }
  $("chl").innerHTML = h || '<div style="padding:20px;text-align:center;color:var(--dim)">Ничего нет</div>';
}

// --- ПРОФИЛЬ И НАСТРОЙКИ ---
function drawProfile() {
  if (!ME) return;
  $("prf").innerHTML = `<div style="text-align:center;padding:20px"><span class="av" style="width:100px;height:100px;font-size:40px">${esc(ME.name[0])}</span>
  <h2>${esc(ME.name)}</h2><div class="dim">@${esc(ME.username)}</div><div class="dim">◈ ${ME.becoins}</div></div>
  <div class="card"><button class="li" onclick="logout()"><span class="ico" style="background:#d6455d">🚪</span>Выйти</button></div>`;
}

function drawSettings() {
  let h = `<div class="card"><button class="li" onclick="createChannel()"><span class="ico" style="background:#2a8bd8">📣</span>Создать канал</button>
  <button class="li" onclick="createGroup()"><span class="ico" style="background:#2fb344">👥</span>Создать группу</button></div>`;
  if (ME && ME.role === "owner") h += `<div class="card"><button class="li" onclick="ownerPanel()"><span class="ico" style="background:#d6455d">👑</span>Панель владельца</button></div>`;
  $("set").innerHTML = h;
}

function drawContacts() { $("cts").innerHTML = `<div style="padding:20px;text-align:center;color:var(--dim)">Используй поиск сверху, чтобы найти друзей</div>`; }

// --- СОЗДАНИЕ ---
function createChannel() {
  sheet(`<h3>Новый канал</h3><div style="padding:0 10px"><input id="c_t" class="fld" placeholder="Название"><input id="c_u" class="fld" placeholder="@юзернейм"><textarea id="c_b" class="fld" placeholder="Описание" rows="2"></textarea><button class="pillb" onclick="doCreateChannel()">Создать</button></div>`);
}
async function doCreateChannel() {
  try { const d = await api("/api/channels", "POST", {title:$("c_t").value, uname:$("c_u").value, bio:$("c_b").value}); closeS(); openChannel(d.id, $("c_t").value); }
  catch(e) { toast("Ошибка: юз занят"); }
}
function createGroup() {
  sheet(`<h3>Новая группа</h3><div style="padding:0 10px"><input id="g_n" class="fld" placeholder="Название"><textarea id="g_b" class="fld" placeholder="Описание" rows="2"></textarea><button class="pillb" onclick="doCreateGroup()">Создать</button></div>`);
}
async function doCreateGroup() {
  const d = await api("/api/groups", "POST", {name:$("g_n").value, bio:$("g_b").value}); closeS(); openGroup(d.id, $("g_n").value);
}

// --- ПАНЕЛЬ ВЛАДЕЛЬЦА ---
async function ownerPanel() {
  $("pgt").textContent = "👑 Владелец";
  const s = await api("/api/owner/stats");
  $("pgb").innerHTML = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px">
    <div style="background:var(--card);padding:12px;border-radius:12px">👥 ${s.users} юзеров</div>
    <div style="background:var(--card);padding:12px;border-radius:12px">💬 ${s.messages} сообщений</div>
    <div style="background:var(--card);padding:12px;border-radius:12px">📣 ${s.channels} каналов</div>
    <div style="background:var(--card);padding:12px;border-radius:12px">👥 ${s.groups} групп</div>
  </div>
  <div class="card"><button class="li" onclick="broadcast()"><span class="ico" style="background:#ffb020">📢</span>Рассылка всем</button>
  <button class="li" onclick="listUsers()"><span class="ico" style="background:#2a8bd8">👤</span>Управление юзерами</button></div>`;
  $("pg").classList.add("on");
}
function closePg() { $("pg").classList.remove("on"); }
function broadcast() { const t = prompt("Текст рассылки:"); if(t) api("/api/owner/broadcast", "POST", {text:t}).then(()=>toast("Отправлено")); }
async function listUsers() {
  const us = await api("/api/owner/users");
  $("pgb").innerHTML = `<button class="back" onclick="ownerPanel()" style="margin:10px">←</button>` + us.map(u => `<div class="row"><div class="mid"><b>${esc(u.name)}</b> @${esc(u.username)}</div><button class="mini" onclick="banUser(${u.id})">${u.banned?"Разбан":"Бан"}</button></div>`).join("");
}
async function banUser(id) { await api("/api/owner/ban", "POST", {user_id:id}); listUsers(); }

// --- СТАРТ ---
if (TOKEN) init(); else drawAuth();
</script>
</body>
