<script>
/* ============================================================
   BELUGACORD 2.5 BETA — ЯДРО СИСТЕМЫ (ENGINE)
   ============================================================ */

const APP_VERSION = '2.5.0-beta';
const API_BASE = ''; // Оставляем пустым, так как фронт и бэк на одном домене

// Глобальное состояние приложения
const State = {
    token: localStorage.getItem('beluga_token') || '',
    me: null,
    ws: null,
    windows: {}, // Открытые окна
    zIndex: 100,
    drag: null,
    messages: [],
    onlineUsers: new Set(),
    adminPanel: { tab: 'users', search: '' }
};

// ============================================================
// УТИЛИТЫ И ФОРМАТИРОВАНИЕ
// ============================================================
const Utils = {
    esc: (str) => {
        if (!str) return '';
        return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
    },
    
    // Парсинг Markdown и спецсимволов
    formatText: (text) => {
        if (!text) return '';
        let t = Utils.esc(text);
        // Спойлеры ||текст||
        t = t.replace(/\|\|(.*?)\|\|/g, '<span class="spoiler" onclick="this.classList.toggle(\'revealed\')">$1</span>');
        // Жирный **текст**
        t = t.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        // Курсив *текст*
        t = t.replace(/\*(.*?)\*/g, '<em>$1</em>');
        // Код `текст`
        t = t.replace(/`(.*?)`/g, '<code>$1</code>');
        // Упоминания @ник
        t = t.replace(/@([a-zA-Z0-9_]+)/g, '<span class="mention">@$1</span>');
        return t;
    },

    timeAgo: (dateStr) => {
        if (!dateStr) return '';
        const date = new Date(dateStr);
        const now = new Date();
        const diff = Math.floor((now - date) / 1000);
        if (diff < 60) return 'только что';
        if (diff < 3600) return Math.floor(diff/60) + ' мин. назад';
        if (diff < 86400) return Math.floor(diff/3600) + ' ч. назад';
        return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
    },

    toast: (msg, type = 'info') => {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.innerHTML = `<span>${Utils.esc(msg)}</span>`;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    },

    api: async (url, method = 'GET', body = null) => {
        const opts = { method, headers: { 'Content-Type': 'application/json' } };
        if (body) opts.body = JSON.stringify(body);
        try {
            const r = await fetch(`${API_BASE}${url}`, opts);
            const d = await r.json();
            if (!r.ok) throw new Error(d.detail || 'Ошибка API');
            return d;
        } catch (e) {
            Utils.toast(e.message, 'error');
            throw e;
        }
    }
};

// ============================================================
// АВТОРИЗАЦИЯ И ВЕРИФИКАЦИЯ
// ============================================================
const Auth = {
    isLogin: true,
    pendingReg: null,

    toggle: () => {
        Auth.isLogin = !Auth.isLogin;
        document.getElementById('login-form').style.display = Auth.isLogin ? 'block' : 'none';
        document.getElementById('register-form').style.display = Auth.isLogin ? 'none' : 'block';
        document.getElementById('email-verify-form').style.display = 'none';
        document.getElementById('auth-subtitle').textContent = Auth.isLogin ? 'Войди в свой аккаунт' : 'Создай новый аккаунт';
        document.getElementById('auth-error').classList.remove('show');
    },

    login: async () => {
        const u = document.getElementById('login-username').value.trim();
        const p = document.getElementById('login-password').value;
        if (!u || !p) return Auth.error('Введи ник и пароль');
        
        try {
            const d = await Utils.api('/api/auth/login', 'POST', { username: u, password: p });
            State.token = d.token;
            localStorage.setItem('beluga_token', d.token);
            await Auth.loadUser();
            UI.enterDesktop();
        } catch (e) { Auth.error(e.message); }
    },

    register: async () => {
        const u = document.getElementById('reg-username').value.trim();
        const e = document.getElementById('reg-email').value.trim();
        const p = document.getElementById('reg-password').value;
        const p2 = document.getElementById('reg-password2').value;

        if (u.length < 3 || u.length > 32) return Auth.error('Ник: 3-32 символа');
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)) return Auth.error('Неверный email');
        if (p.length < 6) return Auth.error('Пароль мин. 6 символов');
        if (p !== p2) return Auth.error('Пароли не совпадают');

        try {
            await Utils.api('/api/auth/register', 'POST', { username: u, email: e, password: p });
            Auth.pendingReg = { u, p, e };
            document.getElementById('register-form').style.display = 'none';
            document.getElementById('email-verify-form').style.display = 'block';
            document.getElementById('verify-email-display').textContent = e;
            Auth.setupCodeInputs();
            Utils.toast('Код отправлен на почту!', 'success');
        } catch (err) { Auth.error(err.message); }
    },

    verifyEmail: async () => {
        const inputs = document.querySelectorAll('.verify-digit');
        const code = Array.from(inputs).map(i => i.value).join('');
        if (code.length !== 6) return Utils.toast('Введи 6 цифр', 'warning');

        try {
            await Utils.api('/api/auth/verify_email', 'POST', { username: Auth.pendingReg.u, code });
            Utils.toast('Почта подтверждена! Вход...', 'success');
            const d = await Utils.api('/api/auth/login', 'POST', { username: Auth.pendingReg.u, password: Auth.pendingReg.p });
            State.token = d.token;
            localStorage.setItem('beluga_token', d.token);
            await Auth.loadUser();
            UI.enterDesktop();
        } catch (e) { Utils.toast(e.message, 'error'); }
    },

    resendCode: async () => {
        if (!Auth.pendingReg) return;
        try {
            await Utils.api('/api/auth/resend_code', 'POST', { username: Auth.pendingReg.u });
            Utils.toast('Код отправлен снова', 'success');
        } catch (e) { Utils.toast(e.message, 'error'); }
    },

    setupCodeInputs: () => {
        const inputs = document.querySelectorAll('.verify-digit');
        inputs.forEach((inp, i) => {
            inp.oninput = (e) => { if (e.target.value && i < inputs.length - 1) inputs[i+1].focus(); };
            inp.onkeydown = (e) => { if (e.key === 'Backspace' && !e.target.value && i > 0) inputs[i-1].focus(); };
        });
        inputs[0].focus();
    },

    loadUser: async () => {
        try {
            State.me = await Utils.api(`/api/me?token=${encodeURIComponent(State.token)}`);
            UI.updateStartMenu();
        } catch (e) { Auth.logout(); }
    },

    logout: () => {
        State.token = '';
        State.me = null;
        localStorage.removeItem('beluga_token');
        if (State.ws) State.ws.close();
        document.getElementById('desktop').style.display = 'none';
        document.getElementById('auth-screen').style.display = 'flex';
        document.getElementById('login-username').value = '';
        document.getElementById('login-password').value = '';
    },

    error: (msg) => {
        const err = document.getElementById('auth-error');
        err.textContent = msg;
        err.classList.add('show');
    }
};

// ============================================================
// СИСТЕМА ОКОН (WINDOW MANAGER)
// ============================================================
const WindowManager = {
    open: (type) => {
        if (State.windows[type]) {
            WindowManager.focus(type);
            return;
        }
        
        const win = document.createElement('div');
        win.className = 'window';
        win.id = `win-${type}`;
        win.style.zIndex = ++State.zIndex;
        
        const offset = Object.keys(State.windows).length * 30;
        win.style.top = (80 + offset) + 'px';
        win.style.left = (100 + offset) + 'px';
        
        // Размеры по умолчанию
        const sizes = { chat: [900, 650], admin: [1000, 700], profile: [600, 500], default: [800, 600] };
        const [w, h] = sizes[type] || sizes.default;
        win.style.width = w + 'px';
        win.style.height = h + 'px';

        const content = Templates[type] || Templates.default;
        win.innerHTML = `
            <div class="window-header" onmousedown="WindowManager.dragStart(event, '${type}')">
                <div class="window-title">${content.icon} ${content.title}</div>
                <div class="window-controls">
                    <button class="window-btn btn-minimize" onclick="WindowManager.minimize('${type}')"></button>
                    <button class="window-btn btn-maximize" onclick="WindowManager.maximize('${type}')"></button>
                    <button class="window-btn btn-close" onclick="WindowManager.close('${type}')"></button>
                </div>
            </div>
            <div class="window-body">${content.body}</div>
        `;
        
        document.getElementById('windows-container').appendChild(win);
        State.windows[type] = win;
        UI.updateTaskbar();
        
        if (content.onInit) setTimeout(content.onInit, 50);
    },

    close: (type) => {
        if (State.windows[type]) {
            State.windows[type].remove();
            delete State.windows[type];
            UI.updateTaskbar();
        }
    },

    minimize: (type) => {
        if (State.windows[type]) State.windows[type].style.display = 'none';
    },

    maximize: (type) => {
        if (State.windows[type]) State.windows[type].classList.toggle('maximized');
    },

    focus: (type) => {
        const win = State.windows[type];
        if (win) {
            win.style.display = 'flex';
            win.style.zIndex = ++State.zIndex;
        }
    },

    dragStart: (e, type) => {
        const win = State.windows[type];
        if (!win || win.classList.contains('maximized')) return;
        State.drag = { win, offX: e.clientX - win.offsetLeft, offY: e.clientY - win.offsetTop };
        win.style.zIndex = ++State.zIndex;
        e.preventDefault();
    }
};

document.addEventListener('mousemove', (e) => {
    if (State.drag) {
        State.drag.win.style.left = (e.clientX - State.drag.offX) + 'px';
        State.drag.win.style.top = (e.clientY - State.drag.offY) + 'px';
    }
});
document.addEventListener('mouseup', () => { State.drag = null; });

                    <div class="admin-tab" onclick="Admin.switchTab('economy', this)">💰 Экономика</div>
                    <div class="admin-tab" onclick="Admin.switchTab('system', this)">⚙️ Система</div>
                </div>
                <div style="flex:1; padding:20px; overflow-y:auto;" id="admin-content">
                    <!-- Контент грузится динамически -->
                </div>
            </div>
        `,
        onInit: () => Admin.render()
    },

    profile: {
        icon: '👤', title: 'Профиль',
        body: `<div id="profile-content" style="padding:20px;"></div>`,
        onInit: () => Profile.render()
    },

    default: {
        icon: '📄', title: 'Окно',
        body: '<div style="padding:40px; text-align:center;">Контент в разработке</div>'
    }
};

// Добавим стили для табов админки
const styleSheet = document.createElement("style");
styleSheet.innerText = `
    .admin-tab { padding: 12px; margin-bottom: 4px; border-radius: 6px; cursor: pointer; font-size: 14px; color: var(--text-secondary); transition: 0.2s; }

// ============================================================
// МОДУЛЬ ЧАТА
// ============================================================
const Chat = {
    currentChannel: 1,
    
    selectChannel: (id, el) => {
        Chat.currentChannel = id;
        document.querySelectorAll('.channel-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        document.getElementById('chat-title').textContent = '# ' + el.textContent.trim();
        Chat.loadMessages();
    },

    loadMessages: () => {
        const container = document.getElementById('chat-messages');
        if (!container) return;
        container.innerHTML = '';
        
        // Заглушка, пока нет бэкенда
        const mockMsgs = [
            { user: 'System', text: 'Добро пожаловать в Belugacord 2.5 Beta! 🚀', time: new Date().toISOString() },
            { user: '_fan_beluga_', text: 'Всем привет! Это **тестовое** сообщение с *курсивом* и `кодом`.', time: new Date().toISOString() },
            { user: 'Alex', text: 'А как сделать ||спойлер||?', time: new Date().toISOString() }
        ];

        mockMsgs.forEach(m => Chat.appendMessage(m));
    },

    appendMessage: (msg) => {
        const container = document.getElementById('chat-messages');
        if (!container) return;
        
        const div = document.createElement('div');
        div.className = 'message';
        div.innerHTML = `
            <div class="msg-avatar">${msg.user.charAt(0).toUpperCase()}</div>
            <div class="msg-content">
                <div class="msg-header">
                    <span class="msg-author">${Utils.esc(msg.user)}</span>
                    <span class="msg-time">${Utils.timeAgo(msg.time)}</span>
                </div>
                <div class="msg-text">${Utils.formatText(msg.text)}</div>
            </div>
        `;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    },

    handleInput: (e) => {
        if (e.key === 'Enter') {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            // Обработка команд
            if (text.startsWith('/')) {
                Chat.handleCommand(text);
                input.value = '';
                return;
            }

            // Отправка (пока локально)
            Chat.appendMessage({ user: State.me ? State.me.username : 'Я', text: text, time: new Date().toISOString() });
            input.value = '';
            
            // Тут будет отправка на бэкенд через WebSocket
            if (State.ws && State.ws.readyState === WebSocket.OPEN) {
                State.ws.send(JSON.stringify({ type: 'message', channel_id: Chat.currentChannel, text }));
            }
        }
    },

    handleCommand: (cmd) => {
        const parts = cmd.split(' ');
        const command = parts[0].toLowerCase();
        
        if (command === '/монетка') {
            const res = Math.random() > 0.5 ? 'Орёл' : 'Решка';
            Chat.appendMessage({ user: '🤖 Бот', text: `🪙 Выпало: **${res}**!`, time: new Date().toISOString() });
        } else if (command === '/кубик') {
            const res = Math.floor(Math.random() * 6) + 1;
            Chat.appendMessage({ user: ' Бот', text: `🎲 Выпало: **${res}**!`, time: new Date().toISOString() });
        } else if (command === '/помощь') {
            Chat.appendMessage({ user: '🤖 Бот', text: 'Доступные команды: `/монетка`, `/кубик`, `/помощь`', time: new Date().toISOString() });
        } else {
            Chat.appendMessage({ user: '🤖 Бот', text: `Неизвестная команда: ${command}`, time: new Date().toISOString() });
        }
    }
};

// ============================================================

    action: (type, userId) => {
        const user = Admin.mockUsers.find(u => u.id === userId);
        if (!user) return;
        
        if (confirm(`Выполнить "${type}" для ${user.name}?`)) {
            Utils.toast(`Действие "${type}" выполнено для ${user.name}`, 'success');
            // Тут будет API запрос на бэкенд
        }
    }
};

// ЧАТ 2.0 — РАСШИРЕННЫЕ ФУНКЦИИ
// ============================================================
const ChatExtended = {
    reactions: {},
    editingMessageId: null,
    replyingTo: null,

    // Реакции на сообщения
    addReaction: (msgId, emoji) => {
        if (!ChatExtended.reactions[msgId]) {
            ChatExtended.reactions[msgId] = {};
        }
        if (!ChatExtended.reactions[msgId][emoji]) {
            ChatExtended.reactions[msgId][emoji] = [];
        }
        
        const userId = State.me ? State.me.id : 'anon';
        if (!ChatExtended.reactions[msgId][emoji].includes(userId)) {
            ChatExtended.reactions[msgId][emoji].push(userId);
            Chat.updateMessageReactions(msgId);
        }
    },

    removeReaction: (msgId, emoji) => {
        if (!ChatExtended.reactions[msgId] || !ChatExtended.reactions[msgId][emoji]) return;
        
        const userId = State.me ? State.me.id : 'anon';
        ChatExtended.reactions[msgId][emoji] = ChatExtended.reactions[msgId][emoji].filter(id => id !== userId);
        
        if (ChatExtended.reactions[msgId][emoji].length === 0) {
            delete ChatExtended.reactions[msgId][emoji];
        }
        
        Chat.updateMessageReactions(msgId);
    },

    updateMessageReactions: (msgId) => {
        const msgEl = document.getElementById(`msg-${msgId}`);
        if (!msgEl) return;
        
        let reactionsHtml = '';
        const reactions = ChatExtended.reactions[msgId] || {};
        
        Object.keys(reactions).forEach(emoji => {
            const count = reactions[emoji].length;
            const userId = State.me ? State.me.id : 'anon';
            const isActive = reactions[emoji].includes(userId);
            reactionsHtml += `
                <span class="reaction ${isActive ? 'active' : ''}" onclick="ChatExtended.toggleReaction(${msgId}, '${emoji}')">
                    ${emoji} ${count}
                </span>
            `;
        });
        
        const reactionsContainer = msgEl.querySelector('.msg-reactions');
        if (reactionsContainer) {
            reactionsContainer.innerHTML = reactionsHtml;
        }
    },

    toggleReaction: (msgId, emoji) => {
        const userId = State.me ? State.me.id : 'anon';
        const reactions = ChatExtended.reactions[msgId] || {};
        
        if (reactions[emoji] && reactions[emoji].includes(userId)) {
            ChatExtended.removeReaction(msgId, emoji);
        } else {
            ChatExtended.addReaction(msgId, emoji);
        }
    },

    // Ответ на сообщение
    startReply: (msgId) => {
        ChatExtended.replyingTo = msgId;
        const msgEl = document.getElementById(`msg-${msgId}`);
        if (!msgEl) return;
        
        const author = msgEl.querySelector('.msg-author').textContent;
        const text = msgEl.querySelector('.msg-text').textContent.substring(0, 50);
        
        ChatExtended.showReplyBar(author, text);
    },

    cancelReply: () => {
        ChatExtended.replyingTo = null;
        const replyBar = document.getElementById('reply-bar');
        if (replyBar) replyBar.remove();
    },

    showReplyBar: (author, text) => {
        ChatExtended.cancelReply();
        
        const inputArea = document.querySelector('.input-area');
        if (!inputArea) return;
        
        const replyBar = document.createElement('div');
        replyBar.id = 'reply-bar';
        replyBar.style.cssText = 'background: var(--bg-tertiary); padding: 8px 16px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 13px;';
        replyBar.innerHTML = `
            <div>
                <span style="color: var(--accent); font-weight: 600;"> Ответ ${Utils.esc(author)}</span>
                <span style="color: var(--text-muted); margin-left: 8px;">${Utils.esc(text)}...</span>
            </div>
            <button onclick="ChatExtended.cancelReply()" style="background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 18px;">✕</button>
        `;
        
        inputArea.parentNode.insertBefore(replyBar, inputArea);
        document.getElementById('chat-input').focus();
    },

    // Редактирование сообщения
    startEdit: (msgId) => {
        const msgEl = document.getElementById(`msg-${msgId}`);
        if (!msgEl) return;
        
        const textEl = msgEl.querySelector('.msg-text');
        const oldText = textEl.textContent;
        
        ChatExtended.editingMessageId = msgId;
        textEl.contentEditable = true;
        textEl.focus();
        
        // Выделяем весь текст
        const range = document.createRange();
        range.selectNodeContents(textEl);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        
        textEl.onkeydown = (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                ChatExtended.saveEdit(msgId, textEl.textContent);
            } else if (e.key === 'Escape') {
                ChatExtended.cancelEdit(msgId, oldText);
            }
        };
        
        textEl.onblur = () => {
            ChatExtended.saveEdit(msgId, textEl.textContent);
        };
    },

    saveEdit: (msgId, newText) => {
        const msgEl = document.getElementById(`msg-${msgId}`);
        if (!msgEl) return;
        
        const textEl = msgEl.querySelector('.msg-text');
        textEl.contentEditable = false;
        textEl.innerHTML = Utils.formatText(newText);
        
        // Добавляем метку "изменено"
        if (!msgEl.querySelector('.msg-edited')) {
            const header = msgEl.querySelector('.msg-header');
            const edited = document.createElement('span');
            edited.className = 'msg-edited';
            edited.textContent = ' (изменено)';
            edited.style.cssText = 'font-size: 11px; color: var(--text-muted); font-style: italic;';
            header.appendChild(edited);
        }
        
        ChatExtended.editingMessageId = null;
        Utils.toast('Сообщение изменено', 'success');
        
        // Тут будет отправка на бэкенд
        // Utils.api(`/api/messages/${msgId}/edit`, 'POST', { text: newText });
    },

    cancelEdit: (msgId, oldText) => {
        const msgEl = document.getElementById(`msg-${msgId}`);
        if (!msgEl) return;
        
        const textEl = msgEl.querySelector('.msg-text');
        textEl.contentEditable = false;
        textEl.innerHTML = Utils.formatText(oldText);
        ChatExtended.editingMessageId = null;
    },

    // Удаление сообщения
    deleteMessage: (msgId) => {
        if (!confirm('Удалить сообщение?')) return;
        
        const msgEl = document.getElementById(`msg-${msgId}`);
        if (msgEl) {
            msgEl.style.transition = 'all 0.3s';
            msgEl.style.opacity = '0';
            msgEl.style.transform = 'translateX(-20px)';
            setTimeout(() => msgEl.remove(), 300);
        }
        
        Utils.toast('Сообщение удалено', 'success');
        // Utils.api(`/api/messages/${msgId}/delete`, 'POST');
    },

    // Закрепление сообщения
    pinMessage: (msgId) => {
        const msgEl = document.getElementById(`msg-${msgId}`);
        if (!msgEl) return;
        
        const header = msgEl.querySelector('.msg-header');
        if (!header.querySelector('.msg-pinned')) {
            const pin = document.createElement('span');
            pin.className = 'msg-pinned';
            pin.textContent = ' 📌';
            pin.title = 'Закреплено';
            header.appendChild(pin);
        }
        
        Utils.toast('Сообщение закреплено', 'success');
        // Utils.api(`/api/messages/${msgId}/pin`, 'POST');
    },

    // Быстрые реакции (панелька при клике)
    showQuickReactions: (msgId, event) => {
        const emojis = ['👍', '❤️', '😂', '😮', '😢', '', '👀', ''];
        
        const panel = document.createElement('div');
        panel.style.cssText = `
            position: fixed;
            top: ${event.clientY}px;
            left: ${event.clientX}px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 8px;
            display: flex;
            gap: 4px;
            z-index: 5000;
            box-shadow: var(--shadow-lg);
        `;
        
        emojis.forEach(emoji => {
            const btn = document.createElement('button');
            btn.textContent = emoji;
            btn.style.cssText = 'background: none; border: none; font-size: 20px; cursor: pointer; padding: 4px 8px; border-radius: 12px; transition: 0.2s;';
            btn.onmouseenter = () => btn.style.background = 'var(--bg-hover)';
            btn.onmouseleave = () => btn.style.background = 'none';
            btn.onclick = () => {
                ChatExtended.addReaction(msgId, emoji);
                panel.remove();
            };
            panel.appendChild(btn);
        });
        
        document.body.appendChild(panel);
        
        setTimeout(() => {
            document.addEventListener('click', function close(e) {
                if (!panel.contains(e.target)) {
                    panel.remove();
                    document.removeEventListener('click', close);
                }
            });
        }, 100);
    }
};

// ЧАТ 2.0 — РАСШИРЕННЫЕ ФУНКЦИИ
// ============================================================
const ChatExtended = {
    reactions: {},
    editingMessageId: null,
    replyingTo: null,

    // Реакции на сообщения
    addReaction: (msgId, emoji) => {
        if (!ChatExtended.reactions[msgId]) {
            ChatExtended.reactions[msgId] = {};
        }
        if (!ChatExtended.reactions[msgId][emoji]) {
            ChatExtended.reactions[msgId][emoji] = [];
        }
        
        const userId = State.me ? State.me.id : 'anon';
        if (!ChatExtended.reactions[msgId][emoji].includes(userId)) {
            ChatExtended.reactions[msgId][emoji].push(userId);
            Chat.updateMessageReactions(msgId);
        }
    },

    removeReaction: (msgId, emoji) => {
        if (!ChatExtended.reactions[msgId] || !ChatExtended.reactions[msgId][emoji]) return;
        
        const userId = State.me ? State.me.id : 'anon';
        ChatExtended.reactions[msgId][emoji] = ChatExtended.reactions[msgId][emoji].filter(id => id !== userId);
        
        if (ChatExtended.reactions[msgId][emoji].length === 0) {
            delete ChatExtended.reactions[msgId][emoji];
        }
        
        Chat.updateMessageReactions(msgId);
    },

    updateMessageReactions: (msgId) => {
        const msgEl = document.getElementById(`msg-${msgId}`);
        if (!msgEl) return;
        
        let reactionsHtml = '';
        const reactions = ChatExtended.reactions[msgId] || {};
        
        Object.keys(reactions).forEach(emoji => {
            const count = reactions[emoji].length;
            const userId = State.me ? State.me.id : 'anon';
            const isActive = reactions[emoji].includes(userId);
            reactionsHtml += `
                <span class="reaction ${isActive ? 'active' : ''}" onclick="ChatExtended.toggleReaction(${msgId}, '${emoji}')">
                    ${emoji} ${count}
                </span>
            `;
        });
        
        const reactionsContainer = msgEl.querySelector('.msg-reactions');
        if (reactionsContainer) {
            reactionsContainer.innerHTML = reactionsHtml;
        }
    },

    toggleReaction: (msgId, emoji) => {
        const userId = State.me ? State.me.id : 'anon';
        const reactions = ChatExtended.reactions[msgId] || {};
        
        if (reactions[emoji] && reactions[emoji].includes(userId)) {
            ChatExtended.removeReaction(msgId, emoji);
        } else {
            ChatExtended.addReaction(msgId, emoji);
        }
    },

    // Ответ на сообщение
    startReply: (msgId) => {
        ChatExtended.replyingTo = msgId;
        const msgEl = document.getElementById(`msg-${msgId}`);
        if (!msgEl) return;
        
        const author = msgEl.querySelector('.msg-author').textContent;
        const text = msgEl.querySelector('.msg-text').textContent.substring(0, 50);
        
        ChatExtended.showReplyBar(author, text);
    },

    cancelReply: () => {
        ChatExtended.replyingTo = null;
        const replyBar = document.getElementById('reply-bar');
        if (replyBar) replyBar.remove();
    },

    showReplyBar: (author, text) => {
        ChatExtended.cancelReply();
        
        const inputArea = document.querySelector('.input-area');
        if (!inputArea) return;
        
        const replyBar = document.createElement('div');
        replyBar.id = 'reply-bar';
        replyBar.style.cssText = 'background: var(--bg-tertiary); padding: 8px 16px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 13px;';
        replyBar.innerHTML = `
            <div>
                <span style="color: var(--accent); font-weight: 600;"> Ответ ${Utils.esc(author)}</span>
                <span style="color: var(--text-muted); margin-left: 8px;">${Utils.esc(text)}...</span>
            </div>
            <button onclick="ChatExtended.cancelReply()" style="background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 18px;">✕</button>
        `;
        
        inputArea.parentNode.insertBefore(replyBar, inputArea);
        document.getElementById('chat-input').focus();
    },

    // Редактирование сообщения
    startEdit: (msgId) => {
        const msgEl = document.getElementById(`msg-${msgId}`);
        if (!msgEl) return;
        
        const textEl = msgEl.querySelector('.msg-text');
        const oldText = textEl.textContent;
        
        ChatExtended.editingMessageId = msgId;
        textEl.contentEditable = true;
        textEl.focus();
        
        // Выделяем весь текст
        const range = document.createRange();
        range.selectNodeContents(textEl);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        
        textEl.onkeydown = (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                ChatExtended.saveEdit(msgId, textEl.textContent);
            } else if (e.key === 'Escape') {
                ChatExtended.cancelEdit(msgId, oldText);
            }
        };
        
        textEl.onblur = () => {
            ChatExtended.saveEdit(msgId, textEl.textContent);
        };
    },

    saveEdit: (msgId, newText) => {
        const msgEl = document.getElementById(`msg-${msgId}`);
        if (!msgEl) return;
        
        const textEl = msgEl.querySelector('.msg-text');
        textEl.contentEditable = false;
        textEl.innerHTML = Utils.formatText(newText);
        
        // Добавляем метку "изменено"
        if (!msgEl.querySelector('.msg-edited')) {
            const header = msgEl.querySelector('.msg-header');
            const edited = document.createElement('span');
            edited.className = 'msg-edited';
            edited.textContent = ' (изменено)';
            edited.style.cssText = 'font-size: 11px; color: var(--text-muted); font-style: italic;';
            header.appendChild(edited);
        }
        
        ChatExtended.editingMessageId = null;
        Utils.toast('Сообщение изменено', 'success');
        
        // Тут будет отправка на бэкенд
        // Utils.api(`/api/messages/${msgId}/edit`, 'POST', { text: newText });
    },

    cancelEdit: (msgId, oldText) => {
        const msgEl = document.getElementById(`msg-${msgId}`);
        if (!msgEl) return;
        
        const textEl = msgEl.querySelector('.msg-text');
        textEl.contentEditable = false;
        textEl.innerHTML = Utils.formatText(oldText);
        ChatExtended.editingMessageId = null;
    },

    // Удаление сообщения
    deleteMessage: (msgId) => {
        if (!confirm('Удалить сообщение?')) return;
        
        const msgEl = document.getElementById(`msg-${msgId}`);
        if (msgEl) {
            msgEl.style.transition = 'all 0.3s';
            msgEl.style.opacity = '0';
            msgEl.style.transform = 'translateX(-20px)';
            setTimeout(() => msgEl.remove(), 300);
        }
        
        Utils.toast('Сообщение удалено', 'success');
        // Utils.api(`/api/messages/${msgId}/delete`, 'POST');
    },

    // Закрепление сообщения
    pinMessage: (msgId) => {
        const msgEl = document.getElementById(`msg-${msgId}`);
        if (!msgEl) return;
        
        const header = msgEl.querySelector('.msg-header');
        if (!header.querySelector('.msg-pinned')) {
            const pin = document.createElement('span');
            pin.className = 'msg-pinned';
            pin.textContent = ' 📌';
            pin.title = 'Закреплено';
            header.appendChild(pin);
        }
        
        Utils.toast('Сообщение закреплено', 'success');
        // Utils.api(`/api/messages/${msgId}/pin`, 'POST');
    },

    // Быстрые реакции (панелька при клике)
    showQuickReactions: (msgId, event) => {
        const emojis = ['👍', '❤️', '😂', '😮', '😢', '', '👀', ''];
        
        const panel = document.createElement('div');
        panel.style.cssText = `
            position: fixed;
            top: ${event.clientY}px;
            left: ${event.clientX}px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 8px;
            display: flex;
            gap: 4px;
            z-index: 5000;
            box-shadow: var(--shadow-lg);
        `;
        
        emojis.forEach(emoji => {
            const btn = document.createElement('button');
            btn.textContent = emoji;
            btn.style.cssText = 'background: none; border: none; font-size: 20px; cursor: pointer; padding: 4px 8px; border-radius: 12px; transition: 0.2s;';
            btn.onmouseenter = () => btn.style.background = 'var(--bg-hover)';
            btn.onmouseleave = () => btn.style.background = 'none';
            btn.onclick = () => {
                ChatExtended.addReaction(msgId, emoji);
                panel.remove();
            };
            panel.appendChild(btn);
        });
        
        document.body.appendChild(panel);
        
        setTimeout(() => {
            document.addEventListener('click', function close(e) {
                if (!panel.contains(e.target)) {
                    panel.remove();
                    document.removeEventListener('click', close);
                }
            });
        }, 100);
    }
};

const DM = {
    conversations: {},
    currentDM: null,

    // Открыть диалог с пользователем
    open: (userId, username) => {
        DM.currentDM = { userId, username };
        
        if (!DM.conversations[userId]) {
            DM.conversations[userId] = [];
        }

        WindowManager.open('dm');
        
        setTimeout(() => {
            const title = document.getElementById('dm-title');
            if (title) title.textContent = ` ${username}`;
            DM.renderMessages();
        }, 100);
    },

    // Отправка сообщения в DM
    send: (text) => {
        if (!text.trim() || !DM.currentDM) return;

        const msg = {
            id: Date.now(),
            from: 'me',
            text: text,
            time: new Date().toISOString()
        };

        DM.conversations[DM.currentDM.userId].push(msg);
        DM.renderMessages();

        // Имитация ответа
        setTimeout(() => {
            const replies = ['Привет!', 'Как дела?', 'Ок', 'Понял', 'Интересно', '👍'];
            const reply = {
                id: Date.now() + 1,
                from: 'them',
                text: replies[Math.floor(Math.random() * replies.length)],
                time: new Date().toISOString()
            };
            DM.conversations[DM.currentDM.userId].push(reply);
            DM.renderMessages();
        }, 1000 + Math.random() * 2000);
    },

    // Рендер сообщений DM
    renderMessages: () => {
        const container = document.getElementById('dm-messages');
        if (!container || !DM.currentDM) return;

        const messages = DM.conversations[DM.currentDM.userId] || [];
        
        container.innerHTML = messages.map(msg => `
            <div class="message" style="flex-direction: ${msg.from === 'me' ? 'row-reverse' : 'row'};">
                <div class="msg-content" style="max-width: 70%;">
                    <div class="msg-text" style="background: ${msg.from === 'me' ? 'var(--accent)' : 'var(--bg-tertiary)'}; padding: 10px 14px; border-radius: 18px; ${msg.from === 'me' ? 'border-bottom-right-radius: 4px;' : 'border-bottom-left-radius: 4px;'}">
                        ${Utils.formatText(msg.text)}
                    </div>
                    <div class="msg-time" style="text-align: ${msg.from === 'me' ? 'right' : 'left'}; margin-top: 4px;">${Utils.timeAgo(msg.time)}</div>
                </div>
            </div>
        `).join('');

        container.scrollTop = container.scrollHeight;
    },

    // Обработка ввода в DM
    handleInput: (e) => {
        if (e.key === 'Enter') {
            const input = document.getElementById('dm-input');
            const text = input.value.trim();
            if (text) {
                DM.send(text);
                input.value = '';
            }
        }
    }
};

const Leveling = {
    xpPerLevel: 100,
    
    addXP: (amount) => {
        if (!State.me) return;
        
        State.me.xp = (State.me.xp || 0) + amount;
        const newLevel = Math.floor(State.me.xp / Leveling.xpPerLevel) + 1;
        
        if (newLevel > (State.me.level || 1)) {
            State.me.level = newLevel;
            Utils.toast(`🎉 Уровень повышен! Теперь ты ${newLevel} уровня!`, 'success');
            
            // Награда за уровень
            const reward = newLevel * 50;
            Economy.addCoins(reward);
        }
        
        Leveling.updateDisplay();
    },

    getProgress: () => {
        if (!State.me) return 0;
        const currentLevelXP = (State.me.level - 1) * Leveling.xpPerLevel;
        const nextLevelXP = State.me.level * Leveling.xpPerLevel;
        const progress = ((State.me.xp - currentLevelXP) / (nextLevelXP - currentLevelXP)) * 100;
        return Math.min(100, Math.max(0, progress));
    },

    updateDisplay: () => {
        document.querySelectorAll('.level-display').forEach(el => {
            if (State.me) {
                el.textContent = `Уровень ${State.me.level || 1}`;
            }
        });
        
        document.querySelectorAll('.xp-bar-fill').forEach(el => {
            el.style.width = `${Leveling.getProgress()}%`;
        });
        
        document.querySelectorAll('.xp-text').forEach(el => {
            if (State.me) {
                const currentLevelXP = (State.me.level - 1) * Leveling.xpPerLevel;
                const nextLevelXP = State.me.level * Leveling.xpPerLevel;
                el.textContent = `${State.me.xp - currentLevelXP} / ${Leveling.xpPerLevel} XP`;
            }
        });
    }
};

        const quest = Quests.daily.find(q => q.id === questId);

        if (!container) return;

        container.innerHTML = Quests.daily.map(q => {
            const progressPercent = (q.progress / q.goal) * 100;

const Notifications = {
    history: [],

    add: (message, type = 'info') => {
        const notif = {
            id: Date.now(),
            message,
            type,
            time: new Date().toISOString(),
            read: false
        };
        
        Notifications.history.unshift(notif);
        if (Notifications.history.length > 50) {
            Notifications.history.pop();
        }
        
        Utils.toast(message, type);
        Notifications.updateBadge();
    },

    updateBadge: () => {
        const unread = Notifications.history.filter(n => !n.read).length;
        document.querySelectorAll('.notif-badge').forEach(el => {
            el.textContent = unread > 0 ? unread : '';
            el.style.display = unread > 0 ? 'block' : 'none';
        });
    },

    markAllRead: () => {
        Notifications.history.forEach(n => n.read = true);
        Notifications.updateBadge();
        Notifications.render();
    },

    render: () => {
        const container = document.getElementById('notifications-container');
        if (!container) return;

        if (Notifications.history.length === 0) {
            container.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 20px;">Нет уведомлений</div>';
            return;
        }

        container.innerHTML = `

const Search = {
    query: '',
    results: [],

    open: () => {
        const modal = document.getElementById('modal-overlay');
        const content = document.getElementById('modal-content');
        
        content.innerHTML = `
            <div class="modal-header">
                <div class="modal-title">🔍 Поиск по сообщениям</div>
                <button class="modal-close" onclick="Changelog.hide()">✕</button>
            </div>
            <div style="padding: 20px;">
                <input type="text" id="search-input" placeholder="Введи текст для поиска..." 
                    style="width: 100%; padding: 12px; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 8px; color: white; font-size: 16px; margin-bottom: 16px; outline: none;"
                    oninput="Search.execute(this.value)">
                <div id="search-results"></div>
            </div>
        `;
        modal.classList.add('show');
        document.getElementById('search-input').focus();
    },

    execute: (query) => {
        Search.query = query.toLowerCase();
        const container = document.getElementById('search-results');
        if (!container) return;

        if (Search.query.length < 2) {
            container.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 20px;">Введи минимум 2 символа</div>';
            return;
        }

        // Поиск в моковых сообщениях
        const mockMessages = [
            { user: '_fan_beluga_', text: 'Всем привет! Это тестовое сообщение', time: new Date().toISOString() },
            { user: 'Alex_Gamer', text: 'Го в ДДНет?', time: new Date(Date.now() - 3600000).toISOString() },
            { user: 'KittyLover', text: 'Скинь фотку кота!', time: new Date(Date.now() - 7200000).toISOString() }
        ];

        Search.results = mockMessages.filter(m => 
            m.text.toLowerCase().includes(Search.query) || 
            m.user.toLowerCase().includes(Search.query)
        );

        if (Search.results.length === 0) {
            container.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 20px;">Ничего не найдено</div>';
        } else {
            container.innerHTML = Search.results.map(m => `

// ============================================================
const Servers = {
    current: null,
    list: [],

    load: () => {
        Servers.list = [
            {
                id: 1,
                name: 'Belugacord Official',
                icon: '🐱',
                owner: 1,
                members: 12,
                channels: [

                    { id: 2, name: 'мемы', type: 'text', category: 'Текстовые' },
                    { id: 3, name: 'кодинг', type: 'text', category: 'Текстовые' },
                    { id: 4, name: 'Общение', type: 'voice', category: 'Голосовые' },
                    { id: 5, name: 'Игровая', type: 'voice', category: 'Голосовые' }
                ],
                roles: [
                    { id: 1, name: 'Владелец', color: '#d946ef', permissions: ['all'] },
                    { id: 2, name: 'Админ', color: '#ef4444', permissions: ['ban', 'mute', 'delete'] },
                    { id: 3, name: 'Модератор', color: '#3b82f6', permissions: ['mute', 'delete'] },
                    { id: 4, name: 'Участник', color: '#22c55e', permissions: ['send'] }
                ]
            },
            {
                id: 2,
                name: 'Кодинг',
                icon: '💻',
                owner: 1,
                members: 5,
                channels: [
                    { id: 6, name: 'python', type: 'text', category: 'Языки' },
                    { id: 7, name: 'javascript', type: 'text', category: 'Языки' },
                    { id: 8, name: 'помощь', type: 'text', category: 'Общее' }
                ],
                roles: [
                    { id: 5, name: 'Создатель', color: '#f59e0b', permissions: ['all'] },
                    { id: 6, name: 'Кодер', color: '#06b6d4', permissions: ['send'] }
                ]
            }
        ];
        Servers.current = Servers.list[0];
    },

    create: () => {
        const name = prompt('Название сервера:');
        if (!name || name.length < 3) {
            Utils.toast('Название должно быть минимум 3 символа', 'warning');
            return;
        }

        const icon = prompt('Иконка (эмодзи):', '🎮') || '';
        
        const newServer = {
            id: Date.now(),
            name,
            icon,
            owner: State.me?.id || 1,
            members: 1,
            channels: [
                { id: Date.now() + 1, name: 'общий', type: 'text', category: 'Текстовые' }
            ],
            roles: [
                { id: Date.now() + 2, name: 'Владелец', color: '#d946ef', permissions: ['all'] },
                { id: Date.now() + 3, name: 'Участник', color: '#22c55e', permissions: ['send'] }
            ]
        };

        Servers.list.push(newServer);
        Servers.current = newServer;
        Utils.toast(`Сервер "${name}" создан!`, 'success');
        Servers.render();
        // Utils.api('/api/servers/create', 'POST', { name, icon });
    },

    delete: (serverId) => {
        const server = Servers.list.find(s => s.id === serverId);
        if (!server) return;
        
        if (server.owner !== State.me?.id) {
            Utils.toast('Только владелец может удалить сервер', 'error');
            return;
        }

        if (!confirm(`Удалить сервер "${server.name}"? Это действие необратимо!`)) return;

        Servers.list = Servers.list.filter(s => s.id !== serverId);
        if (Servers.current?.id === serverId) {
            Servers.current = Servers.list[0] || null;
        }
        
        Utils.toast(`Сервер "${server.name}" удален`, 'success');
        Servers.render();
    },

    addChannel: (type = 'text') => {
        if (!Servers.current) return;
        
        const name = prompt(`Название ${type === 'text' ? 'текстового' : 'голосового'} канала:`);
        if (!name) return;

        const category = prompt('Категория:', type === 'text' ? 'Текстовые' : 'Голосовые') || 'Общее';

        Servers.current.channels.push({
            id: Date.now(),
            name,
            type,
            category
        });

        Utils.toast(`Канал "${name}" создан`, 'success');
        Servers.render();
    },

    deleteChannel: (channelId) => {
        if (!Servers.current) return;
        
        const channel = Servers.current.channels.find(c => c.id === channelId);
        if (!channel) return;

        if (!confirm(`Удалить канал "${channel.name}"?`)) return;

        Servers.current.channels = Servers.current.channels.filter(c => c.id !== channelId);
        Utils.toast(`Канал "${channel.name}" удален`, 'success');
        Servers.render();
    },

    addRole: () => {
        if (!Servers.current) return;
        
        const name = prompt('Название роли:');
        if (!name) return;

        const color = prompt('Цвет (hex):', '#d946ef') || '#d946ef';

        Servers.current.roles.push({
            id: Date.now(),
            name,
            color,
            permissions: ['send']
        });

        Utils.toast(`Роль "${name}" создана`, 'success');
        Servers.render();
    },

    render: () => {
        const container = document.getElementById('servers-list');
        if (!container) return;

        container.innerHTML = Servers.list.map(s => `
            <div class="admin-card" style="display: flex; align-items: center; gap: 12px; ${Servers.current?.id === s.id ? 'border-color: var(--accent);' : ''}">
                <div style="width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer;" onclick="Servers.select(${s.id})">
                    ${s.icon}
                </div>
                <div style="flex: 1;">
                    <div style="font-weight: 700; font-size: 16px;">${Utils.esc(s.name)}</div>
                    <div style="font-size: 12px; color: var(--text-muted);">${s.members} участников · ${s.channels.length} каналов</div>
                </div>
                <button onclick="Servers.select(${s.id}); WindowManager.open('chat')" style="padding: 6px 12px; background: var(--accent); border: none; border-radius: 6px; color: white; cursor: pointer; font-size: 12px;">Открыть</button>
                ${s.owner === State.me?.id ? `<button onclick="Servers.delete(${s.id})" style="padding: 6px 12px; background: var(--danger); border: none; border-radius: 6px; color: white; cursor: pointer; font-size: 12px;">Удалить</button>` : ''}
            </div>
        `).join('');
    },

    select: (serverId) => {
        Servers.current = Servers.list.find(s => s.id === serverId);
        Utils.toast(`Выбран сервер: ${Servers.current.name}`, 'info');
        Servers.render();
    }
};

// ============================================================
// ИНВЕНТАРЬ ПРЕДМЕТОВ
// ============================================================
const Inventory = {
    items: [],

    load: () => {
        Inventory.items = [
            { id: 1, name: 'Золотая рамка', emoji: '', type: 'frame', rarity: 'rare', boughtAt: new Date().toISOString() },
            { id: 2, name: 'Огненная рамка', emoji: '🔥', type: 'frame', rarity: 'epic', boughtAt: new Date().toISOString() },
            { id: 3, name: 'Подарок: Роза', emoji: '🌹', type: 'gift', rarity: 'common', boughtAt: new Date().toISOString() }
        ];
    },

    buy: (item, price) => {
        if (!Economy.spendCoins(price)) return;

        const newItem = {
            id: Date.now(),
            name: item.name,
            emoji: item.emoji,
            type: item.type || 'item',
            rarity: item.rarity || 'common',
            boughtAt: new Date().toISOString()
        };

        Inventory.items.push(newItem);
        Utils.toast(`Куплено: ${item.emoji} ${item.name}!`, 'success');
        Inventory.render();
        Quests.updateProgress('buy_items', 1);
    },

    use: (itemId) => {
        const item = Inventory.items.find(i => i.id === itemId);
        if (!item) return;

        if (item.type === 'frame') {
            State.me.active_frame = item.emoji;
            Utils.toast(`Рамка "${item.name}" активирована!`, 'success');
        } else if (item.type === 'gift') {
            Utils.toast(`Подарок "${item.name}" готов к отправке`, 'info');
        } else {
            Utils.toast(`Предмет "${item.name}" использован`, 'info');
        }

        Inventory.render();
    },

    sell: (itemId) => {
        const item = Inventory.items.find(i => i.id === itemId);
        if (!item) return;

        if (!confirm(`Продать "${item.name}" за 50% цены?`)) return;

        const refund = Math.floor(50); // Заглушка
        Economy.addCoins(refund);
        Inventory.items = Inventory.items.filter(i => i.id !== itemId);
        
        Utils.toast(`Продано за ${refund} `, 'success');

    render: () => {
        const container = document.getElementById('inventory-container');

// ============================================================
// ОПРОСЫ В ЧАТЕ
// ============================================================
const Polls = {
    active: [],

    create: () => {
        const question = prompt('Вопрос опроса:');
        if (!question) return;

        const options = [];
        for (let i = 0; i < 3; i++) {
            const option = prompt(`Вариант ${i + 1} (или отмена):`);
            if (option) options.push(option);
            else break;
        }

        if (options.length < 2) {
            Utils.toast('Нужно минимум 2 варианта', 'warning');
            return;
        }

        const poll = {
            id: Date.now(),
            question,
            options: options.map(o => ({ text: o, votes: [] })),
            createdBy: State.me?.username || 'Аноним',
            createdAt: new Date().toISOString(),
            active: true
        };

        Polls.active.unshift(poll);
        Utils.toast('Опрос создан!', 'success');
        Polls.renderInChat(poll);
    },

    vote: (pollId, optionIndex) => {
        const poll = Polls.active.find(p => p.id === pollId);
        if (!poll || !poll.active) return;

        const userId = State.me?.id || 'anon';
        
        // Проверяем, не голосовал ли уже
        poll.options.forEach(opt => {
            opt.votes = opt.votes.filter(v => v !== userId);
        });

        poll.options[optionIndex].votes.push(userId);
        Utils.toast(`Голос принят: ${poll.options[optionIndex].text}`, 'success');
        Polls.updatePollDisplay(pollId);
    },

    close: (pollId) => {
        const poll = Polls.active.find(p => p.id === pollId);
        if (!poll) return;

        poll.active = false;
        Utils.toast('Опрос закрыт', 'info');
        Polls.updatePollDisplay(pollId);
    },

    renderInChat: (poll) => {
        const container = document.getElementById('chat-messages');
        if (!container) return;

        const msgId = Date.now();
        const div = document.createElement('div');
        div.className = 'message';
        div.id = `poll-${poll.id}`;
        div.innerHTML = `
            <div class="msg-avatar">📊</div>
            <div class="msg-content">
                <div class="msg-header">
                    <span class="msg-author">${Utils.esc(poll.createdBy)}</span>
                    <span class="msg-time">только что</span>
                </div>
                <div class="poll-container" style="background: var(--bg-tertiary); padding: 16px; border-radius: 12px; margin-top: 8px;">
                    <div style="font-weight: 700; margin-bottom: 12px; font-size: 16px;">📊 ${Utils.esc(poll.question)}</div>
                    <div id="poll-options-${poll.id}">
                        ${poll.options.map((opt, idx) => `
                            <button onclick="Polls.vote(${poll.id}, ${idx})" 
                                style="width: 100%; padding: 10px; margin-bottom: 8px; background: var(--bg-primary); border: 1px solid var(--border); border-radius: 6px; color: var(--text-primary); cursor: pointer; text-align: left; font-size: 14px; transition: all 0.2s;"
                                onmouseover="this.style.background='var(--bg-hover)'" 
                                onmouseout="this.style.background='var(--bg-primary)'">
                                ${Utils.esc(opt.text)}
                            </button>
                        `).join('')}
                    </div>
                    <div style="font-size: 11px; color: var(--text-muted); margin-top: 8px;">
                        Всего голосов: ${poll.options.reduce((sum, opt) => sum + opt.votes.length, 0)}
                    </div>
                </div>
            </div>
        `;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    },

    updatePollDisplay: (pollId) => {
        const poll = Polls.active.find(p => p.id === pollId);
        if (!poll) return;

        const container = document.getElementById(`poll-options-${pollId}`);
        if (!container) return;

        const totalVotes = poll.options.reduce((sum, opt) => sum + opt.votes.length, 0);
        const userId = State.me?.id || 'anon';

        container.innerHTML = poll.options.map((opt, idx) => {
            const votes = opt.votes.length;
            const percent = totalVotes > 0 ? (votes / totalVotes) * 100 : 0;
            const voted = opt.votes.includes(userId);

            return `
                <div style="position: relative; padding: 10px; margin-bottom: 8px; background: var(--bg-primary); border: 1px solid ${voted ? 'var(--accent)' : 'var(--border)'}; border-radius: 6px; cursor: ${poll.active ? 'pointer' : 'default'};" 
                    onclick="${poll.active ? `Polls.vote(${pollId}, ${idx})` : ''}">
                    <div style="position: absolute; top: 0; left: 0; height: 100%; background: ${voted ? 'var(--accent-glow)' : 'rgba(255,255,255,0.05)'}; border-radius: 6px; width: ${percent}%; transition: width 0.3s;"></div>
                    <div style="position: relative; display: flex; justify-content: space-between; align-items: center;">
                        <span style="font-size: 14px;">${Utils.esc(opt.text)} ${voted ? '✓' : ''}</span>
                        <span style="font-size: 12px; color: var(--text-muted);">${votes} (${Math.round(percent)}%)</span>
                    </div>
                </div>
            `;
        }).join('');

        // Обновляем счетчик
        const pollEl = document.getElementById(`poll-${pollId}`);
        if (pollEl) {
            const counter = pollEl.querySelector('.poll-container > div:last-child');
            if (counter) {
                counter.textContent = `Всего голосов: ${totalVotes}${!poll.active ? ' · Опрос закрыт' : ''}`;
            }
        }
    }
};

const VoiceChannels = {
    connected: null,

    join: (channelId, channelName) => {
        if (VoiceChannels.connected) {
            Utils.toast('Ты уже в голосовом канале', 'warning');
            return;
        }

        VoiceChannels.connected = { id: channelId, name: channelName };
        Utils.toast(`Подключен к голосовому каналу "${channelName}"`, 'success');
        VoiceChannels.showUI();
    },

    leave: () => {
        if (!VoiceChannels.connected) return;
        
        const name = VoiceChannels.connected.name;
        VoiceChannels.connected = null;
        Utils.toast(`Покинул голосовой канал "${name}"`, 'info');
        VoiceChannels.hideUI();
    },

    showUI: () => {
        const taskbar = document.getElementById('tray');
        if (!taskbar) return;

        const voiceIndicator = document.createElement('div');
        voiceIndicator.id = 'voice-indicator';
        voiceIndicator.style.cssText = 'background: var(--success); padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; display: flex; align-items: center; gap: 4px;';
        voiceIndicator.innerHTML = `
            <span>🔊</span>
            <span>${VoiceChannels.connected.name}</span>
        `;
        voiceIndicator.onclick = () => {
            if (confirm('Покинуть голосовой канал?')) {
                VoiceChannels.leave();
            }
        };
        taskbar.insertBefore(voiceIndicator, taskbar.firstChild);
    },

    hideUI: () => {
        const indicator = document.getElementById('voice-indicator');
        if (indicator) indicator.remove();
    }
};

const BotCommands = {

        '/монетка': () => `🪙 Выпало: **${Math.random() > 0.5 ? 'Орёл' : 'Решка'}**!`,
        '/кубик': () => `🎲 Выпало: **${Math.floor(Math.random() * 6) + 1}**!`,
        '/шар': () => {
            const answers = ['Да', 'Нет', 'Возможно', 'Определённо да', 'Спроси позже', 'Мои источники говорят нет', 'Звёзды говорят да'];
            return `🎱 ${answers[Math.floor(Math.random() * answers.length)]}`;
        },
        '/рандом': () => ` Случайное число: **${Math.floor(Math.random() * 100) + 1}**`,
        '/погода': () => '🌤️ Сейчас в Москве: +15°C, переменная облачность',
        '/время': () => `🕐 Сейчас: ${new Date().toLocaleTimeString('ru-RU')}`,
        '/цитата': () => {
            const quotes = [
                'Код — это поэзия, которую понимает машина',
                'Лучший код — это тот, который не нужно писать',
                'Баги — это фичи, которые ещё не задокументированы',
                'Программирование — это искусство решать проблемы, которых ещё не существует'
            ];
            return `💬 ${quotes[Math.floor(Math.random() * quotes.length)]}`;
        },
        '/факт': () => {
            const facts = [
                'Первый компьютерный баг был найден в 1947 году — это был настоящий мотылёк',
                'Python назван в честь шоу Monty Python, а не змеи',
                'JavaScript был создан за 10 дней',
                'Первый сайт до сих пор работает: info.cern.ch'
            ];
            return `🧠 ${facts[Math.floor(Math.random() * facts.length)]}`;
        },
        '/аватар': (args) => `👤 Аватар пользователя ${args || 'неизвестно'}: [URL]`,
        '/инфо': (args) => `📊 Информация о сервере: ${Servers.current?.name || 'неизвестно'}, ${Servers.current?.members || 0} участников`,

    },

    execute: (text) => {
        const parts = text.split(' ');
        const command = parts[0].toLowerCase();
        const args = parts.slice(1).join(' ');

        const handler = BotCommands.commands[command];
        if (handler) {
            return handler(args);
        }
        return `❓ Неизвестная команда: ${command}. Напиши /помощь для списка команд.`;
    }

// ============================================================
const OriginalHandleCommand = Chat.handleCommand;
Chat.handleCommand = (cmd) => {
    const parts = cmd.split(' ');
    const command = parts[0].toLowerCase();

    // Проверяем новые команды
    if (BotCommands.commands[command]) {
        const result = BotCommands.execute(cmd);
        Chat.appendMessage({ user: '🤖 Бот', text: result, time: new Date().toISOString() });
        return;
    }

    // Команда /опрос
    if (command === '/опрос') {
        Polls.create();
        return;
    }

    // Команда /стата
    if (command === '/стата') {
        Stats.load();
        const msg = `📈 Сообщений сегодня: ${Stats.data.messagesToday} | Игр сыграно: ${Stats.data.gamesPlayed} | Время онлайн: ${Math.floor(Stats.data.timeOnline / 60)}ч`;
        Chat.appendMessage({ user: ' Бот', text: msg, time: new Date().toISOString() });
        return;
    }

    // Если команда не найдена — используем оригинальный обработчик
    OriginalHandleCommand(cmd);
};

window.addEventListener('load', () => {
    // Загружаем данные
    Servers.load();
    Inventory.load();
    Stats.load();
    ActivityLog.load();

    // Добавляем кнопки в шапку чата
    setTimeout(() => {
        ChatHeaderExtended.add();
    }, 600);

    // Трекаем активность при отправке сообщений
    const originalSend = Chat.appendMessage;
    Chat.appendMessage = (msg) => {
        originalSend(msg);
        if (msg.user !== '🤖 Бот' && msg.user !== 'System') {
            Stats.data.messagesToday++;
            Stats.data.messagesWeek++;
            ActivityLog.add('Отправлено сообщение', msg.text.substring(0, 50));
        }
    };

    // Трекаем игры
    const originalGames = Games.coinflip;
    Games.coinflip = () => {
        originalGames();
        Stats.data.gamesPlayed++;
        ActivityLog.add('Сыграна игра', 'Монетка');
    };

    console.log('%c✓ Extension #4 loaded: Servers + Inventory + Polls + Bookmarks + Voice + Stats', 'color: #f59e0b; font-weight: bold;');
});
