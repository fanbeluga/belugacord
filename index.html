<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Belugacord</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#313338">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
    font-family: 'gg sans', 'Segoe UI', Helvetica, Arial, sans-serif;
    background: #1e1f22;
    color: #dbdee1;
    display: flex;
    font-size: 14px;
}

/* ===== ПАНЕЛЬ СЕРВЕРОВ ===== */
.guilds {
    width: 72px;
    background: #1e1f22;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 0;
    gap: 8px;
    flex-shrink: 0;
    overflow-y: auto;
}
.guild {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #313338;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 18px;
    color: #dbdee1;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    flex-shrink: 0;
    overflow: hidden;
}
.guild:hover { border-radius: 16px; background: #5865f2; color: white; }
.guild.active { border-radius: 16px; background: #5865f2; color: white; }
.guild.active::before {
    content: '';
    position: absolute;
    left: -12px;
    top: 50%;
    transform: translateY(-50%);
    width: 8px;
    height: 40px;
    background: white;
    border-radius: 0 4px 4px 0;
}
.guild.friends { background: #313338; }
.guild.friends.active { background: #5865f2; }
.guild.friends svg { width: 26px; height: 26px; fill: currentColor; }
.guild-divider { width: 32px; height: 2px; background: #35373c; border-radius: 1px; flex-shrink: 0; }
.guild img { width: 100%; height: 100%; object-fit: cover; }

/* ===== БОКОВАЯ ПАНЕЛЬ ===== */
.sidebar {
    width: 240px;
    background: #2b2d31;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
}
.sidebar-header {
    height: 48px;
    padding: 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 1px 0 rgba(0,0,0,0.2);
    font-weight: 600;
    color: #f2f3f5;
    cursor: pointer;
    flex-shrink: 0;
    font-size: 15px;
}
.sidebar-header:hover { background: #35373c; }
.sidebar-content { flex: 1; overflow-y: auto; padding: 8px; }
.channel-cat {
    font-size: 11px;
    text-transform: uppercase;
    color: #949ba4;
    font-weight: 700;
    padding: 16px 8px 4px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    letter-spacing: 0.02em;
}
.channel {
    padding: 6px 8px;
    border-radius: 4px;
    color: #949ba4;
    cursor: pointer;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 2px;
    font-weight: 500;
}
.channel:hover { background: #35373c; color: #dbdee1; }
.channel.active { background: #404249; color: #f2f3f5; }
.channel .hash { font-size: 20px; color: #80848e; font-weight: 400; }

/* ===== ПАНЕЛЬ ПРОФИЛЯ (НИЗ) ===== */
.user-panel {
    height: 52px;
    background: #232428;
    display: flex;
    align-items: center;
    padding: 0 8px;
    gap: 8px;
    flex-shrink: 0;
}
.user-panel .avatar {
    width: 32px;
    height: 32px;
    font-size: 13px;
    cursor: pointer;
    position: relative;
}
.user-panel .user-info { flex: 1; min-width: 0; cursor: pointer; }
.user-panel .user-name {
    color: #f2f3f5;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.user-panel .user-status { color: #949ba4; font-size: 12px; }

/* ===== ОСНОВНАЯ ОБЛАСТЬ ===== */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #313338;
    min-width: 0;
}
.main-header {
    height: 48px;
    padding: 0 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 1px 0 rgba(0,0,0,0.2);
    font-weight: 600;
    color: #f2f3f5;
    flex-shrink: 0;
    font-size: 15px;
}
.main-header .hash { color: #80848e; font-size: 24px; }
.main-header .burger {
    display: none;
    background: none;
    border: none;
    color: #b5bac1;
    font-size: 22px;
    cursor: pointer;
    padding: 4px 8px;
    margin-left: -8px;
}

/* ===== СООБЩЕНИЯ ===== */
.messages { flex: 1; overflow-y: auto; padding: 16px 16px 0; }
.message { display: flex; gap: 16px; padding: 4px 0; margin-bottom: 4px; }
.message:hover { background: #2e3035; border-radius: 4px; }
.avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #5865f2;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    color: white;
    font-size: 16px;
    overflow: hidden;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.msg-content { flex: 1; min-width: 0; padding-top: 2px; }
.msg-header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
.username { font-weight: 600; color: #f2f3f5; font-size: 15px; }
.timestamp { font-size: 12px; color: #949ba4; }
.msg-text { color: #dbdee1; font-size: 15px; line-height: 1.375; word-wrap: break-word; }

/* ===== ПОЛЕ ВВОДА ===== */
.input-area { padding: 8px 16px 24px; flex-shrink: 0; }
.input-box {
    background: #383a40;
    border-radius: 8px;
    display: flex;
    align-items: center;
    padding: 0 16px;
}
.input-box input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: #dbdee1;
    font-size: 15px;
    padding: 11px 0;
    font-family: inherit;
}
.input-box input::placeholder { color: #6d6f78; }

/* ===== ЭКРАН ДРУЗЕЙ ===== */
.friends-screen { display: none; flex-direction: column; flex: 1; overflow: hidden; }
.friends-screen.active { display: flex; }
.friends-topbar {
    height: 48px;
    padding: 0 16px;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: 0 1px 0 rgba(0,0,0,0.2);
    flex-shrink: 0;
    overflow-x: auto;
}
.friends-tab {
    color: #b5bac1;
    padding: 4px 8px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 500;
    white-space: nowrap;
}
.friends-tab:hover { background: #35373c; color: #dbdee1; }
.friends-tab.active { background: #404249; color: #f2f3f5; }
.friends-body { flex: 1; overflow-y: auto; padding: 16px 24px; }
.friends-body h3 {
    font-size: 12px;
    text-transform: uppercase;
    color: #949ba4;
    font-weight: 700;
    margin: 16px 0 8px;
    letter-spacing: 0.02em;
}
.friend-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 2px;
}
.friend-row:hover { background: #35373c; }
.friend-row .avatar { width: 32px; height: 32px; font-size: 13px; }
.friend-name { color: #f2f3f5; font-weight: 600; font-size: 15px; }
.friend-status { color: #949ba4; font-size: 13px; }
.friend-actions { margin-left: auto; display: flex; gap: 8px; }
.friend-actions button {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #2b2d31;
    border: none;
    color: #b5bac1;
    cursor: pointer;
    font-size: 16px;
}
.friend-actions button:hover { background: #404249; color: #f2f3f5; }
.add-friend-box {
    background: #1e1f22;
    border-radius: 8px;
    padding: 16px;
    margin-top: 8px;
}
.add-friend-box p { color: #b5bac1; font-size: 14px; margin-bottom: 8px; }
.add-friend-input {
    display: flex;
    gap: 8px;
}
.add-friend-input input {
    flex: 1;
    background: #2b2d31;
    border: 1px solid #1e1f22;
    border-radius: 4px;
    padding: 10px 12px;
    color: #dbdee1;
    font-size: 14px;
    outline: none;
}
.add-friend-input input:focus { border-color: #5865f2; }
.add-friend-input button {
    background: #5865f2;
    color: white;
    border: none;
    padding: 0 16px;
    border-radius: 4px;
    font-weight: 600;
    cursor: pointer;
}
.add-friend-input button:hover { background: #4752c4; }

/* ===== МОДАЛКА ПРОФИЛЯ ===== */
.modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow-y: auto;
}
.modal-overlay.open { display: flex; }
.modal {
    background: #313338;
    border-radius: 8px;
    width: 100%;
    max-width: 500px;
    max-height: 90vh;
    overflow-y: auto;
    position: relative;
}
.banner {
    height: 120px;
    background: #5865f2;
    border-radius: 8px 8px 0 0;
    position: relative;
    overflow: hidden;
}
.banner img { width: 100%; height: 100%; object-fit: cover; object-position: center; }
.banner-edit {
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(0,0,0,0.6);
    color: white;
    border: none;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
}
.banner-edit:hover { background: rgba(0,0,0,0.8); }
.profile-avatar {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: #5865f2;
    border: 6px solid #313338;
    position: absolute;
    top: 80px;
    left: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: 600;
    color: white;
    overflow: hidden;
    cursor: pointer;
}
.profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
.profile-info { padding: 56px 24px 24px; }
.profile-info h2 { color: #f2f3f5; font-size: 20px; margin-bottom: 16px; }
.profile-info label {
    display: block;
    color: #b5bac1;
    font-size: 12px;
    text-transform: uppercase;
    font-weight: 700;
    margin: 16px 0 8px;
    letter-spacing: 0.02em;
}
.profile-info input[type="text"] {
    width: 100%;
    background: #1e1f22;
    border: none;
    border-radius: 4px;
    padding: 10px;
    color: #dbdee1;
    font-size: 15px;
    outline: none;
}
.save-btn {
    margin-top: 24px;
    width: 100%;
    background: #5865f2;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 4px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
}
.save-btn:hover { background: #4752c4; }
.close-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    background: rgba(0,0,0,0.6);
    color: white;
    border: none;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    z-index: 10;
}

/* ===== АДАПТИВ ===== */
@media (max-width: 768px) {
    .guilds { width: 56px; padding: 8px 0; }
    .guild { width: 40px; height: 40px; font-size: 15px; }
    .sidebar {
        position: fixed;
        left: 56px;
        top: 0;
        bottom: 0;
        z-index: 500;
        transform: translateX(-120%);
        transition: transform 0.2s;
        box-shadow: 4px 0 12px rgba(0,0,0,0.4);
    }
    .sidebar.open { transform: translateX(0); }
    .main-header .burger { display: block; }
    .messages { padding: 12px 12px 0; }
    .message { gap: 12px; }
    .avatar { width: 36px; height: 36px; font-size: 14px; }
    .input-area { padding: 8px 12px 16px; }
    .friends-body { padding: 12px 16px; }
    .overlay-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.5);
        z-index: 400;
    }
    .overlay-backdrop.open { display: block; }
}

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #1a1b1e; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #111214; }
</style>
</head>
<body>

<!-- ПАНЕЛЬ СЕРВЕРОВ -->
<div class="guilds" id="guilds">
    <div class="guild friends active" onclick="showFriends()" title="Друзья">
        <svg viewBox="0 0 24 24"><path d="M13 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm-9 10a1 1 0 0 1-1-1v-1c0-2.76 3.58-5 8-5s8 2.24 8 5v1a1 1 0 0 1-1 1H4zm16-10a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm-1 2c1.5 0 2.8.5 3.7 1.4.6.6.3 1.6-.5 1.6H16v-2c0-.4 0-.7-.1-1h3.1z"/></svg>
    </div>
    <div class="guild-divider"></div>
    <div class="guild active" id="serverBtn" onclick="showServer()" title="Belugacord">B</div>
</div>

<!-- БОКОВАЯ ПАНЕЛЬ -->
<div class="sidebar" id="sidebar">
    <div class="sidebar-header" id="sidebarHeader">
        <span id="sidebarTitle">Belugacord</span>
        <span>▾</span>
    </div>
    <div class="sidebar-content" id="sidebarContent">
        <div class="channel-cat">Текстовые каналы</div>
        <div class="channel active"><span class="hash">#</span> общий</div>
    </div>
    <div class="user-panel">
        <div class="avatar" id="userAvatarSmall" onclick="openProfile()">?</div>
        <div class="user-info" onclick="openProfile()">
            <div class="user-name" id="userNameSmall">Гость</div>
            <div class="user-status">в сети</div>
        </div>
    </div>
</div>

<div class="overlay-backdrop" id="backdrop" onclick="toggleSidebar()"></div>

<!-- ОСНОВНАЯ ОБЛАСТЬ -->
<div class="main">

    <!-- Экран чата -->
    <div id="chatScreen" style="display:flex;flex-direction:column;flex:1;overflow:hidden;">
        <div class="main-header">
            <button class="burger" onclick="toggleSidebar()">☰</button>
            <span class="hash">#</span>
            <span>общий</span>
        </div>
        <div class="messages" id="chat"></div>
        <div class="input-area">
            <div class="input-box">
                <input id="inp" placeholder="Написать в #общий..." autocomplete="off">
            </div>
        </div>
    </div>

    <!-- Экран друзей -->
    <div class="friends-screen" id="friendsScreen">
        <div class="friends-topbar">
            <div class="friends-tab active">Все</div>
            <div class="friends-tab">В сети</div>
            <div class="friends-tab">В ожидании</div>
            <div class="friends-tab">Заблокированные</div>
        </div>
        <div class="friends-body">
            <div class="add-friend-box">
                <p>ДОБАВИТЬ В ДРУЗЬЯ</p>
                <div class="add-friend-input">
                    <input type="text" placeholder="Введите имя пользователя" id="addFriendInput">
                    <button onclick="addFriend()">Отправить запрос</button>
                </div>
            </div>
            <h3>Друзья — 0</h3>
            <p style="color:#949ba4;font-size:14px;padding:8px 0;">Пока никого нет. Добавь друга по имени.</p>
        </div>
    </div>

</div>

<!-- МОДАЛКА ПРОФИЛЯ -->
<div class="modal-overlay" id="profileModal">
    <div class="modal">
        <button class="close-btn" onclick="closeProfile()">✕</button>
        <div class="banner" id="bannerPreview">
            <button class="banner-edit" onclick="document.getElementById('bannerInput').click()">Изменить баннер</button>
        </div>
        <div class="profile-avatar" id="avatarPreview" onclick="document.getElementById('avatarInput').click()">?</div>
        <div class="profile-info">
            <h2>Мой профиль</h2>
            <label>Имя пользователя</label>
            <input type="text" id="nameInput" placeholder="Введи имя" maxlength="32">
            <label>Пароль (сохраняется в браузере)</label>
            <input type="text" id="passInput" placeholder="Пароль" maxlength="64">
            <button class="save-btn" onclick="saveProfile()">Сохранить</button>
        </div>
    </div>
</div>

<input type="file" id="avatarInput" accept="image/*" style="display:none">
<input type="file" id="bannerInput" accept="image/*" style="display:none">

<script>
// ===== ПРОФИЛЬ =====
let profile = JSON.parse(localStorage.getItem('belugacord_profile') || '{}');
let avatarData = profile.avatar || null;
let bannerData = profile.banner || null;
let userName = profile.name || 'Гость';
let userPass = profile.pass || '';

function renderProfile() {
    const smallAvatar = document.getElementById('userAvatarSmall');
    if (avatarData) smallAvatar.innerHTML = '<img src="' + avatarData + '">';
    else smallAvatar.textContent = userName.charAt(0).toUpperCase();
    document.getElementById('userNameSmall').textContent = userName;

    const bigAvatar = document.getElementById('avatarPreview');
    if (avatarData) bigAvatar.innerHTML = '<img src="' + avatarData + '">';
    else bigAvatar.textContent = userName.charAt(0).toUpperCase();

    const banner = document.getElementById('bannerPreview');
    const oldImg = banner.querySelector('img');
    if (oldImg) oldImg.remove();
    if (bannerData) {
        const img = document.createElement('img');
        img.src = bannerData;
        banner.insertBefore(img, banner.firstChild);
    }
    document.getElementById('nameInput').value = userName;
    document.getElementById('passInput').value = userPass;
}

function openProfile() {
    renderProfile();
    document.getElementById('profileModal').classList.add('open');
}
function closeProfile() {
    document.getElementById('profileModal').classList.remove('open');
}
function saveProfile() {
    userName = document.getElementById('nameInput').value.trim() || 'Гость';
    userPass = document.getElementById('passInput').value.trim();
    profile = { name: userName, pass: userPass, avatar: avatarData, banner: bannerData };
    localStorage.setItem('belugacord_profile', JSON.stringify(profile));
    renderProfile();
    closeProfile();
    if (ws && ws.readyState === WebSocket.OPEN) { ws.close(); connect(); }
}

document.getElementById('avatarInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => { avatarData = ev.target.result; renderProfile(); };
    reader.readAsDataURL(file);
});
document.getElementById('bannerInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => { bannerData = ev.target.result; renderProfile(); };
    reader.readAsDataURL(file);
});

// ===== НАВИГАЦИЯ =====
function showFriends() {
    document.getElementById('friendsScreen').classList.add('active');
    document.getElementById('chatScreen').style.display = 'none';
    document.querySelector('.guild.friends').classList.add('active');
    document.getElementById('serverBtn').classList.remove('active');
    document.getElementById('sidebarTitle').textContent = 'Друзья';
    document.getElementById('sidebarContent').innerHTML = '<div style="padding:16px;color:#949ba4;font-size:14px;">Список друзей появится здесь.</div>';
    if (window.innerWidth <= 768) toggleSidebar();
}
function showServer() {
    document.getElementById('friendsScreen').classList.remove('active');
    document.getElementById('chatScreen').style.display = 'flex';
    document.querySelector('.guild.friends').classList.remove('active');
    document.getElementById('serverBtn').classList.add('active');
    document.getElementById('sidebarTitle').textContent = 'Belugacord';
    document.getElementById('sidebarContent').innerHTML = '<div class="channel-cat">Текстовые каналы</div><div class="channel active"><span class="hash">#</span> общий</div>';
    if (window.innerWidth <= 768) toggleSidebar();
}
function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('backdrop').classList.toggle('open');
}

// ===== ДРУЗЬЯ (заглушка) =====
function addFriend() {
    const inp = document.getElementById('addFriendInput');
    if (!inp.value.trim()) return;
    alert('Запрос отправлен: ' + inp.value + '\n\n(Функция в разработке — нужна база данных)');
    inp.value = '';
}

// ===== ЧАТ =====
let ws;
function connect() {
    const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
    ws = new WebSocket(proto + location.host + '/ws');
    ws.onopen = () => ws.send(JSON.stringify({ type: 'join', name: userName }));
    ws.onmessage = (event) => {
        let data;
        try { data = JSON.parse(event.data); } catch(e) { return; }
        if (data.type === 'message') addMessage(data.name, data.text, data.avatar);
    };
    ws.onclose = () => setTimeout(connect, 2000);
}

function addMessage(name, text, avatar) {
    const chat = document.getElementById('chat');
    const div = document.createElement('div');
    div.className = 'message';
    const time = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    let avatarHTML = '<div class="avatar">' + name.charAt(0).toUpperCase() + '</div>';
    if (avatar) avatarHTML = '<div class="avatar"><img src="' + avatar + '"></div>';
    div.innerHTML = avatarHTML +
        '<div class="msg-content">' +
            '<div class="msg-header">' +
                '<span class="username">' + escapeHtml(name) + '</span>' +
                '<span class="timestamp">сегодня в ' + time + '</span>' +
            '</div>' +
            '<div class="msg-text">' + escapeHtml(text) + '</div>' +
        '</div>';
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}
function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function send() {
    const inp = document.getElementById('inp');
    const text = inp.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: 'message', text, name: userName, avatar: avatarData }));
    inp.value = '';
}
document.getElementById('inp').addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });

// ===== СТАРТ =====
renderProfile();
connect();
</script>
