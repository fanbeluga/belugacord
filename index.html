<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belugacord</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#5865f2">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'gg sans', 'Segoe UI', Arial, sans-serif;
            background: #1e1f22;
            color: #dbdee1;
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* ===== ЛЕВАЯ ПАНЕЛЬ (СЕРВЕРЫ) ===== */
        .guilds {
            width: 72px;
            background: #1e1f22;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 0;
            gap: 8px;
            overflow-y: auto;
        }
        .guild {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #5865f2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }
        .guild:hover { border-radius: 16px; background: #4752c4; }
        .guild.active { border-radius: 16px; }

        /* ===== КАНАЛЫ ===== */
        .channels {
            width: 240px;
            background: #2b2d31;
            display: flex;
            flex-direction: column;
        }
        .server-header {
            height: 48px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 1px 0 rgba(0,0,0,0.2);
            font-weight: 600;
            color: #f2f3f5;
            cursor: pointer;
        }
        .server-header:hover { background: #35373c; }
        .channels-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px 8px;
        }
        .channel-category {
            font-size: 12px;
            text-transform: uppercase;
            color: #949ba4;
            font-weight: 600;
            padding: 8px 8px 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .channel {
            padding: 6px 8px;
            border-radius: 4px;
            color: #949ba4;
            cursor: pointer;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 2px;
        }
        .channel:hover { background: #35373c; color: #dbdee1; }
        .channel.active { background: #404249; color: #f2f3f5; }

        /* ===== ОСНОВНАЯ ОБЛАСТЬ ===== */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #313338;
            min-width: 0;
        }

        /* ===== ШАПКА КАНАЛА ===== */
        .chat-header {
            height: 48px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 1px 0 rgba(0,0,0,0.2);
            font-weight: 600;
            color: #f2f3f5;
            flex-shrink: 0;
        }
        .chat-header .hash { color: #949ba4; font-size: 24px; }

        /* ===== ОБЛАСТЬ СООБЩЕНИЙ ===== */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        .message {
            display: flex;
            gap: 16px;
            padding: 8px 0;
            margin-bottom: 4px;
        }
        .message:hover { background: #2e3035; border-radius: 4px; }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #5865f2;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 16px;
            overflow: hidden;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .msg-content { flex: 1; min-width: 0; }
        .msg-header {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 2px;
        }
        .username { font-weight: 600; color: #f2f3f5; font-size: 15px; }
        .timestamp { font-size: 12px; color: #949ba4; }
        .msg-text { color: #dbdee1; font-size: 15px; line-height: 1.4; word-wrap: break-word; }

        /* ===== ПОЛЕ ВВОДА ===== */
        .input-area {
            padding: 0 16px 24px;
            flex-shrink: 0;
        }
        .input-box {
            background: #383a40;
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 0 16px;
        }
        .input-box input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: #dbdee1;
            font-size: 15px;
            padding: 11px 0;
            font-family: inherit;
        }
        .input-box input::placeholder { color: #6d6f78; }

        /* ===== МОДАЛКА НАСТРОЕК ПРОФИЛЯ ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: #313338;
            border-radius: 8px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }
        .banner {
            height: 120px;
            background: #5865f2;
            border-radius: 8px 8px 0 0;
            position: relative;
            overflow: hidden;
        }
        .banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }
        .banner-edit {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        .banner-edit:hover { background: rgba(0,0,0,0.8); }
        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #5865f2;
            border: 6px solid #313338;
            position: absolute;
            top: 80px;
            left: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            color: white;
            overflow: hidden;
            cursor: pointer;
        }
        .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .profile-info {
            padding: 48px 24px 24px;
        }
        .profile-info h2 {
            color: #f2f3f5;
            font-size: 20px;
            margin-bottom: 8px;
        }
        .profile-info label {
            display: block;
            color: #b5bac1;
            font-size: 12px;
            text-transform: uppercase;
            font-weight: 600;
            margin: 16px 0 8px;
        }
        .profile-info input[type="text"] {
            width: 100%;
            background: #1e1f22;
            border: none;
            border-radius: 4px;
            padding: 10px;
            color: #dbdee1;
            font-size: 15px;
            outline: none;
        }
        .save-btn {
            margin-top: 24px;
            width: 100%;
            background: #5865f2;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 4px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        .save-btn:hover { background: #4752c4; }
        .close-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            z-index: 10;
        }

        /* ===== НИЖНЯЯ ПАНЕЛЬ ПРОФИЛЯ ===== */
        .user-panel {
            height: 52px;
            background: #232428;
            display: flex;
            align-items: center;
            padding: 0 8px;
            gap: 8px;
            flex-shrink: 0;
        }
        .user-panel .avatar {
            width: 32px;
            height: 32px;
            font-size: 14px;
            cursor: pointer;
        }
        .user-panel .user-info {
            flex: 1;
            min-width: 0;
            cursor: pointer;
        }
        .user-panel .user-name {
            color: #f2f3f5;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .user-panel .user-status {
            color: #949ba4;
            font-size: 12px;
        }

        /* Скроллбар */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #1a1b1e; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #111214; }
    </style>
</head>
<body>
    <!-- ЛЕВАЯ ПАНЕЛЬ -->
    <div class="guilds">
        <div class="guild active">B</div>
    </div>

    <!-- КАНАЛЫ -->
    <div class="channels">
        <div class="server-header">
            <span>Belugacord</span>
            <span>▾</span>
        </div>
        <div class="channels-list">
            <div class="channel-category">Текстовые каналы</div>
            <div class="channel active"><span>#</span> общий</div>
        </div>
        <div class="user-panel">
            <div class="avatar" id="userAvatarSmall">?</div>
            <div class="user-info" onclick="openProfile()">
                <div class="user-name" id="userNameSmall">Гость</div>
                <div class="user-status">в сети</div>
            </div>
        </div>
    </div>

    <!-- ОСНОВНАЯ ОБЛАСТЬ -->
    <div class="main">
        <div class="chat-header">
            <span class="hash">#</span>
            <span>общий</span>
        </div>
        <div class="messages" id="chat"></div>
        <div class="input-area">
            <div class="input-box">
                <input id="inp" placeholder="Написать в #общий..." autocomplete="off">
            </div>
        </div>
    </div>

    <!-- МОДАЛКА ПРОФИЛЯ -->
    <div class="modal-overlay" id="profileModal">
        <div class="modal">
            <button class="close-btn" onclick="closeProfile()">✕</button>
            <div class="banner" id="bannerPreview">
                <button class="banner-edit" onclick="document.getElementById('bannerInput').click()">Изменить баннер</button>
            </div>
            <div class="profile-avatar" id="avatarPreview" onclick="document.getElementById('avatarInput').click()">?</div>
            <div class="profile-info">
                <h2>Мой профиль</h2>
                <label>Имя пользователя</label>
                <input type="text" id="nameInput" placeholder="Введи имя" maxlength="32">
                <button class="save-btn" onclick="saveProfile()">Сохранить</button>
            </div>
        </div>
    </div>

    <input type="file" id="avatarInput" accept="image/*" style="display:none">
    <input type="file" id="bannerInput" accept="image/*" style="display:none">

    <script>
        // ===== ПРОФИЛЬ =====
        let profile = JSON.parse(localStorage.getItem('belugacord_profile') || '{}');
        let avatarData = profile.avatar || null;
        let bannerData = profile.banner || null;
        let userName = profile.name || 'Гость';

        function renderProfile() {
            // Маленькая аватарка
            const smallAvatar = document.getElementById('userAvatarSmall');
            if (avatarData) {
                smallAvatar.innerHTML = '<img src="' + avatarData + '">';
            } else {
                smallAvatar.textContent = userName.charAt(0).toUpperCase();
            }
            document.getElementById('userNameSmall').textContent = userName;

            // Большая аватарка в модалке
            const bigAvatar = document.getElementById('avatarPreview');
            if (avatarData) {
                bigAvatar.innerHTML = '<img src="' + avatarData + '">';
            } else {
                bigAvatar.textContent = userName.charAt(0).toUpperCase();
            }

            // Баннер
            const banner = document.getElementById('bannerPreview');
            if (bannerData) {
                // Убираем старую картинку, если есть
                const oldImg = banner.querySelector('img');
                if (oldImg) oldImg.remove();
                const img = document.createElement('img');
                img.src = bannerData;
                banner.insertBefore(img, banner.firstChild);
            }

            document.getElementById('nameInput').value = userName;
        }

        function openProfile() {
            renderProfile();
            document.getElementById('profileModal').classList.add('open');
        }

        function closeProfile() {
            document.getElementById('profileModal').classList.remove('open');
        }

        function saveProfile() {
            userName = document.getElementById('nameInput').value.trim() || 'Гость';
            profile = { name: userName, avatar: avatarData, banner: bannerData };
            localStorage.setItem('belugacord_profile', JSON.stringify(profile));
            renderProfile();
            closeProfile();
            // Переподключаемся, чтобы обновить имя на сервере
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.close();
                connect();
            }
        }

        // Аватарка
        document.getElementById('avatarInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                avatarData = ev.target.result;
                renderProfile();
            };
            reader.readAsDataURL(file);
        });

        // Баннер — с сохранением качества (object-fit: cover)
        document.getElementById('bannerInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                bannerData = ev.target.result;
                renderProfile();
            };
            reader.readAsDataURL(file);
        });

        // ===== ЧАТ =====
        let ws;

        function connect() {
            const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
            ws = new WebSocket(proto + location.host + '/ws');

            ws.onopen = () => {
                // Отправляем имя при подключении
                ws.send(JSON.stringify({ type: 'join', name: userName }));
            };

            ws.onmessage = (event) => {
                let data;
                try { data = JSON.parse(event.data); } catch(e) { return; }
                if (data.type === 'message') {
                    addMessage(data.name, data.text, data.avatar);
                }
            };

            ws.onclose = () => {
                setTimeout(connect, 2000);
            };
        }

        function addMessage(name, text, avatar) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = 'message';

            const time = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

            let avatarHTML = '<div class="avatar">' + name.charAt(0).toUpperCase() + '</div>';
            if (avatar) {
                avatarHTML = '<div class="avatar"><img src="' + avatar + '"></div>';
            }

            div.innerHTML = avatarHTML +
                '<div class="msg-content">' +
                    '<div class="msg-header">' +
                        '<span class="username">' + escapeHtml(name) + '</span>' +
                        '<span class="timestamp">сегодня в ' + time + '</span>' +
                    '</div>' +
                    '<div class="msg-text">' + escapeHtml(text) + '</div>' +
                '</div>';

            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, (c) => ({
                '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
            }[c]));
        }

        function send() {
            const inp = document.getElementById('inp');
            const text = inp.value.trim();
            if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
            ws.send(JSON.stringify({ type: 'message', text: text, name: userName, avatar: avatarData }));
            inp.value = '';
        }

        document.getElementById('inp').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') send();
        });

        // ===== СТАРТ =====
        renderProfile();
        connect();
    </script>
</body>
</html>
