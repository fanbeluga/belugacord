<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BelugaCord</title>
<link rel="icon" href="icon-192x192.png">
<link rel="apple-touch-icon" href="icon-192x192.png">
<style>
:root{--bg:#151c26;--card:#1d2733;--head:#202c3a;--acc:#4fa3ea;--txt:#fff;--dim:#8a99ab;--line:#121a23;--in:#1e2c3b;--nav:#1e2a38;--sel:#2b4259;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#eef1f5;--card:#fff;--head:#fff;--acc:#2a8bd8;--txt:#000;--dim:#7d8a99;--line:#e3e7ec;--in:#fff;--nav:#fff;--sel:#dcecfb}
html,body{height:100%;background:#000}*{box-sizing:border-box;margin:0}
body{color:var(--txt);font:16px/1.3 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit;border:0;background:none;outline:none}button{cursor:pointer}
#app{max-width:480px;height:100%;margin:0 auto;position:relative;background:var(--bg);overflow:hidden}
.scr{position:absolute;inset:0;display:none;flex-direction:column}.scr.on{display:flex}
.sc{flex:1;overflow:auto;padding:0 0 110px}
.ov{z-index:3;background:var(--bg)}
.hd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;font-size:22px;font-weight:500;flex:none}
.dots{color:var(--dim);padding:0 8px;font-size:22px}
.srch{margin:6px 14px 10px;background:var(--head);border-radius:24px;padding:13px 18px;color:var(--dim);display:block;width:calc(100% - 28px)}
.row{display:flex;gap:14px;padding:9px 16px;align-items:center;cursor:pointer}.row:active{background:var(--card)}
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:500;flex:none;position:relative}
.mid{flex:1;min-width:0}.r1,.r2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.r1 b{font-weight:500;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pre{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dim{color:var(--dim)}.sm{font-size:13px}
.t{color:var(--dim);font-size:13px;white-space:nowrap}.pin{background:var(--card);border-radius:12px;padding:2px 10px;font-size:13px;color:var(--dim)}
.bd{background:var(--acc);color:#fff;border-radius:14px;min-width:26px;height:26px;padding:0 8px;font-size:14px;display:grid;place-items:center}.bd.m{background:var(--sel);color:var(--dim)}
.tk{display:inline-block;width:17px;height:12px;fill:var(--acc);vertical-align:-1px;margin-right:6px}
.card{background:var(--card);border-radius:18px;margin:10px 14px;overflow:hidden}
.li{display:flex;align-items:center;gap:16px;padding:13px 16px;width:100%;text-align:left}.li+.li{border-top:1px solid var(--line)}
.li .v{margin-left:auto;color:var(--acc)}.ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px;flex:none}
.cap{color:var(--acc);padding:14px 20px 4px;font-size:15px}
#nav{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--nav);border-radius:32px;display:flex;padding:6px;z-index:2;box-shadow:0 4px 20px #0007}
#nav button{flex:1;padding:7px 0 6px;border-radius:26px;color:var(--dim);font-size:13px;position:relative;display:grid;justify-items:center;gap:1px}
#nav button.on{background:var(--sel);color:var(--acc);font-weight:500}#nav .e{font-size:22px;line-height:26px}
#nav .nb{position:absolute;top:0;left:54%;background:var(--acc);color:#fff;font-size:11px;border-radius:9px;padding:1px 6px}
.back{width:44px;height:44px;border-radius:50%;background:var(--head);display:grid;place-items:center;font-size:22px;flex:none}
.top{display:flex;gap:8px;padding:10px 12px;align-items:center;flex:none}
.pill{flex:1;background:var(--head);border-radius:26px;padding:6px 14px 6px 6px;display:flex;gap:10px;align-items:center;min-width:0;cursor:pointer}
.pill b{font-weight:500;display:block;font-size:17px;line-height:1.1}
#msgs{flex:1;overflow:auto;padding:8px 10px;display:flex;flex-direction:column;gap:3px;background-image:radial-gradient(#ffffff0a 2px,transparent 2.5px);background-size:34px 34px}
.chip{align-self:center;background:#0005;color:#fff;border-radius:14px;padding:3px 14px;font-size:14px;margin:6px 0}
.b{max-width:80%;padding:7px 11px 5px;border-radius:18px 18px 18px 5px;background:var(--in);align-self:flex-start;word-break:break-word;font-size:17px}
.b.out{background:linear-gradient(135deg,#9a3fc0,#6f55dc);align-self:flex-end;border-radius:18px 18px 5px 18px;color:#fff}
.b .mt{float:right;margin:9px 0 -3px 10px;font-size:12px;color:var(--dim);display:inline-flex;align-items:center}.b.out .mt{color:#ffffffb0}.b.out .tk{fill:#fff;margin:0 0 0 4px}
.svc{align-self:center;margin:8px 0;text-align:center}.svc .t2{background:#0005;color:#fff;border-radius:14px;padding:3px 12px;font-size:13px;display:inline-block;margin-bottom:6px}
.bar{display:flex;gap:8px;padding:8px 10px 12px;align-items:center;flex:none}
.in{flex:1;background:var(--head);border-radius:26px;display:flex;align-items:center;padding:0 6px 0 14px;min-height:50px}.in input{flex:1;min-width:0;padding:12px 8px;font-size:17px}
.in button{width:40px;height:40px;border-radius:50%;color:var(--dim);font-size:22px}
#sb{width:50px;height:50px;border-radius:50%;background:#2a9df4;color:#fff;font-size:22px;flex:none}
.g{width:100%;max-width:200px;padding:14px 12px;text-align:center;position:relative;overflow:hidden;border-radius:18px;color:#fff;margin:0 auto}
.g .art{font-size:58px;display:block;margin:2px 0 6px;position:relative;z-index:1;filter:drop-shadow(0 4px 8px #0006)}
.g small{display:block;opacity:.85;font-size:13px;position:relative;z-index:1}.g b{display:block;font-weight:500;position:relative;z-index:1}
.g .sym{position:absolute;font-size:16px;opacity:.3;animation:drift 5s linear infinite}
.g .r{font-size:11px;padding:1px 8px;border-radius:9px;background:#0004;display:inline-block;margin:4px 0;position:relative;z-index:1}
.legendary .r{background:#fbbf24;color:#000}.epic .r{background:#a855f7}.rare .r{background:#0ea5e9}
.float .art{animation:float 3s ease-in-out infinite}.spin .art{animation:spin 4s linear infinite}.pulse .art{animation:pulse 1.4s ease-in-out infinite}.shake .art{animation:shake .5s steps(2) infinite}
@keyframes float{50%{transform:translateY(-8px)}}@keyframes spin{to{transform:rotateY(360deg)}}@keyframes pulse{50%{transform:scale(1.18)}}@keyframes shake{25%{transform:translate(2px,-1px)}75%{transform:translate(-2px,1px)}}@keyframes drift{from{transform:translateY(130px)}to{transform:translateY(-150px)}}
.acts{display:flex;gap:6px;justify-content:center;margin-top:8px;position:relative;z-index:1}.acts button{background:#fff3;border-radius:14px;padding:5px 12px;font-size:13px;color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:6px 12px}
.tile{background:var(--card);border-radius:18px;aspect-ratio:.82;position:relative;overflow:hidden;display:grid;place-items:center;cursor:pointer;padding-bottom:42px}
.tile .e{font-size:52px}.tile .p{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:#3a3326;color:#ffc94a;border-radius:16px;padding:5px 12px;font-size:15px;white-space:nowrap}
.tile.mk .e{filter:brightness(0) opacity(.25)}
.tile.mk:after{content:"Маркет";position:absolute;top:14px;right:-28px;background:#2fb344;color:#fff;font-size:12px;padding:3px 32px;transform:rotate(45deg)}
.seg{display:flex;background:var(--card);border-radius:24px;margin:10px 14px;padding:5px;gap:2px}.seg button{flex:1;padding:9px 6px;border-radius:20px;color:var(--dim);font-size:15px}.seg .on{background:var(--sel);color:var(--acc)}
.big{display:grid;justify-items:center;padding:14px 0 6px;text-align:center}
.orb{position:relative;width:260px;height:230px;display:grid;place-items:center}.orb i{position:absolute;font-style:normal;font-size:30px;animation:float 3s ease-in-out infinite}
#sheet{position:absolute;inset:0;z-index:5;background:#0008;display:none;align-items:flex-end}#sheet.on{display:flex}
#sh{background:var(--card);border-radius:22px 22px 0 0;width:100%;max-height:78%;overflow:auto;padding:16px 0 calc(16px + env(safe-area-inset-bottom,0px))}
#sh h3{font-weight:500;padding:0 20px 10px;font-size:19px}
#toast{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;border-radius:20px;padding:9px 18px;display:none;z-index:9;white-space:nowrap}
.fld{display:block;width:100%;background:var(--head);color:var(--txt);border-radius:12px;padding:12px 14px;margin:8px 0;border:0;font-size:16px;outline:none}
.pillb{display:block;text-align:center;background:var(--acc);color:#fff;border-radius:12px;padding:12px;margin-top:10px;font-size:16px;width:100%;text-decoration:none}
.pillb.r{background:#d6455d}.pillb.t{background:var(--sel);color:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini{background:#3a3326;color:#ffc94a;border-radius:14px;padding:7px 14px}
.b{white-space:pre-wrap}
.scr.on:not(.ov){animation:fin .25s ease}
.ov.on{animation:sl .3s cubic-bezier(.2,.8,.2,1)}
.b{animation:pop .22s ease-out}.svc .g{animation:gin .7s cubic-bezier(.3,1.6,.5,1)}
#sh{animation:up .3s cubic-bezier(.2,.8,.2,1)}
.row,.tile,.li,#nav button,.pillb,.mini{transition:background .15s,transform .15s}
.tile:active,.pillb:active,.mini:active,#nav button:active{transform:scale(.95)}.tile:hover{transform:translateY(-2px)}
.g.common:after,.g.rare:after,.g.epic:after,.g.legendary:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;background:linear-gradient(110deg,transparent 35%,#ffffff45 50%,transparent 65%);transform:translateX(-120%);animation:sh 3.2s ease-in-out infinite}
.g.legendary{box-shadow:0 0 22px #fbbf2466}
@keyframes fin{from{opacity:0;transform:translateY(8px)}}@keyframes sl{from{opacity:0;transform:translateX(40px)}}
@keyframes pop{from{opacity:0;transform:scale(.92)}}@keyframes gin{from{opacity:0;transform:scale(.5) rotate(-8deg)}}
@keyframes up{from{opacity:0;transform:translateY(40px)}}@keyframes sh{60%,100%{transform:translateX(120%)}}
#auth{position:absolute;inset:0;z-index:8;background:var(--bg);display:flex;flex-direction:column;justify-content:center;padding:0 28px}
#auth .logo{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,#9a3fc0,#2a9df4);display:grid;place-items:center;font-size:40px;margin:0 auto 18px}
#auth h1{text-align:center;font-weight:500;font-size:26px;margin-bottom:4px}#auth p{text-align:center;color:var(--dim);margin-bottom:22px}
#auth .err{color:#ef4444;font-size:14px;min-height:18px;text-align:center;margin:-4px 0 6px}
#auth .sw{text-align:center;color:var(--acc);margin-top:14px}
#call{position:absolute;inset:0;z-index:7;background:linear-gradient(160deg,#241a3a,#0f0f1c);display:none;flex-direction:column;align-items:center;justify-content:space-between;color:#fff;padding:60px 0 50px}
#call.on{display:flex}
#call .av{width:150px;height:150px;font-size:60px;position:relative}
#call .av:before,#call .av:after{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px solid #ffffff55;animation:pulse2 1.8s ease-out infinite}
#call .av:after{animation-delay:.6s}
@keyframes pulse2{from{transform:scale(1);opacity:.8}to{transform:scale(1.35);opacity:0}}
#call .cn{font-size:24px;font-weight:500;margin-top:18px}#call .cs{color:#ffffffaa;margin-top:4px}
#call .acts{display:flex;gap:26px}
#call .cb{width:60px;height:60px;border-radius:50%;background:#ffffff26;display:grid;place-items:center;font-size:24px;color:#fff}
#call .cb.end{background:#e5484d}
.gfx{position:absolute;inset:0;z-index:6;display:none;place-items:center;pointer-events:none}
.gfx.on{display:grid}
.gfx .art{font-size:140px;animation:gpop .9s cubic-bezier(.2,1.8,.3,1)}
.gfx .pt{position:absolute;font-size:22px;animation:gpart 1.1s ease-out forwards}
@keyframes gpop{0%{transform:scale(.2) rotate(-20deg);opacity:0}60%{transform:scale(1.15) rotate(6deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes gpart{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
.prow{display:flex;gap:8px;padding:14px 16px;overflow-x:auto}.prow button{flex:1;min-width:64px;background:var(--card);border-radius:14px;padding:10px 6px;display:grid;justify-items:center;gap:4px;font-size:12px;color:var(--txt)}.pi{font-size:19px}
.fwdh{font-size:13px;color:var(--acc);font-weight:500;margin-bottom:2px}
.fwdbtn{cursor:pointer;opacity:.7;margin-left:6px}.fwdbtn:hover{opacity:1}
.sw input{width:38px;height:22px;accent-color:var(--acc)}
:root{--msgfs:16px}
.b{font-size:var(--msgfs)}
body.no-anim *{animation:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div id="app">
<div id="auth"></div>
<div id="call"><span id="cav"></span><div class="cn" id="ccn"></div><div class="cs" id="ccs"></div><div class="acts"><button class="cb" aria-label="Микрофон">🎤</button><button class="cb end" onclick="endCall()" aria-label="Завершить">📞</button><button class="cb" aria-label="Камера">📷</button></div></div>
<div class="gfx" id="gfx"></div>
<div class="scr on" id="s-chats"><div class="hd"><span>BelugaCord</span><span class="dots">⋮</span></div><input class="srch" id="q" placeholder="Поиск чатов" oninput="draw()"><div class="sc" id="chl"></div></div>
<div class="scr" id="s-contacts"><div class="hd"><span>Контакты</span><span class="dots">⋮</span></div><div class="sc" id="cts"></div></div>
<div class="scr" id="s-settings"><div class="hd"><span></span><span class="dots">⋮</span></div><div class="sc" id="set"></div></div>
<div class="scr" id="s-profile"><div class="hd"><span></span><span class="dots">⋮</span></div><div class="sc" id="prf"></div></div>
<div class="scr ov" id="chat"><div class="top"><button class="back" onclick="closeChat()" aria-label="Назад">←</button><div class="pill" onclick="peerGifts()"><span id="pa"></span><div><b id="pn"></b><span class="dim sm" id="ps"></span></div></div><button class="back" onclick="cur&&!cur.bot&&openCall(cur)" aria-label="Звонок">📞</button><button class="back" aria-label="Меню">⋮</button></div>
<div id="msgs"></div>
<div class="bar"><div class="in"><button aria-label="Эмодзи">☺</button><input id="txt" placeholder="Сообщение" oninput="mic()" onkeydown="if(event.key==='Enter')send()"><button onclick="recCircle()" aria-label="Видео-кружок">📹</button><button id="giftbar" onclick="openShop(cur.id)" aria-label="Подарок">🎁</button></div><button id="sb" onclick="sbTap()" onmousedown="micDown(event)" ontouchstart="micDown(event)" onmouseup="micUp()" onmouseleave="micCancel()" ontouchend="micUp()" aria-label="Отправить">🎤</button></div></div>
<div class="scr ov" id="shop"><div class="top"><button class="back" onclick="$('shop').classList.remove('on')" aria-label="Назад">←</button><div style="flex:1;font-size:22px;padding-left:6px">Купить подарок</div><span style="color:#ffc94a;padding-right:10px" id="sbal"></span></div><div class="sc" id="shg"></div></div>
<div class="scr ov" id="pg"><div class="top"><button class="back" onclick="closePg()" aria-label="Назад">←</button><div id="pgt" style="flex:1;font-size:22px;padding-left:6px"></div></div><div class="sc" id="pgb"></div></div>
<div id="nav"><button data-t="chats" class="on"><span class="e">💬</span>Чаты<span class="nb" id="nb"></span></button><button data-t="contacts"><span class="e">👤</span>Контакты</button><button data-t="settings"><span class="e">⚙️</span>Настройки</button><button data-t="profile"><span class="e">🙂</span>Профиль</button></div>
<div id="sheet" onclick="if(event.target===this)closeS()"><div id="sh"></div></div><div id="toast"></div>
</div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CAT={rocket:{e:"🚀",n:"Ракета",p:50,s:5000},champ:{e:"🍾",n:"Шампанское",p:50,s:5000},gem:{e:"💎",n:"Кристалл",p:100,s:3000},bear:{e:"🧸",n:"Белуга-мишка",p:100,s:3000},heart:{e:"💜",n:"Неон-сердце",p:150,s:2000},skull:{e:"💀",n:"Глитч-череп",p:250,s:1500},cake:{e:"🎂",n:"Торт",p:300,s:1000},crown:{e:"👑",n:"Корона",p:1500,s:200}};
const MOD={"Парящий":"float","Вертушка":"spin","Пульсар":"pulse","Глитч":"shake"},BG={"Неон":"#d946ef,#22d3ee","Закат":"#f97316,#7c3aed","Токсик":"#22c55e,#0f172a","Лёд":"#67e8f9,#1e3a8a","Кровь":"#ef4444,#2a0010"},SY=["⚡","✦","☠","◈","❖","☢"];
const COL=[["#ff885e","#ff516a"],["#ffcd6a","#ffa85c"],["#82b1ff","#665fff"],["#a0de7e","#54cb68"],["#53edd6","#28c9b7"],["#72d5fd","#2a9ef1"],["#e0a2f3","#d669ed"]];
const av=(c,s)=>{const k=COL[c.id%7];return `<span class="av" style="width:${s}px;height:${s}px;font-size:${s*.4}px;background:linear-gradient(${k[0]},${k[1]})">${esc(c.n[0])}${c.online?`<i style="position:absolute;width:${s*.26}px;height:${s*.26}px;right:-1px;bottom:-1px;background:#34c759;border:2px solid var(--bg);border-radius:50%"></i>`:""}</span>`};
const hm=t=>new Date(t).toLocaleTimeString("ru",{hour:"2-digit",minute:"2-digit"});
const TK=r=>`<svg class="tk" viewBox="0 0 16 11"><path d="M11.1.6L5.3 6.4 3.1 4.2 2 5.3l3.3 3.3 6.9-6.9z${r?"M14.1.6L8.3 6.4l-.5-.5-1.1 1.1 1.6 1.6 6.9-6.9z":""}"/></svg>`;
let bal=0,gid=1,cur=null,tab="chats",shopFor=null,now=Date.now();
const LOGO='<img src="icon-192x192.png" width="1em" height="1em" style="vertical-align:-.15em;border-radius:22%" onerror="this.replaceWith(document.createTextNode(\'😼\'))">';
const C=[{id:2,n:"Мирон",pin:1,seen:"в 05:32",online:1},{id:3,n:"Ярик",pin:1,seen:"в 11:05",online:1},{id:4,n:"Макс",pin:1,seen:"в 04:04"},{id:5,n:"Киря",pin:1,seen:"в 08:59"},{id:6,n:"Full",mute:1,seen:"недавно"},{id:7,n:"Знакомства",mute:1,seen:"недавно"},{id:8,n:"Поддержка BelugaCord",bot:"sup",seen:"недавно",online:1},{id:9,n:"BotFather",bot:"bf",seen:"недавно",online:1}];
const CH=[{id:101,un:"belugacord",title:"BELUGACORD",subs:4,owner:1,posts:[{text:"Добро пожаловать в официальный канал BelugaCord 😼",t:Date.now()-864e5}]}];
const G=[],M={};C.forEach(c=>M[c.id]=[]);
const chatId=ch=>1000+ch.id;
CH.forEach(ch=>M[chatId(ch)]=ch.posts);
const asChat=ch=>({id:chatId(ch),n:ch.title,seen:ch.subs+" подписчиков",channel:true,chRef:ch,un:ch.un});
const gift=(k,own)=>{const g={id:gid++,k,own,u:0};G.push(g);return g};
const add=(c,out,text,m,g,un)=>M[c].push({out,text,t:now-m*60000,g,r:1,unread:un});
add(2,0,"Го вечером в войс?",300,0,0);add(2,1,"Го, я в 8",295);
add(3,1,"Скинул видос",1500);add(4,0,"Глянь че прислал",90);add(4,0,"",89,gift("rocket","me"),1);
add(5,0,"хотя я её и предложил",2800);add(6,0,"ПОСМОТРЕЛ!?",10,0,5);add(7,0,"Ты в душе с Дашей, ви...",12,0,9);
const last=c=>M[c.id][M[c.id].length-1],unr=c=>M[c.id].filter(m=>m.unread).length;
function row(c){const m=last(c),u=unr(c);
  const pv=m.g?"🎁 Подарок":esc(m.text),tk=m.out?TK(m.r):"";
  return `<div class="row" onclick="openChat(${c.id})">${av(c,56)}<div class="mid"><div class="r1"><b>${esc(c.n)}${c.mute?" 🔇":""}</b><span class="t">${tk}${c.pin?'<span class="pin">📌 '+hm(m.t)+"</span>":hm(m.t)}</span></div><div class="r2"><span class="pre">${(m.out?"":"")+pv}</span>${u?`<span class="bd ${c.mute?"m":""}">${u}</span>`:""}</div></div></div>`}
function draw(){

 <div class="sw" onclick="authSwitch()">${l?"Нет аккаунта? Создать":"Уже есть аккаунт? Войти"}</div>`}
function doAuth(){const u=$("a_u").value.trim().replace(/^@/,"").toLowerCase(),p=$("a_p").value;
 if(!/^[a-z][a-z0-9_]{4,31}$/.test(u))return $("a_e").textContent="Юзернейм: латиница/цифры/_, от 5 символов";
 if(p.length<4)return $("a_e").textContent="Пароль минимум 4 символа";
 if(AUTH.pending==="reg"){
  if(U[u])return $("a_e").textContent="Этот юзернейм уже занят";
  const n=$("a_n").value.trim()||u;U[u]=1;ME.un=u;ME.name=n;ME.pass=p;
 }else{
  if(!U[u]||u!==ME.un&&u!=="sasha")return $("a_e").textContent="Такого аккаунта нет. Зарегистрируйся";
  if(ME.pass&&p!==ME.pass)return $("a_e").textContent="Неверный пароль";
  ME.un=u;
 }
 $("auth").style.display="none";draw()}
function openCall(cid,video){const c=typeof cid==="object"?cid:(C.find(x=>x.id===cid)||cur);if(!c||c.channel)return;$("call").classList.add("on");$("cav").innerHTML=av(c,150);$("ccn").textContent=c.n;$("ccs").textContent=video?"Видеозвонок…":"Вызов…";
 CALL_LOG.push({n:c.n,video:!!video,t:Date.now()});
 let t=0;const tmr=setInterval(()=>{t++;$("ccs").textContent=[0,0].map(()=>0).length?`${String(t/60|0).padStart(2,"0")}:${String(t%60).padStart(2,"0")}`:"";if(t===2)$("ccs").textContent="Соединение...";},1000);
 $("call").dataset.t=tmr;setTimeout(()=>{if($("call").classList.contains("on"))$("ccs").textContent="00:00"},1800)}
function endCall(){clearInterval(+$("call").dataset.t);$("call").classList.remove("on")}
function gfxBurst(emoji){const box=$("gfx");box.innerHTML=`<span class="art">${emoji}</span>`+Array.from({length:14},()=>{const a=Math.random()*6.28,d=120+Math.random()*90;return `<span class="pt" style="--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px;left:50%;top:50%;animation-delay:${.15+Math.random()*.2}s">${["✦","⚡","❖"][Math.random()*3|0]}</span>`}).join("");
 box.classList.add("on");setTimeout(()=>box.classList.remove("on"),1300)}
function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(e.t);e.t=setTimeout(()=>e.style.display="none",2200)}
drawAuth();
$("auth").style.display="flex";
</script></body></html>
