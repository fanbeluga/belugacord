<script>
/* ============================================================
   BELUGACORD 2.5 BETA — РАСШИРЕНИЕ #5
   КЛАНЫ + ТОРГОВЛЯ + РЕПУТАЦИЯ + ТУРНИРЫ + КАСТОМНЫЕ КОМАНДЫ + АВТО-МОД
   ============================================================ */

// ============================================================
// СИСТЕМА КЛАНОВ/ГИЛЬДИЙ
// ============================================================
const Clans = {
    list: [],
    myClan: null,

    load: () => {
        Clans.list = [
            {
                id: 1,
                name: 'Beluga Squad',
                tag: '[BLG]',
                owner: 1,
                members: [
                    { id: 1, username: '_fan_beluga_', role: 'owner', level: 11 },
                    { id: 2, username: 'Alex_Gamer', role: 'officer', level: 15 },
                    { id: 3, username: 'KittyLover', role: 'member', level: 8 }
                ],
                level: 5,
                xp: 4500,
                xpToNext: 5000,
                createdAt: '2026-09-15',
                description: 'Лучший клан в Belugacord!'
            },
            {
                id: 2,
                name: 'Code Warriors',
                tag: '[CW]',
                owner: 4,
                members: [
                    { id: 4, username: 'CodeMaster', role: 'owner', level: 22 },
                    { id: 5, username: 'DevGirl', role: 'member', level: 18 }
                ],
                level: 8,
                xp: 7200,
                xpToNext: 8000,
                createdAt: '2026-09-10',
                description: 'Кодим вместе, побеждаем вместе'
            }
        ];
    },

    create: () => {
        if (Clans.myClan) {
            Utils.toast('Ты уже в клане!', 'warning');
            return;
        }

        if ((State.me?.coins || 0) < 1000) {
            Utils.toast('Нужно 1000 🪙 для создания клана', 'error');
            return;
        }

        const name = prompt('Название клана:');
        if (!name || name.length < 3) {
            Utils.toast('Название должно быть минимум 3 символа', 'warning');
            return;
        }

        const tag = prompt('Тег клана (3-5 символов, например [BLG]):', '[' + name.substring(0, 3).toUpperCase() + ']');
        if (!tag || tag.length < 3 || tag.length > 7) {
            Utils.toast('Тег должен быть 3-7 символов', 'warning');
            return;
        }

        const description = prompt('Описание клана:', '') || '';

        if (!Economy.spendCoins(1000)) return;

        const newClan = {
            id: Date.now(),
            name,
            tag,
            owner: State.me?.id || 1,
            members: [
                { id: State.me?.id || 1, username: State.me?.username || 'Я', role: 'owner', level: State.me?.level || 1 }
            ],
            level: 1,
            xp: 0,
            xpToNext: 1000,
            createdAt: new Date().toISOString().split('T')[0],
            description
        };

        Clans.list.push(newClan);
        Clans.myClan = newClan;
        Utils.toast(`Клан "${name}" создан!`, 'success');
        Clans.render();
        ActivityLog.add('Создан клан', name);
    },

    join: (clanId) => {
        if (Clans.myClan) {
            Utils.toast('Ты уже в клане!', 'warning');
            return;
        }

        const clan = Clans.list.find(c => c.id === clanId);
        if (!clan) return;

        if (clan.members.length >= 10) {
            Utils.toast('Клан заполнен (макс. 10 участников)', 'error');
            return;
        }

        clan.members.push({
            id: State.me?.id || 1,
            username: State.me?.username || 'Я',
            role: 'member',
            level: State.me?.level || 1
        });

        Clans.myClan = clan;
        Utils.toast(`Ты вступил в клан "${clan.name}"!`, 'success');
        Clans.render();
        Quests.updateProgress('join_clan', 1);
    },

    leave: () => {
        if (!Clans.myClan) return;

        if (!confirm('Покинуть клан?')) return;

        const clan = Clans.myClan;
        clan.members = clan.members.filter(m => m.id !== State.me?.id);
        
        if (clan.owner === State.me?.id && clan.members.length > 0) {
            clan.owner = clan.members[0].id;
            clan.members[0].role = 'owner';
        }

        Clans.myClan = null;
        Utils.toast('Ты покинул клан', 'info');
        Clans.render();
    },

    kick: (memberId) => {
        if (!Clans.myClan || Clans.myClan.owner !== State.me?.id) {
            Utils.toast('Только владелец может исключать', 'error');
            return;
        }

        const member = Clans.myClan.members.find(m => m.id === memberId);
        if (!member) return;

        if (!confirm(`Исключить ${member.username} из клана?`)) return;

        Clans.myClan.members = Clans.myClan.members.filter(m => m.id !== memberId);
        Utils.toast(`${member.username} исключен из клана`, 'success');
        Clans.render();
    },

    promote: (memberId) => {
        if (!Clans.myClan || Clans.myClan.owner !== State.me?.id) {
            Utils.toast('Только владелец может повышать', 'error');
            return;
        }

        const member = Clans.myClan.members.find(m => m.id === memberId);
        if (!member) return;

        member.role = member.role === 'member' ? 'officer' : 'member';
        Utils.toast(`${member.username} теперь ${member.role === 'officer' ? 'офицер' : 'участник'}`, 'success');
        Clans.render();
    },

    addXP: (amount) => {
        if (!Clans.myClan) return;
        
        Clans.myClan.xp += amount;
        
        if (Clans.myClan.xp >= Clans.myClan.xpToNext) {
            Clans.myClan.level++;
            Clans.myClan.xp -= Clans.myClan.xpToNext;
            Clans.myClan.xpToNext = Math.floor(Clan.myClan.xpToNext * 1.5);
            Utils.toast(`🎉 Клан "${Clans.myClan.name}" достиг ${Clans.myClan.level} уровня!`, 'success');
        }
    },

    render: () => {
        const container = document.getElementById('clans-container');
        if (!container) return;

        let html = '';

        if (Clans.myClan) {
            const progress = (Clans.myClan.xp / Clans.myClan.xpToNext) * 100;
            html += `
                <div class="admin-card" style="margin-bottom: 20px;">
                    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px;">
                        <div style="font-size: 32px;"></div>
                        <div style="flex: 1;">
                            <div style="font-weight: 700; font-size: 18px;">${Clans.myClan.tag} ${Utils.esc(Clans.myClan.name)}</div>
                            <div style="font-size: 12px; color: var(--text-muted);">Уровень ${Clans.myClan.level} · ${Clans.myClan.members.length}/10 участников</div>
                        </div>
                        <button onclick="Clans.leave()" style="padding: 6px 12px; background: var(--danger); border: none; border-radius: 6px; color: white; cursor: pointer; font-size: 12px;">Покинуть</button>
                    </div>
                    <div style="background: var(--bg-primary); height: 8px; border-radius: 4px; overflow: hidden; margin-bottom: 8px;">
                        <div style="background: var(--accent); height: 100%; width: ${progress}%;"></div>
                    </div>
                    <div style="font-size: 11px; color: var(--text-muted);">XP: ${Clans.myClan.xp} / ${Clans.myClan.xpToNext}</div>
                    <div style="margin-top: 12px; font-size: 13px; color: var(--text-secondary);">${Utils.esc(Clans.myClan.description)}</div>
                </div>
                <h3 style="margin-bottom: 12px;">Участники</h3>
                ${Clans.myClan.members.map(m => `
                    <div class="admin-card" style="display: flex; align-items: center; gap: 12px; margin-bottom: 8px;">
                        <div style="width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: flex; align-items: center; justify-content: center; font-weight: 700;">${m.username.charAt(0).toUpperCase()}</div>
                        <div style="flex: 1;">
                            <div style="font-weight: 600;">${Utils.esc(m.username)} ${m.role === 'owner' ? '👑' : m.role === 'officer' ? '⭐' : ''}</div>
                            <div style="font-size: 12px; color: var(--text-muted);">Уровень ${m.level}</div>
                        </div>
                        ${Clans.myClan.owner === State.me?.id && m.id !== State.me?.id ? `
                            <button onclick="Clans.promote(${m.id})" style="padding: 6px 12px; background: var(--info); border: none; border-radius: 6px; color: white; cursor: pointer; font-size: 12px; margin-right: 4px;">${m.role === 'member' ? 'Повысить' : 'Понизить'}</button>
                            <button onclick="Clans.kick(${m.id})" style="padding: 6px 12px; background: var(--danger); border: none; border-radius: 6px; color: white; cursor: pointer; font-size: 12px;">Исключить</button>
                        ` : ''}
                    </div>
                `).join('')}
            `;
        } else {
            html += `
                <div style="text-align: center; padding: 20px; margin-bottom: 20px;">
                    <button onclick="Clans.create()" style="padding: 12px 24px; background: var(--accent); border: none; border-radius: 8px; color: white; cursor: pointer; font-weight: 700; font-size: 16px;">+ Создать клан (1000 )</button>
                </div>
                <h3 style="margin-bottom: 12px;">Доступные кланы</h3>
            `;

            Clans.list.forEach(clan => {
                html += `
                    <div class="admin-card" style="display: flex; align-items: center; gap: 12px; margin-bottom: 8px;">
                        <div style="font-size: 32px;">🏰</div>
                        <div style="flex: 1;">
                            <div style="font-weight: 700;">${clan.tag} ${Utils.esc(clan.name)}</div>
                            <div style="font-size: 12px; color: var(--text-muted);">Уровень ${clan.level} · ${clan.members.length}/10 участников</div>
                        </div>
                        <button onclick="Clans.join(${clan.id})" style="padding: 6px 12px; background: var(--success); border: none; border-radius: 6px; color: white; cursor: pointer; font-size: 12px;">Вступить</button>
                    </div>
                `;
            });
        }

        container.innerHTML = html;
    }
};

// ============================================================
// ТОРГОВАЯ ПЛОЩАДКА (АУКЦИОН)
// ============================================================
const Marketplace = {
    listings: [],

    load: () => {
        Marketplace.listings = [
            { id: 1, item: 'Золотая рамка', emoji: '👑', price: 800, seller: 'Alex_Gamer', time: new Date().toISOString() },
            { id: 2, item: 'Огненная рамка', emoji: '🔥', price: 1200, seller: 'CodeMaster', time: new Date(Date.now() - 3600000).toISOString() }
        ];
    },

    sell: (itemId) => {
        const item = Inventory.items.find(i => i.id === itemId);
        if (!item) return;

        const price = prompt(`За сколько продать "${item.name}"? (твоя цена):`, '500');
        if (!price || parseInt(price) < 10) {
            Utils.toast('Минимальная цена 10 🪙', 'warning');
            return;
        }

        Inventory.items = Inventory.items.filter(i => i.id !== itemId);
        
        Marketplace.listings.push({
            id: Date.now(),
            item: item.name,
            emoji: item.emoji,
            price: parseInt(price),
            seller: State.me?.username || 'Аноним',
            time: new Date().toISOString()
        });

        Utils.toast(`"${item.name}" выставлен на продажу за ${price} 🪙`, 'success');
        Marketplace.render();
        Inventory.render();
    },

    buy: (listingId) => {
        const listing = Marketplace.listings.find(l => l.id === listingId);
        if (!listing) return;

        if (listing.seller === State.me?.username) {
            Utils.toast('Нельзя купить свой предмет', 'warning');
            return;
        }

        if (!Economy.spendCoins(listing.price)) return;

        Inventory.items.push({
            id: Date.now(),
            name: listing.item,
            emoji: listing.emoji,
            type: 'item',
            rarity: 'rare',
            boughtAt: new Date().toISOString()
        });

        Marketplace.listings = Marketplace.listings.filter(l => l.id !== listingId);
        Utils.toast(`Куплено: ${listing.emoji} ${listing.item}!`, 'success');
        Marketplace.render();
        Inventory.render();
        Quests.updateProgress('buy_items', 1);
    },

    remove: (listingId) => {
        const listing = Marketplace.listings.find(l => l.id === listingId);
        if (!listing || listing.seller !== State.me?.username) {
            Utils.toast('Можно удалить только свои лоты', 'error');
            return;
        }

        Marketplace.listings = Marketplace.listings.filter(l => l.id !== listingId);
        Utils.toast('Лот удален', 'info');
        Marketplace.render();
    },

    render: () => {
        const container = document.getElementById('marketplace-container');
        if (!container) return;

        if (Marketplace.listings.length === 0) {
            container.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 20px;">Нет лотов на продаже</div>';
            return;
        }

        container.innerHTML = `
            <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px;">
                ${Marketplace.listings.map(l => `
                    <div class="admin-card" style="text-align: center;">
                        <div style="font-size: 48px; margin-bottom: 8px;">${l.emoji}</div>
                        <div style="font-weight: 700; margin-bottom: 4px;">${Utils.esc(l.item)}</div>
                        <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 12px;">Продавец: ${Utils.esc(l.seller)}</div>
                        <div style="font-size: 18px; font-weight: 700; color: var(--accent); margin-bottom: 12px;">${l.price} 🪙</div>
                        <button onclick="Marketplace.buy(${l.id})" style="width: 100%; padding: 8px; background: var(--success); border: none; border-radius: 6px; color: white; cursor: pointer; font-weight: 600; margin-bottom: 4px;">Купить</button>
                        ${l.seller === State.me?.username ? `<button onclick="Marketplace.remove(${l.id})" style="width: 100%; padding: 8px; background: var(--danger); border: none; border-radius: 6px; color: white; cursor: pointer; font-size: 12px;">Удалить</button>` : ''}
                    </div>
                `).join('')}
            </div>
        `;
    }
};

// ============================================================
// СИСТЕМА РЕПУТАЦИИ/КАРМЫ
// ============================================================
const Reputation = {
    scores: {},

    load: () => {
        Reputation.scores = {
            1: 150,  // _fan_beluga_
            2: 85,   // Alex_Gamer
            3: 42,   // KittyLover
            4: 200   // CodeMaster
        };
    },

    give: (userId, amount) => {
        if (!Reputation.scores[userId]) {
            Reputation.scores[userId] = 0;
        }

        Reputation.scores[userId] += amount;
        
        const user = Friends.list.find(f => f.id === userId);
        const username = user ? user.username : 'Пользователь';
        
        if (amount > 0) {
            Utils.toast(`+${amount} репутации для ${username}`, 'success');
        } else {
            Utils.toast(`${amount} репутации для ${username}`, 'warning');
        }

        Quests.updateProgress('give_rep', 1);
    },

    getLevel: (score) => {
        if (score >= 1000) return { name: 'Легенда', emoji: '', color: '#f59e0b' };
        if (score >= 500) return { name: 'Мастер', emoji: '💎', color: '#3b82f6' };
        if (score >= 100) return { name: 'Опытный', emoji: '⭐', color: '#22c55e' };
        if (score >= 0) return { name: 'Новичок', emoji: '🌱', color: '#94a3b8' };
        return { name: 'Токсик', emoji: '💀', color: '#ef4444' };
    },

    render: (userId) => {
        const score = Reputation.scores[userId] || 0;
        const level = Reputation.getLevel(score);
        
        return `
            <div style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; background: ${level.color}20; border: 1px solid ${level.color}; border-radius: 12px; font-size: 12px;">
                <span>${level.emoji}</span>
                <span style="color: ${level.color}; font-weight: 600;">${level.name}</span>
                <span style="color: var(--text-muted);">${score}</span>
            </div>
        `;
    }
};

// ============================================================
// ТУРНИРЫ
// ============================================================
const Tournaments = {
    active: [],
    history: [],

    create: (game, entryFee, prize) => {
        const tournament = {
            id: Date.now(),
            game,
            entryFee,
            prize,
            participants: [],
            status: 'registration',
            createdAt: new Date().toISOString(),
            startedAt: null,
            winner: null
        };

        Tournaments.active.push(tournament);
        Utils.toast(`Турнир "${game}" создан! Взнос: ${entryFee} 🪙, Приз: ${prize} 🪙`, 'success');
        Tournaments.render();
    },

    join: (tournamentId) => {
        const tournament = Tournaments.active.find(t => t.id === tournamentId);
        if (!tournament) return;

        if (tournament.participants.some(p => p.id === State.me?.id)) {
            Utils.toast('Ты уже участвуешь', 'warning');
            return;
        }

        if (tournament.participants.length >= 8) {
            Utils.toast('Турнир заполнен (макс. 8 участников)', 'error');
            return;
        }

        if (!Economy.spendCoins(tournament.entryFee)) return;

        tournament.participants.push({
            id: State.me?.id || 1,
            username: State.me?.username || 'Я',
            score: 0
        });

        Utils.toast(`Ты записан на турнир "${tournament.game}"!`, 'success');
        Tournaments.render();

        if (tournament.participants.length >= 4) {
            Tournaments.start(tournamentId);
        }
    },

    start: (tournamentId) => {
        const tournament = Tournaments.active.find(t => t.id === tournamentId);
        if (!tournament) return;

        tournament.status = 'active';
        tournament.startedAt = new Date().toISOString();
        Utils.toast(`Турнир "${tournament.game}" начался!`, 'info');
        Tournaments.render();
    },

    finish: (tournamentId, winnerId) => {
        const tournament = Tournaments.active.find(t => t.id === tournamentId);
        if (!tournament) return;

        const winner = tournament.participants.find(p => p.id === winnerId);
        if (!winner) return;

        tournament.status = 'finished';
        tournament.winner = winner;

        // Награда победителю
        if (winnerId === State.me?.id) {
            Economy.addCoins(tournament.prize);
            Utils.toast(`🏆 Ты победил в турнире "${tournament.game}" и получил ${tournament.prize} 🪙!`, 'success');
        } else {
            Utils.toast(`Турнир завершен! Победитель: ${winner.username}`, 'info');
        }

        Tournaments.history.unshift(tournament);
        Tournaments.active = Tournaments.active.filter(t => t.id !== tournamentId);
        Tournaments.render();
        Quests.updateProgress('win_tournament', winnerId === State.me?.id ? 1 : 0);
    },

    render: () => {
        const container = document.getElementById('tournaments-container');
        if (!container) return;

        let html = '';

        if (Tournaments.active.length > 0) {
            html += '<h3 style="margin-bottom: 12px;">Активные турниры</h3>';
            Tournaments.active.forEach(t => {
                const statusColors = { registration: 'var(--info)', active: 'var(--success)', finished: 'var(--text-muted)' };
                const statusText = { registration: 'Регистрация', active: 'Идет игра', finished: 'Завершен' };
                
                html += `
                    <div class="admin-card" style="margin-bottom: 12px;">
                        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px;">
                            <div style="font-size: 32px;"></div>
                            <div style="flex: 1;">
                                <div style="font-weight: 700; font-size: 16px;">${Utils.esc(t.game)}</div>
                                <div style="font-size: 12px; color: var(--text-muted);">${t.participants.length}/8 участников</div>
                            </div>
                            <div style="padding: 4px 10px; background: ${statusColors[t.status]}20; border: 1px solid ${statusColors[t.status]}; border-radius: 12px; font-size: 11px; color: ${statusColors[t.status]}; font-weight: 600;">
                                ${statusText[t.status]}
                            </div>
                        </div>
                        <div style="display: flex; gap: 16px; margin-bottom: 12px; font-size: 13px;">
                            <div>Взнос: <b style="color: var(--warning);">${t.entryFee} 🪙</b></div>
                            <div>Приз: <b style="color: var(--success);">${t.prize} 🪙</b></div>
                        </div>
                        ${t.status === 'registration' ? `
                            <button onclick="Tournaments.join(${t.id})" style="width: 100%; padding: 10px; background: var(--accent); border: none; border-radius: 6px; color: white; cursor: pointer; font-weight: 600;">Участвовать</button>
                        ` : t.status === 'active' ? `
                            <div style="text-align: center; color: var(--text-muted); font-size: 13px;">Турнир идет...</div>
                        ` : ''}
                    </div>
                `;
            });
        }

        if (Tournaments.history.length > 0) {
            html += '<h3 style="margin: 20px 0 12px;">Завершенные турниры</h3>';
            Tournaments.history.slice(0, 5).forEach(t => {
                html += `
                    <div class="admin-card" style="margin-bottom: 8px; opacity: 0.7;">
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <div style="font-size: 24px;">🏆</div>
                            <div style="flex: 1;">
                                <div style="font-weight: 600;">${Utils.esc(t.game)}</div>
                                <div style="font-size: 12px; color: var(--success);">Победитель: ${Utils.esc(t.winner?.username || 'Неизвестно')}</div>
                            </div>
                            <div style="font-size: 12px; color: var(--text-muted);">${Utils.timeAgo(t.startedAt)}</div>
                        </div>
                    </div>
                `;
            });
        }

        if (Tournaments.active.length === 0 && Tournaments.history.length === 0) {

// ============================================================
const AutoMod = {
    enabled: true,
    filters: {
        spam: true,
        caps: true,
        links: false,
        badWords: true
    },
    badWords: ['спам', 'реклама', 'казино'],
    violations: {},

    check: (userId, text) => {
        if (!AutoMod.enabled) return { allowed: true };

        const violations = [];

        // Проверка спама (одинаковые сообщения)
        if (AutoMod.filters.spam) {
            const recentMessages = State.recentMessages || [];
            const sameMessages = recentMessages.filter(m => m.text === text && m.userId === userId);
            if (sameMessages.length >= 3) {
                violations.push('spam');
            }
        }

        // Проверка КАПСА
        if (AutoMod.filters.caps && text.length > 10) {
            const capsCount = text.replace(/[^A-ZА-Я]/g, '').length;
            if (capsCount / text.length > 0.7) {
                violations.push('caps');
            }
        }

        // Проверка ссылок
        if (AutoMod.filters.links && /https?:\/\//.test(text)) {
            violations.push('links');
        }

        // Проверка плохих слов
        if (AutoMod.filters.badWords) {
            const lowerText = text.toLowerCase();
            if (AutoMod.badWords.some(word => lowerText.includes(word))) {
                violations.push('badWords');
            }
        }

        if (violations.length > 0) {
            AutoMod.violations[userId] = (AutoMod.violations[userId] || 0) + 1;
            
            if (AutoMod.violations[userId] >= 3) {
                return { allowed: false, reason: 'Множественные нарушения', action: 'mute' };
            }

            return { allowed: false, reason: `Нарушение: ${violations.join(', ')}`, action: 'delete' };
        }

        return { allowed: true };
    },

    toggle: () => {
        AutoMod.enabled = !AutoMod.enabled;
        Utils.toast(`Авто-модерация ${AutoMod.enabled ? 'включена' : 'выключена'}`, 'info');
    },

    toggleFilter: (filter) => {
        AutoMod.filters[filter] = !AutoMod.filters[filter];
        Utils.toast(`Фильтр "${filter}" ${AutoMod.filters[filter] ? 'включен' : 'выключен'}`, 'info');
    },

    addBadWord: () => {
        const word = prompt('Добавить плохое слово:');
        if (word && word.length > 0) {
            AutoMod.badWords.push(word.toLowerCase());
            Utils.toast(`Слово "${word}" добавлено в черный список`, 'success');
        }
    },

    removeBadWord: (word) => {
        AutoMod.badWords = AutoMod.badWords.filter(w => w !== word);
        Utils.toast(`Слово "${word}" удалено из черного списка`, 'info');
    },

    render: () => {
        const container = document.getElementById('automod-container');
        if (!container) return;

        container.innerHTML = `
            <div class="admin-card" style="margin-bottom: 12px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <h3>Авто-модерация</h3>
                    <button onclick="AutoMod.toggle()" style="padding: 6px 12px; background: ${AutoMod.enabled ? 'var(--success)' : 'var(--danger)'}; border: none; border-radius: 6px; color: white; cursor: pointer; font-size: 12px; font-weight: 600;">
                        ${AutoMod.enabled ? 'Включена' : 'Выключена'}
                    </button>
                </div>
                <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;">
                    ${Object.keys(AutoMod.filters).map(filter => `
                        <button onclick="AutoMod.toggleFilter('${filter}')" style="padding: 8px; background: ${AutoMod.filters[filter] ? 'var(--accent)' : 'var(--bg-tertiary)'}; border: 1px solid var(--border); border-radius: 6px; color: white; cursor: pointer; font-size: 12px;">
                            ${filter === 'spam' ? '🚫 Анти-спам' : filter === 'caps' ? '🔤 Анти-капс' : filter === 'links' ? '🔗 Анти-ссылки' : '⛔ Плохие слова'}
                        </button>
                    `).join('')}
                </div>
            </div>
            <div class="admin-card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <h3>Черный список слов</h3>
                    <button onclick="AutoMod.addBadWord()" style="padding: 6px 12px; background: var(--accent); border: none; border-radius: 6px; color: white; cursor: pointer; font-size: 12px;">+ Добавить</button>
                </div>
                <div style="display: flex; flex-wrap: wrap; gap: 6px;">
                    ${AutoMod.badWords.map(word => `
                        <span style="padding: 4px 10px; background: var(--danger); border-radius: 12px; font-size: 12px; color: white; cursor: pointer;" onclick="AutoMod.removeBadWord('${word}')">
                            ${word} ✕
                        </span>
                    `).join('')}
                </div>
            </div>
        `;
    }
};

                Utils.toast('Ты замьючен за множественные нарушения!', 'error');
            }
            input.value = '';
            return;
        }

        // Сохраняем для проверки спама
        if (!State.recentMessages) State.recentMessages = [];
        State.recentMessages.push({ userId: State.me?.id || 1, text, time: Date.now() });
        State.recentMessages = State.recentMessages.filter(m => Date.now() - m.time < 60000);
    }

    OriginalChatHandleInput(e);
};

        Pets.render();
        Achievements.update('buy_pet', 1);
    },

    feed: () => {
        if (!Pets.active) return;
        
        if (Pets.active.hunger >= 100) {
            Utils.toast('Питомец не голоден', 'info');
            return;
        }

        Pets.active.hunger = Math.min(100, Pets.active.hunger + 20);
        Pets.active.happiness = Math.min(100, Pets.active.happiness + 5);
        Pets.active.xp += 10;
        
        Pets.checkLevelUp();
        Pets.save();
        Utils.toast(`${Pets.active.emoji} накормлен!`, 'success');
        Pets.render();
    },

    play: () => {
        if (!Pets.active) return;
        
        if (Pets.active.hunger < 20) {
            Utils.toast('Питомец слишком голоден для игр', 'warning');
            return;
        }

        Pets.active.happiness = Math.min(100, Pets.active.happiness + 20);
        Pets.active.hunger = Math.max(0, Pets.active.hunger - 10);
        Pets.active.xp += 15;
        
        Pets.checkLevelUp();
        Pets.save();
        Utils.toast(`${Pets.active.emoji} поиграл!`, 'success');
        Pets.render();
    },

    checkLevelUp: () => {
        if (!Pets.active) return;
        
        const xpNeeded = Pets.active.level * 100;
        if (Pets.active.xp >= xpNeeded) {
            Pets.active.level++;
            Pets.active.xp -= xpNeeded;
            Utils.toast(`🎉 Питомец достиг уровня ${Pets.active.level}!`, 'success');
        }

    setActive: (petId) => {
        Pets.owned.forEach(p => p.active = (p.id === petId));
        Pets.active = Pets.owned.find(p => p.id === petId);
        Pets.save();
        Utils.toast('Питомец активирован', 'success');
        Pets.render();

const KickVote = {
    active: null,

    start: (userId, username) => {
        if (KickVote.active) {
            Utils.toast('Голосование уже идет', 'warning');
            return;
        }

        KickVote.active = {
            targetId: userId,
            targetName: username,
            votesFor: 1,
            votesAgainst: 0,
            voters: [State.me?.id || 1],
            startedAt: Date.now(),
            duration: 60000 // 1 минута
        };

        Utils.toast(`Голосование за кик ${username} начато!`, 'info');
        KickVote.render();

        setTimeout(() => {
            KickVote.finish();
        }, KickVote.active.duration);
    },

    vote: (voteFor) => {
        if (!KickVote.active) return;
        
        const userId = State.me?.id || 1;
        if (KickVote.active.voters.includes(userId)) {
            Utils.toast('Ты уже голосовал', 'warning');
            return;
        }

        if (voteFor) {
            KickVote.active.votesFor++;
        } else {
            KickVote.active.votesAgainst++;
        }
        KickVote.active.voters.push(userId);
        
        KickVote.render();
    },

    finish: () => {
        if (!KickVote.active) return;

        const { votesFor, votesAgainst, targetName } = KickVote.active;
        
        if (votesFor > votesAgainst) {
            Utils.toast(`${targetName} кикнут по результатам голосования!`, 'success');
            // Тут будет реальный кик
        } else {
            Utils.toast(`Голосование провалено. ${targetName} остается.`, 'info');
        }

        KickVote.active = null;
        KickVote.render();
    },

    render: () => {
        const container = document.getElementById('kickvote-container');
        if (!container) return;

        if (!KickVote.active) {
            container.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 20px;">Нет активных голосований</div>';
            return;
        }

        const timeLeft = Math.max(0, Math.floor((KickVote.active.duration - (Date.now() - KickVote.active.startedAt)) / 1000));
        const totalVotes = KickVote.active.votesFor + KickVote.active.votesAgainst;
        const percentFor = totalVotes > 0 ? (KickVote.active.votesFor / totalVotes) * 100 : 50;

        container.innerHTML = `
            <div class="admin-card">
                <div style="text-align: center; margin-bottom: 16px;">
                    <div style="font-size: 18px; font-weight: 700; margin-bottom: 8px;">Голосование за кик</div>
                    <div style="font-size: 24px; color: var(--accent);">${KickVote.active.targetName}</div>
                    <div style="font-size: 14px; color: var(--text-muted); margin-top: 8px;">Осталось: ${timeLeft}с</div>
                </div>
                <div style="margin-bottom: 16px;">
                    <div style="display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px;">
                        <span style="color: var(--success);">За: ${KickVote.active.votesFor}</span>
                        <span style="color: var(--danger);">Против: ${KickVote.active.votesAgainst}</span>
                    </div>
                    <div style="background: var(--bg-primary); height: 12px; border-radius: 6px; overflow: hidden; display: flex;">
                        <div style="background: var(--success); width: ${percentFor}%;"></div>
                        <div style="background: var(--danger); width: ${100 - percentFor}%;"></div>
                    </div>
                </div>
                <div style="display: flex; gap: 8px;">
                    <button onclick="KickVote.vote(true)" style="flex: 1; padding: 10px; background: var(--success); border: none; border-radius: 6px; color: white; cursor: pointer; font-weight: 600;">За кик</button>
                    <button onclick="KickVote.vote(false)" style="flex: 1; padding: 10px; background: var(--danger); border: none; border-radius: 6px; color: white; cursor: pointer; font-weight: 600;">Против</button>
                </div>
            </div>
        `;
    }
};

const PrivateRooms = {
    owned: [],

    create: () => {
        if ((State.me?.coins || 0) < 500) {
            Utils.toast('Нужно 500 🪙 для создания комнаты', 'error');
            return;
        }

        const name = prompt('Название комнаты:');
        if (!name) return;

        if (!Economy.spendCoins(500)) return;

        const room = {
            id: Date.now(),
            name,
            owner: State.me?.id || 1,
            members: [State.me?.id || 1],
            maxMembers: 10,
            createdAt: new Date().toISOString()
        };

        PrivateRooms.owned.push(room);
        Utils.toast(`Комната "${name}" создана!`, 'success');
        PrivateRooms.render();
    },

    invite: (roomId, userId) => {
        const room = PrivateRooms.owned.find(r => r.id === roomId);
        if (!room || room.owner !== State.me?.id) return;

        if (room.members.length >= room.maxMembers) {
            Utils.toast('Комната заполнена', 'error');
            return;
        }

        room.members.push(userId);
        Utils.toast('Пользователь приглашен', 'success');
    },

    render: () => {
        const container = document.getElementById('rooms-container');
        if (!container) return;

        if (PrivateRooms.owned.length === 0) {
            container.innerHTML = `
                <div style="text-align: center; padding: 20px;">
                    <button onclick="PrivateRooms.create()" style="padding: 12px 24px; background: var(--accent); border: none; border-radius: 8px; color: white; cursor: pointer; font-weight: 700;">+ Создать комнату (500 )</button>

        container.innerHTML = PrivateRooms.owned.map(r => `

                    <div style="font-size: 32px;">🚪</div>

const ModLogs = {
    entries: [],

    add: (action, target, moderator, reason) => {
        const entry = {
            id: Date.now(),
            action,
            target,
            moderator,
            reason,
            time: new Date().toISOString()
        };

        ModLogs.entries.unshift(entry);
        if (ModLogs.entries.length > 100) {
            ModLogs.entries.pop();
        }

        localStorage.setItem('beluga_modlogs', JSON.stringify(ModLogs.entries));
    },

    load: () => {
        const saved = localStorage.getItem('beluga_modlogs');
        if (saved) {
            ModLogs.entries = JSON.parse(saved);
        }
    },

    render: () => {
        const container = document.getElementById('modlogs-container');
        if (!container) return;

        if (ModLogs.entries.length === 0) {
            container.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 20px;">Нет записей в логах</div>';
            return;
        }

        container.innerHTML = ModLogs.entries.map(e => `
            <div class="admin-card" style="display: flex; align-items: center; gap: 12px;">
                <div style="font-size: 20px;">${e.action === 'ban' ? '🔨' : e.action === 'mute' ? '' : e.action === 'kick' ? '' : '📝'}</div>
                <div style="flex: 1;">
                    <div style="font-weight: 600; font-size: 14px;">${e.action.toUpperCase()}: ${Utils.esc(e.target)}</div>
                    <div style="font-size: 12px; color: var(--text-muted);">Модератор: ${Utils.esc(e.moderator)} · Причина: ${Utils.esc(e.reason)}</div>
                </div>
                <div style="font-size: 11px; color: var(--text-muted);">${Utils.timeAgo(e.time)}</div>
            </div>
        `).join('');
    }
};

// ============================================================
const Security = {
    // Очистка ввода от XSS (дополнительная защита)
    sanitize: (str) => {
        if (!str) return '';
        return str.replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    },

    // Rate Limiter (защита от спама запросами)
    rateLimits: {},
    checkRateLimit: (action, maxRequests = 5, windowMs = 10000) => {
        const now = Date.now();
        if (!Security.rateLimits[action]) {
            Security.rateLimits[action] = [];
        }

        // Удаляем старые запросы
        Security.rateLimits[action] = Security.rateLimits[action].filter(time => now - time < windowMs);

        if (Security.rateLimits[action].length >= maxRequests) {
            Utils.toast(`Слишком много запросов! Подожди ${Math.ceil((windowMs - (now - Security.rateLimits[action][0])) / 1000)}с`, 'error');
            return false;
        }

        Security.rateLimits[action].push(now);
        return true;
    },

    // Валидация токена
    validateToken: (token) => {
        if (!token || token.length < 20) return false;
        // Здесь можно добавить проверку JWT или сигнатуры
        return true;
    },

    // Инициализация защиты
    init: () => {
        // Перехватываем все fetch запросы для добавления токена и проверки
        const originalFetch = window.fetch;
        window.fetch = async function(url, options = {}) {
            // Добавляем токен в заголовки если он есть
            if (State.token && !url.includes('token=')) {
                const separator = url.includes('?') ? '&' : '?';
                url = `${url}${separator}token=${encodeURIComponent(State.token)}`;
            }
            
            // Проверяем rate limit для POST запросов
            if (options.method === 'POST') {
                if (!Security.checkRateLimit(url, 10, 5000)) {
                    return Promise.reject(new Error('Rate limit exceeded'));
                }
            }

            return originalFetch.apply(this, arguments);
        };
        
        console.log('%c🛡️ Security Module Initialized', 'color: #ef4444; font-weight: bold;');
    }
};

                    document.getElementById('chat-input').blur();
                }
            }

            // Ctrl+N — Новое сообщение (фокус на инпут)
            if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
                e.preventDefault();
                const input = document.getElementById('chat-input');
                if (input) input.focus();
            }

            // Ctrl+B — Жирный текст (если инпут активен)
            if ((e.ctrlKey || e.metaKey) && e.key === 'b') {
                const input = document.getElementById('chat-input');
                if (document.activeElement === input) {
                    e.preventDefault();
                    const start = input.selectionStart;
                    const end = input.selectionEnd;
                    const text = input.value;
                    input.value = text.substring(0, start) + '**' + text.substring(start, end) + '**' + text.substring(end);
                    input.focus();
                    input.setSelectionRange(start + 2, end + 2);
                }
            }
        });

        let startX, startY;
        let currentPos = type === 'banner' ? (State.me.banner_pos || '50% 50%') : (State.me.avatar_pos || '50% 50%');
        let [posX, posY] = currentPos.split(' ').map(p => parseFloat(p));

        element.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            element.style.cursor = 'grabbing';
            e.preventDefault();
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            
            const deltaX = e.clientX - startX;
            const deltaY = e.clientY - startY;
            
            posX = Math.max(0, Math.min(100, posX + deltaX / 2));
            posY = Math.max(0, Math.min(100, posY + deltaY / 2));
            
            const img = element.querySelector('img');
            if (img) {
                img.style.objectPosition = `${posX}% ${posY}%`;
            }
            
            startX = e.clientX;
            startY = e.clientY;
        });

        document.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                element.style.cursor = 'move';
                
                const newPos = `${Math.round(posX)}% ${Math.round(posY)}%`;
                if (type === 'banner') {
                    State.me.banner_pos = newPos;

        if (!url.match(/\.(jpg|jpeg|png|gif|webp)$/i)) {
            Utils.toast('Неподдерживаемый формат. Используй JPG, PNG или GIF', 'error');
            return;
        }

        State.me.banner = url;
        Utils.toast('Баннер обновлён!', 'success');
        ProfileFull.render();
        // Utils.api('/api/profile/banner', 'POST', { url });
    },

    toggleGifAvatar: () => {
        if (State.me.gif_avatar) {
            State.me.avatar = State.me.gif_avatar;
            State.me.gif_avatar = null;
            Utils.toast('GIF аватарка отключена', 'info');
        } else {
            const gifUrl = prompt('Введи URL GIF-аватарки:');
            if (gifUrl && gifUrl.endsWith('.gif')) {
                State.me.gif_avatar = gifUrl;
                Utils.toast('GIF аватарка установлена!', 'success');
            }
        }
        ProfileFull.render();
    },

    toggleGifBanner: () => {
        if (State.me.gif_banner) {
            State.me.banner = State.me.gif_banner;
            State.me.gif_banner = null;
            Utils.toast('GIF баннер отключён', 'info');
        } else {
            const gifUrl = prompt('Введи URL GIF-баннера:');
            if (gifUrl && gifUrl.endsWith('.gif')) {
                State.me.gif_banner = gifUrl;
                Utils.toast('GIF баннер установлен!', 'success');
            }
        }
        ProfileFull.render();
    },

    editBio: () => {
        const bio = prompt('О себе (до 256 символов):', State.me.bio || '');
        if (bio !== null) {
            if (bio.length > 256) {
                Utils.toast('Био должно быть до 256 символов', 'warning');
                return;
            }
            State.me.bio = bio;
            Utils.toast('Био обновлено!', 'success');
            ProfileFull.render();
        }
    },

    changeNicknameColor: () => {
        const color = prompt('Введи цвет ника (например, #ff0000, red, rgb(255,0,0)):', State.me.nickname_color || '');
        if (color !== null) {
            State.me.nickname_color = color || null;
            Utils.toast('Цвет ника изменён!', 'success');
            ProfileFull.render();
        }
    },

    changeStatus: () => {
        const status = prompt('Кастомный статус (до 128 символов):', State.me.custom_status || '');
        if (status !== null) {
            if (status.length > 128) {
                Utils.toast('Статус должен быть до 128 символов', 'warning');
                return;
            }
            State.me.custom_status = status || null;
            Utils.toast('Статус обновлён!', 'success');
            ProfileFull.render();
        }
    }
};

// Обновляем шаблон профиля
Templates.profile = {
    icon: '👤', title: 'Профиль',
    body: `<div id="profile-content" style="padding: 0;"></div>`,
    onInit: () => {
        ProfileFull.render();
    }
};

console.log('%c✓ Extension #7.5 loaded: Full Profile + Banners + Drag&Drop + GIF Support', 'color: #ec4899; font-weight: bold;');

<script>
/* === ЗВОНКИ (CALLS) === */
const Calls = {
    activeCall: null,
    
    init: () => {
        // Добавляем иконку звонка в панель задач (как Skype)
        const tray = document.getElementById('tray');
        if (tray) {
            const callBtn = document.createElement('div');
            callBtn.id = 'call-taskbar-btn';
            callBtn.style.cssText = 'cursor:pointer; font-size:16px; padding:4px;';
            callBtn.innerHTML = '📞';
            callBtn.title = 'Позвонить';
            callBtn.onclick = () => Calls.openDialer();
            tray.insertBefore(callBtn, tray.firstChild);
        }
    },

    openDialer: () => {
        const username = prompt('Введи никнейм пользователя для звонка:');
        if (!username) return;
        Calls.startCall(username, 'outgoing');
    },

    startCall: (username, type) => {
        Calls.activeCall = { username, type, startTime: Date.now() };
        
        const isMobile = window.innerWidth < 768;
        const icon = isMobile ? '📱' : '📹'; // Телефон на мобилке, Скайп/Видео на ПК
        
        const callScreen = document.createElement('div');
        callScreen.id = 'active-call-screen';
        callScreen.style.cssText = `
            position: fixed; inset: 0; z-index: 9999;
            background: linear-gradient(135deg, #1a1a2e, #0a0a12);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        `;
        callScreen.innerHTML = `
            <div style="font-size: 80px; margin-bottom: 20px; animation: pulse 1.5s infinite;">${icon}</div>
            <div style="font-size: 24px; font-weight: 700; margin-bottom: 10px;">${Utils.esc(username)}</div>
            <div style="color: var(--text-muted); margin-bottom: 40px;" id="call-timer">${type === 'outgoing' ? 'Вызов...' : 'Входящий звонок...'}</div>
            <div style="display: flex; gap: 20px;">
                <button onclick="Calls.toggleMute()" style="width: 60px; height: 60px; border-radius: 50%; border: none; background: var(--bg-tertiary); color: white; font-size: 24px; cursor: pointer;">🎤</button>
                <button onclick="Calls.endCall()" style="width: 60px; height: 60px; border-radius: 50%; border: none; background: var(--danger); color: white; font-size: 24px; cursor: pointer;">📞</button>
            </div>
        `;
        document.body.appendChild(callScreen);

        // Имитация таймера
        Calls.timerInterval = setInterval(() => {
            if (Calls.activeCall.type === 'outgoing') {
                const sec = Math.floor((Date.now() - Calls.activeCall.startTime) / 1000);
                document.getElementById('call-timer').textContent = `${Math.floor(sec/60)}:${(sec%60).toString().padStart(2,'0')}`;
            }
        }, 1000);
    },

    toggleMute: () => Utils.toast('Микрофон переключен', 'info'),
    
    endCall: () => {
        clearInterval(Calls.timerInterval);
        const screen = document.getElementById('active-call-screen');
        if (screen) screen.remove();
        Calls.activeCall = null;
        Utils.toast('Звонок завершен', 'info');
    }
};
window.addEventListener('load', Calls.init);
</script>
<script>
/* === EMAIL ВЕРИФИКАЦИЯ 2.0 === */
const EmailVerify = {
    timer: 60,
    timerInterval: null,

    init: () => {
        const inputs = document.querySelectorAll('.verify-digit');
        if (!inputs.length) return;

        inputs.forEach((inp, i) => {
            inp.addEventListener('input', (e) => {
                if (e.target.value && i < inputs.length - 1) inputs[i+1].focus();
            });
            inp.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && i > 0) inputs[i-1].focus();
            });
        });
        EmailVerify.startTimer();
    },

    startTimer: () => {
        EmailVerify.timer = 60;
        const timerEl = document.getElementById('resend-timer');
        const link = timerEl?.parentElement;
        if (link) link.style.pointerEvents = 'none';
        
        clearInterval(EmailVerify.timerInterval);
        EmailVerify.timerInterval = setInterval(() => {
            EmailVerify.timer--;
            if (timerEl) timerEl.textContent = EmailVerify.timer;
            if (EmailVerify.timer <= 0) {
                clearInterval(EmailVerify.timerInterval);
                if (timerEl) timerEl.textContent = '0';
                if (link) {
                    link.style.pointerEvents = 'auto';
                    link.style.color = 'var(--accent)';
                }
            }
        }, 1000);
    },

    resend: () => {
        if (EmailVerify.timer > 0) return;
        Utils.toast('Код отправлен повторно!', 'success');
        EmailVerify.startTimer();
        // Utils.api('/api/auth/resend_code', 'POST', { username: Auth.pendingReg.u });
    }
};
// Привязываем к твоей кнопке "Отправить снова"
document.addEventListener('click', (e) => {
    if (e.target.textContent.includes('Отправить снова')) {
        e.preventDefault();
        EmailVerify.resend();
    }
});
window.addEventListener('load', EmailVerify.init);
</script>
<script>
/* === ПРОФИЛЬ DRAG & DROP + GIF === */
const ProfileDrag = {
    apply: () => {
        // Находим окно профиля, если оно открыто
        const profileWin = document.getElementById('win-profile');
        if (!profileWin) return;

        const banner = profileWin.querySelector('.profile-banner');
        if (banner) {
            let isDragging = false;
            let startX, startY, currentX = 50, currentY = 50;

            banner.addEventListener('mousedown', (e) => {
                isDragging = true;
                startX = e.clientX; startY = e.clientY;
                banner.style.cursor = 'grabbing';
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                currentX += (e.clientX - startX) / 2;
                currentY += (e.clientY - startY) / 2;
                currentX = Math.max(0, Math.min(100, currentX));
                currentY = Math.max(0, Math.min(100, currentY));
                
                const img = banner.querySelector('img');
                if (img) img.style.objectPosition = `${currentX}% ${currentY}%`;
                
                startX = e.clientX; startY = e.clientY;
            });

            document.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    banner.style.cursor = 'grab';
                    Utils.toast(`Позиция баннера сохранена: ${Math.round(currentX)}% ${Math.round(currentY)}%`, 'success');
                }
            });
            
            banner.style.cursor = 'grab';
            banner.title = 'Перетащи, чтобы настроить позицию';
        }
    }
};

// Запускаем, когда открывается окно профиля
const OriginalOpenWindow = WindowManager.open;
WindowManager.open = (type) => {
    OriginalOpenWindow(type);
    if (type === 'profile') {
        setTimeout(ProfileDrag.apply, 100);
    }
};
</script>
