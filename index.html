<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Belugacord</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#313338">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; overflow:hidden; }
body { font-family:'gg sans','Segoe UI',Helvetica,Arial,sans-serif; background:#1e1f22; color:#dbdee1; display:flex; font-size:14px; }

.auth-screen { position:fixed; inset:0; background:#313338; display:flex; align-items:center; justify-content:center; padding:16px; z-index:2000; overflow-y:auto; }
.auth-box { background:#2b2d31; border-radius:8px; padding:32px; width:100%; max-width:420px; box-shadow:0 8px 24px rgba(0,0,0,0.4); }
.auth-box h1 { color:#f2f3f5; font-size:24px; margin-bottom:8px; text-align:center; }
.auth-box p { color:#949ba4; font-size:14px; margin-bottom:24px; text-align:center; }
.auth-tabs { display:flex; gap:8px; margin-bottom:20px; }
.auth-tab { flex:1; padding:10px; background:#1e1f22; color:#b5bac1; border:none; border-radius:4px; cursor:pointer; font-size:14px; font-weight:600; }
.auth-tab.active { background:#5865f2; color:white; }
.auth-field { margin-bottom:16px; }
.auth-field label { display:block; color:#b5bac1; font-size:12px; text-transform:uppercase; font-weight:700; margin-bottom:8px; }
.auth-field input { width:100%; background:#1e1f22; border:none; border-radius:4px; padding:10px; color:#dbdee1; font-size:15px; outline:none; }
.auth-field input:focus { outline:2px solid #5865f2; }
.auth-status { font-size:12px; margin-top:6px; height:16px; }
.auth-status.ok { color:#23a55a; } .auth-status.bad { color:#f23f43; }
.auth-btn { width:100%; background:#5865f2; color:white; border:none; padding:12px; border-radius:4px; font-size:15px; font-weight:600; cursor:pointer; margin-top:8px; }
.auth-btn:hover { background:#4752c4; }
.auth-error { color:#f23f43; font-size:13px; margin-top:12px; text-align:center; min-height:18px; }

.app { display:none; width:100%; height:100%; }
.app.active { display:flex; }
.guilds { width:72px; background:#1e1f22; display:flex; flex-direction:column; align-items:center; padding:12px 0; gap:8px; flex-shrink:0; overflow-y:auto; }
.guild { width:48px; height:48px; border-radius:50%; background:#313338; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:18px; color:#dbdee1; cursor:pointer; transition:all 0.15s; flex-shrink:0; overflow:hidden; }
.guild:hover { border-radius:16px; background:#5865f2; color:white; }
.guild.active { border-radius:16px; background:#5865f2; color:white; }
.guild svg { width:26px; height:26px; fill:currentColor; }
.guild-divider { width:32px; height:2px; background:#35373c; border-radius:1px; flex-shrink:0; }
.guild-add { background:#313338; color:#23a55a; font-size:24px; }
.guild-add:hover { background:#23a55a; color:white; }

.sidebar { width:240px; background:#2b2d31; display:flex; flex-direction:column; flex-shrink:0; }
.sidebar-header { height:48px; padding:0 16px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 1px 0 rgba(0,0,0,0.2); font-weight:600; color:#f2f3f5; cursor:pointer; flex-shrink:0; font-size:15px; }
.sidebar-content { flex:1; overflow-y:auto; padding:8px; }
.channel-cat { font-size:11px; text-transform:uppercase; color:#949ba4; font-weight:700; padding:16px 8px 4px; display:flex; justify-content:space-between; align-items:center; }
.channel-cat .add { cursor:pointer; color:#949ba4; font-size:16px; }
.channel { padding:6px 8px; border-radius:4px; color:#949ba4; cursor:pointer; font-size:15px; display:flex; align-items:center; gap:6px; margin-bottom:2px; font-weight:500; }
.channel:hover { background:#35373c; color:#dbdee1; }
.channel.active { background:#404249; color:#f2f3f5; }
.channel .hash { font-size:20px; color:#80848e; font-weight:400; }

.user-panel { height:52px; background:#232428; display:flex; align-items:center; padding:0 8px; gap:8px; flex-shrink:0; }
.avatar { width:32px; height:32px; border-radius:50%; background:#5865f2; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-weight:600; color:white; font-size:13px; overflow:hidden; }
.avatar img { width:100%; height:100%; object-fit:cover; }
.user-panel .user-info { flex:1; min-width:0; cursor:pointer; }
.user-panel .user-name { color:#f2f3f5; font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.user-panel .user-status { color:#949ba4; font-size:12px; }

.main { flex:1; display:flex; flex-direction:column; background:#313338; min-width:0; }
.main-header { height:48px; padding:0 16px; display:flex; align-items:center; gap:8px; box-shadow:0 1px 0 rgba(0,0,0,0.2); font-weight:600; color:#f2f3f5; flex-shrink:0; font-size:15px; }
.main-header .hash { color:#80848e; font-size:24px; }
.main-header .burger { display:none; background:none; border:none; color:#b5bac1; font-size:22px; cursor:pointer; padding:4px 8px; margin-left:-8px; }

.messages { flex:1; overflow-y:auto; padding:16px 16px 0; }
.message { display:flex; gap:16px; padding:4px 0; margin-bottom:4px; }
.message:hover { background:#2e3035; border-radius:4px; }
.message .avatar { width:40px; height:40px; font-size:16px; }
.msg-content { flex:1; min-width:0; padding-top:2px; }
.msg-header { display:flex; align-items:baseline; gap:8px; margin-bottom:2px; }
.username { font-weight:600; color:#f2f3f5; font-size:15px; }
.timestamp { font-size:12px; color:#949ba4; }
.msg-text { color:#dbdee1; font-size:15px; line-height:1.375; word-wrap:break-word; }
.msg-file { max-width:400px; max-height:300px; border-radius:8px; margin-top:6px; }

.input-area { padding:8px 16px 24px; flex-shrink:0; }
.input-box { background:#383a40; border-radius:8px; display:flex; align-items:center; padding:0 16px; gap:8px; }
.input-box input[type="text"] { flex:1; background:none; border:none; outline:none; color:#dbdee1; font-size:15px; padding:11px 0; font-family:inherit; }
.input-box input::placeholder { color:#6d6f78; }
.file-btn { color:#b5bac1; cursor:pointer; font-size:20px; padding:4px; }

.friends-screen { display:none; flex-direction:column; flex:1; overflow:hidden; }
.friends-screen.active { display:flex; }
.friends-topbar { height:48px; padding:0 16px; display:flex; align-items:center; gap:16px; box-shadow:0 1px 0 rgba(0,0,0,0.2); flex-shrink:0; overflow-x:auto; }
.friends-tab { color:#b5bac1; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:15px; font-weight:500; white-space:nowrap; }
.friends-tab.active { background:#404249; color:#f2f3f5; }
.friends-body { flex:1; overflow-y:auto; padding:16px 24px; }
.friends-body h3 { font-size:12px; text-transform:uppercase; color:#949ba4; font-weight:700; margin:16px 0 8px; }
.friend-row { display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:8px; cursor:pointer; margin-bottom:2px; }
.friend-row:hover { background:#35373c; }
.friend-name { color:#f2f3f5; font-weight:600; font-size:15px; }
.friend-status { color:#949ba4; font-size:13px; }
.friend-actions { margin-left:auto; display:flex; gap:8px; }
.friend-actions button { width:36px; height:36px; border-radius:50%; background:#2b2d31; border:none; color:#b5bac1; cursor:pointer; font-size:16px; }
.friend-actions button:hover { background:#404249; color:#f2f3f5; }
.add-friend-box { background:#1e1f22; border-radius:8px; padding:16px; margin-top:8px; }
.add-friend-box p { color:#b5bac1; font-size:12px; text-transform:uppercase; font-weight:700; margin-bottom:8px; }
.add-friend-input { display:flex; gap:8px; }
.add-friend-input input { flex:1; background:#2b2d31; border:1px solid #1e1f22; border-radius:4px; padding:10px 12px; color:#dbdee1; font-size:14px; outline:none; }
.add-friend-input button { background:#5865f2; color:white; border:none; padding:0 16px; border-radius:4px; font-weight:600; cursor:pointer; }

.dm-screen { display:none; flex-direction:column; flex:1; overflow:hidden; }
.dm-screen.active { display:flex; }

.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:1500; align-items:center; justify-content:center; padding:16px; overflow-y:auto; }
.modal-overlay.open { display:flex; }
.modal { background:#313338; border-radius:8px; width:100%; max-width:500px; max-height:90vh; overflow-y:auto; position:relative; }
.banner { height:120px; background:#5865f2; border-radius:8px 8px 0 0; position:relative; overflow:hidden; }
.banner img { width:100%; height:100%; object-fit:cover; }
.banner-edit { position:absolute; top:8px; right:8px; background:rgba(0,0,0,0.6); color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-size:12px; }
.profile-avatar { width:80px; height:80px; border-radius:50%; background:#5865f2; border:6px solid #313338; position:absolute; top:80px; left:24px; display:flex; align-items:center; justify-content:center; font-size:32px; font-weight:600; color:white; overflow:hidden; cursor:pointer; }
.profile-avatar img { width:100%; height:100%; object-fit:cover; }
.profile-info { padding:56px 24px 24px; }
.profile-info h2 { color:#f2f3f5; font-size:20px; margin-bottom:16px; }
.profile-info label { display:block; color:#b5bac1; font-size:12px; text-transform:uppercase; font-weight:700; margin:16px 0 8px; }
.save-btn { margin-top:24px; width:100%; background:#5865f2; color:white; border:none; padding:12px; border-radius:4px; font-size:15px; font-weight:600; cursor:pointer; }
.close-btn { position:absolute; top:12px; right:12px; background:rgba(0,0,0,0.6); color:white; border:none; width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:16px; z-index:10; }
.logout-btn { margin-top:12px; width:100%; background:#f23f43; color:white; border:none; padding:10px; border-radius:4px; font-weight:600; cursor:pointer; }
.admin-btn { margin-top:8px; width:100%; background:#f0b232; color:#1e1f22; border:none; padding:10px; border-radius:4px; font-weight:600; cursor:pointer; }

/* Всплывашка */
.toast { position:fixed; bottom:24px; right:24px; background:#2b2d31; border-radius:8px; padding:16px; box-shadow:0 8px 24px rgba(0,0,0,0.5); z-index:3000; display:flex; gap:12px; align-items:center; max-width:360px; animation:slideIn 0.3s; }
@keyframes slideIn { from { transform:translateX(400px); } to { transform:translateX(0); } }
.toast .avatar { width:40px; height:40px; font-size:16px; }
.toast-text { flex:1; }
.toast-title { color:#f2f3f5; font-weight:600; font-size:14px; margin-bottom:4px; }
.toast-sub { color:#949ba4; font-size:13px; }
.toast-btn { background:#5865f2; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-weight:600; font-size:13px; }
.toast-btn.accept { background:#23a55a; }
.toast-btn.decline { background:#f23f43; }

/* Звонок */
.call-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:2500; align-items:center; justify-content:center; flex-direction:column; gap:16px; }
.call-modal.open { display:flex; }
.call-avatar { width:120px; height:120px; border-radius:50%; background:#5865f2; display:flex; align-items:center; justify-content:center; font-size:48px; color:white; font-weight:600; overflow:hidden; }
.call-avatar img { width:100%; height:100%; object-fit:cover; }
.call-name { color:#f2f3f5; font-size:20px; font-weight:600; }
.call-status { color:#949ba4; font-size:14px; }
.call-actions { display:flex; gap:16px; margin-top:16px; }
.call-btn { width:56px; height:56px; border-radius:50%; border:none; cursor:pointer; font-size:22px; color:white; }
.call-btn.accept { background:#23a55a; }
.call-btn.decline { background:#f23f43; }

@media (max-width:768px) {
    .guilds { width:56px; padding:8px 0; }
    .guild { width:40px; height:40px; font-size:15px; }
    .sidebar { position:fixed; left:56px; top:0; bottom:0; z-index:500; transform:translateX(-120%); transition:transform 0.2s; box-shadow:4px 0 12px rgba(0,0,0,0.4); }
    .sidebar.open { transform:translateX(0); }
    .main-header .burger { display:block; }
    .messages { padding:12px 12px 0; }
    .message { gap:12px; }
    .input-area { padding:8px 12px 16px; }
    .overlay-backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:400; }
    .overlay-backdrop.open { display:block; }
}
::-webkit-scrollbar { width:8px; height:8px; }
::-webkit-scrollbar-thumb { background:#1a1b1e; border-radius:4px; }
</style>
</head>
<body>

<div class="auth-screen" id="authScreen">
    <div class="auth-box">
        <h1>Belugacord</h1>
        <p>Войди или создай аккаунт</p>
        <div class="auth-tabs">
            <button class="auth-tab active" id="tabLogin" onclick="switchTab('login')">Вход</button>
            <button class="auth-tab" id="tabRegister" onclick="switchTab('register')">Регистрация</button>
        </div>
        <div class="auth-field">
            <label>Имя пользователя</label>
            <input type="text" id="authUsername" maxlength="32" autocomplete="off">
            <div class="auth-status" id="usernameStatus"></div>
        </div>
        <div class="auth-field">
            <label>Пароль</label>
            <input type="password" id="authPassword" maxlength="64">
        </div>
        <button class="auth-btn" id="authBtn" onclick="submitAuth()">Войти</button>
        <div class="auth-error" id="authError"></div>
    </div>
</div>

<div class="app" id="app">
    <div class="guilds" id="guilds">
        <div class="guild friends" onclick="showFriends()" title="Друзья">
            <svg viewBox="0 0 24 24"><path d="M13 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm-9 10a1 1 0 0 1-1-1v-1c0-2.76 3.58-5 8-5s8 2.24 8 5v1a1 1 0 0 1-1 1H4zm16-10a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/></svg>
        </div>
        <div class="guild-divider"></div>
        <div id="serverList"></div>
        <div class="guild guild-add" onclick="openCreateServer()" title="Создать сервер">+</div>
        <div class="guild guild-add" onclick="openJoinServer()" title="Присоединиться" style="font-size:18px;">→</div>
    </div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header" id="sidebarHeader">
            <span id="sidebarTitle">Belugacord</span>
            <span>▾</span>
        </div>
        <div class="sidebar-content" id="sidebarContent"></div>
        <div class="user-panel">
            <div class="avatar" id="userAvatarSmall" onclick="openProfile()">?</div>
            <div class="user-info" onclick="openProfile()">
                <div class="user-name" id="userNameSmall">...</div>
                <div class="user-status" id="userStatusSmall">в сети</div>
            </div>
        </div>
    </div>

    <div class="overlay-backdrop" id="backdrop" onclick="toggleSidebar()"></div>

    <div class="main">
        <div id="chatScreen" style="display:flex;flex-direction:column;flex:1;overflow:hidden;">
            <div class="main-header">
                <button class="burger" onclick="toggleSidebar()">☰</button>
                <span class="hash">#</span>
                <span id="channelName">общий</span>
                <button class="file-btn" style="margin-left:auto;" onclick="startCall()" title="Позвонить">📞</button>
            </div>
            <div class="messages" id="chat"></div>
            <div class="input-area">
                <div class="input-box">
                    <label class="file-btn" for="fileInput">+</label>
                    <input type="file" id="fileInput" style="display:none" onchange="uploadFile(this)">
                    <input type="text" id="inp" placeholder="Написать сообщение..." autocomplete="off">
                </div>
            </div>
        </div>

        <div class="dm-screen" id="dmScreen">
            <div class="main-header">
                <button class="burger" onclick="toggleSidebar()">☰</button>
                <div class="avatar" id="dmAvatar" style="width:24px;height:24px;font-size:11px;">?</div>
                <span id="dmName">ЛС</span>
                <button class="file-btn" style="margin-left:auto;" onclick="startCallDM()" title="Позвонить">📞</button>
            </div>
            <div class="messages" id="dmChat"></div>
            <div class="input-area">
                <div class="input-box">
                    <label class="file-btn" for="dmFileInput">+</label>
                    <input type="file" id="dmFileInput" style="display:none" onchange="uploadDMFile(this)">
                    <input type="text" id="dmInp" placeholder="Написать сообщение..." autocomplete="off">
                </div>
            </div>
        </div>

        <div class="friends-screen" id="friendsScreen">
            <div class="friends-topbar">
                <div class="friends-tab active">Все</div>
                <div class="friends-tab">В сети</div>
                <div class="friends-tab">В ожидании</div>
            </div>
            <div class="friends-body">
                <div class="add-friend-box">
                    <p>Добавить в друзья</p>
                    <div class="add-friend-input">
                        <input type="text" placeholder="Введите имя пользователя" id="addFriendInput">
                        <button onclick="addFriend()">Отправить</button>
                    </div>
                </div>
                <h3 id="friendsTitle">Друзья — 0</h3>
                <div id="friendsList"></div>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="profileModal">
    <div class="modal">
        <button class="close-btn" onclick="closeProfile()">✕</button>
        <div class="banner" id="bannerPreview">
            <button class="banner-edit" onclick="document.getElementById('bannerInput').click()">Изменить баннер</button>
        </div>
        <div class="profile-avatar" id="avatarPreview" onclick="document.getElementById('avatarInput').click()">?</div>
        <div class="profile-info">
            <h2 id="profileName">Профиль</h2>
            <label>Аватарка</label>
            <button class="save-btn" onclick="document.getElementById('avatarInput').click()">Загрузить аватарку</button>
            <button class="save-btn" style="background:#23a55a;margin-top:8px;" onclick="saveProfile()">Сохранить</button>
            <button class="admin-btn" id="adminBtn" style="display:none;" onclick="openAdmin()">Админ-панель</button>
            <button class="logout-btn" onclick="logout()">Выйти из аккаунта</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="adminModal">
    <div class="modal">
        <button class="close-btn" onclick="document.getElementById('adminModal').classList.remove('open')">✕</button>
        <div class="profile-info" style="padding:24px;">
            <h2>Админ-панель</h2>
            <label>Забанить юзера по нику</label>
            <input type="text" id="banInput" placeholder="Ник" style="width:100%;background:#1e1f22;border:none;border-radius:4px;padding:10px;color:#dbdee1;">
            <button class="save-btn" style="background:#f23f43;" onclick="adminBan()">Забанить</button>
        </div>
    </div>
</div>

<input type="file" id="avatarInput" accept="image/*" style="display:none">
<input type="file" id="bannerInput" accept="image/*" style="display:none">

<div class="call-modal" id="callModal">
    <div class="call-avatar" id="callAvatar">?</div>
    <div class="call-name" id="callName">...</div>
    <div class="call-status" id="callStatus">...</div>
    <div class="call-actions" id="callActions"></div>
</div>

<script>
let token = localStorage.getItem('belugacord_token') || '';
let me = null, ws = null;
let currentServerId = null, currentChannelId = null;
let currentDMUser = null;
let avatarData = null, bannerData = null, pendingAvatar = null, pendingBanner = null;
let authMode = 'login';
let pc = null, localStream = null, callTarget = null;

// ===== АВТОРИЗАЦИЯ =====
function switchTab(mode) {
    authMode = mode;
    document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
    document.getElementById('tabRegister').classList.toggle('active', mode === 'register');
    document.getElementById('authBtn').textContent = mode === 'login' ? 'Войти' : 'Зарегистрироваться';
    document.getElementById('authError').textContent = '';
    checkUsername();
}

let checkTimer = null;
function checkUsername() {
    const val = document.getElementById('authUsername').value.trim();
    const status = document.getElementById('usernameStatus');
    if (authMode !== 'register') { status.textContent = ''; return; }
    if (val.length < 2) { status.textContent = ''; return; }
    clearTimeout(checkTimer);
    checkTimer = setTimeout(async () => {
        try {
            const r = await fetch('/api/check_username?username=' + encodeURIComponent(val));
            const d = await r.json();
            if (d.available) { status.textContent = '✓ Ник свободен'; status.className = 'auth-status ok'; }
            else { status.textContent = '✕ Ник занят'; status.className = 'auth-status bad'; }
        } catch(e) { status.textContent = ''; }
    }, 400);
}
document.getElementById('authUsername').addEventListener('input', checkUsername);

async function submitAuth() {
    const username = document.getElementById('authUsername').value.trim();
    const password = document.getElementById('authPassword').value;
    const err = document.getElementById('authError');
    err.textContent = '';
    if (!username || !password) { err.textContent = 'Заполни все поля'; return; }
    const url = authMode === 'login' ? '/api/login' : '/api/register';
    try {
        const r = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username, password}) });
        const d = await r.json();
        if (!r.ok) { err.textContent = d.detail || 'Ошибка'; return; }
        token = d.token;
        localStorage.setItem('belugacord_token', token);
        me = d.user;
        enterApp();
    } catch(e) { err.textContent = 'Ошибка соединения'; }
}

function logout() {
    localStorage.removeItem('belugacord_token');
    token = ''; me = null;
    if (ws) ws.close();
    document.getElementById('app').classList.remove('active');
    document.getElementById('authScreen').style.display = 'flex';
}

async function boot() {
    if (token) {
        try {
            const r = await fetch('/api/me?token=' + encodeURIComponent(token));
            if (r.ok) { me = await r.json(); enterApp(); return; }

// ===== ЧАТ =====
function connectWS() {
    const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
    ws = new WebSocket(proto + location.host + '/ws?token=' + encodeURIComponent(token));
    ws.onmessage = (event) => {
        let data; try { data = JSON.parse(event.data); } catch(e) { return; }
        if (data.type === 'message') {
            if (data.channel_id === currentChannelId) {
                addMessage(data.username, data.text, data.avatar, data.file_url, data.created_at);
            }
        } else if (data.type === 'dm') {
            if (currentDMUser && (data.from_user === currentDMUser.id || data.to_user === currentDMUser.id)) {
                addDMMessage(data.username, data.text, data.avatar, data.file_url, data.created_at, data.from_user === me.id);
            } else {
                showToast(data.username + ': ' + (data.text || '📎'), data.avatar, null, null);
            }
        } else if (data.type === 'friend_request') {
            showFriendRequestToast(data);
        } else if (data.type === 'friend_accepted') {
            showToast(data.by + ' принял запрос', null, null, null);
            loadFriends();
        } else if (data.type === 'call') {
            showIncomingCall(data);
        } else if (data.type === 'offer' || data.type === 'answer' || data.type === 'ice') {
            handleSignal(data);
        } else if (data.type === 'call_decline') {
            document.getElementById('callModal').classList.remove('open');
            if (pc) { pc.close(); pc = null; }
        } else if (data.type === 'banned') {
            alert('Ты забанен');
            logout();
        }
    };
    ws.onclose = () => setTimeout(connectWS, 2000);
}

    div.className = 'message';

    let av = '<div class="avatar">' + name.charAt(0).toUpperCase() + '</div>';
    if (avatar) av = '<div class="avatar"><img src="' + avatar + '"></div>';
    let fileHTML = '';
    if (fileUrl) {
        const isVideo = /\.(mp4|webm|mov)$/i.test(fileUrl);
        fileHTML = isVideo ? '<video class="msg-file" controls src="' + fileUrl + '"></video>' : '<img class="msg-file" src="' + fileUrl + '">';
    }
    div.innerHTML = av + '<div class="msg-content"><div class="msg-header"><span class="username">' + escapeHtml(name) + '</span><span class="timestamp">сегодня в ' + t + '</span></div><div class="msg-text">' + escapeHtml(text || '') + '</div>' + fileHTML + '</div>';
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function startCall() {
    const username = prompt('Кому звонить? (ник)');
    if (!username) return;
    try {
        const r = await fetch('/api/friends/list?token=' + encodeURIComponent(token));
        const friends = await r.json();
        const friend = friends.find(f => f.username === username && f.status === 'accepted');
        if (!friend) { alert('Друг не найден'); return; }
        await initiateCall(friend.id, friend.username);
    } catch(e) { alert('Ошибка: ' + e.message); }
}

async function startCallDM() {
    if (!currentDMUser) return;
    await initiateCall(currentDMUser.id, currentDMUser.username);
}

async function initiateCall(targetId, targetName) {
    callTarget = targetId;
    try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
        localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
        pc.onicecandidate = e => { if (e.candidate) ws.send(JSON.stringify({ type:'ice', target: callTarget, candidate: e.candidate })); };
        pc.ontrack = e => { const audio = new Audio(); audio.srcObject = e.streams[0]; audio.play(); };
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        ws.send(JSON.stringify({ type:'call', target: callTarget }));
        ws.send(JSON.stringify({ type:'offer', target: callTarget, sdp: offer }));
        showCallModal(targetName, 'Звоним...', false);
    } catch(e) { alert('Ошибка звонка: ' + e.message); }
}

function showIncomingCall(data) {
    showCallModal(data.from_name, 'Входящий звонок', true, data.from, data.from_avatar);
}

function showCallModal(name, status, incoming, fromId, fromAvatar) {
    document.getElementById('callModal').classList.add('open');
    document.getElementById('callName').textContent = name;
    document.getElementById('callStatus').textContent = status;
    const av = document.getElementById('callAvatar');
    if (fromAvatar) av.innerHTML = '<img src="' + fromAvatar + '">';
    else av.textContent = name.charAt(0).toUpperCase();
    const actions = document.getElementById('callActions');
    actions.innerHTML = '';
    if (incoming) {
        const accept = document.createElement('button');
        accept.className = 'call-btn accept'; accept.textContent = '✓';
        accept.onclick = () => acceptCall(fromId, name, fromAvatar);
        const decline = document.createElement('button');
        decline.className = 'call-btn decline'; decline.textContent = '✕';
        decline.onclick = () => {
            ws.send(JSON.stringify({ type:'call_decline', target: fromId }));
            document.getElementById('callModal').classList.remove('open');
        };
        actions.appendChild(accept); actions.appendChild(decline);
    } else {
        const decline = document.createElement('button');
        decline.className = 'call-btn decline'; decline.textContent = '✕';
        decline.onclick = () => {
            if (callTarget) ws.send(JSON.stringify({ type:'call_decline', target: callTarget }));
            document.getElementById('callModal').classList.remove('open');
            if (pc) { pc.close(); pc = null; }
        };
        actions.appendChild(decline);
    }
}

async function acceptCall(fromId, name, avatar) {
    callTarget = fromId;
    try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
        localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
        pc.onicecandidate = e => { if (e.candidate) ws.send(JSON.stringify({ type:'ice', target: callTarget, candidate: e.candidate })); };
        pc.ontrack = e => { const audio = new Audio(); audio.srcObject = e.streams[0]; audio.play(); };
        document.getElementById('callStatus').textContent = 'В разговоре';
        document.getElementById('callActions').innerHTML = '<button class="call-btn decline" onclick="endCall()">✕</button>';
    } catch(e) { alert('Ошибка микрофона'); }
}

function endCall() {
    if (callTarget) ws.send(JSON.stringify({ type:'call_decline', target: callTarget }));
    document.getElementById('callModal').classList.remove('open');
    if (pc) { pc.close(); pc = null; }
}

async function handleSignal(data) {
    if (!pc) {
        // Если мы принимаем звонок — pc создаётся в acceptCall. Тут на случай offer до accept
        if (data.type === 'offer') return;
        return;
    }
    if (data.type === 'offer') {
        await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        ws.send(JSON.stringify({ type:'answer', target: data.from, sdp: answer }));
    } else if (data.type === 'answer') {
        await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
    } else if (data.type === 'ice') {
        try { await pc.addIceCandidate(new RTCIceCandidate(data.candidate)); } catch(e) {}
    }
}

// Заглушка для offer, если acceptCall ещё не создал pc
const origHandleSignal = handleSignal;

boot();
