<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Belugacord</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0a0a12">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; overflow:hidden; }
body {
    font-family:'Inter','Segoe UI',Helvetica,Arial,sans-serif;
    background:#0a0a12;
    color:#e0e0ff;
    display:flex;
    font-size:14px;
    animation:bgPulse 10s infinite alternate;
}
@keyframes bgPulse {
    0% { background:#0a0a12; }
    100% { background:#12082a; }
}

/* SVG ИКОНКИ */
svg { width: 1.2em; height: 1.2em; fill: currentColor; vertical-align: middle; }
.icon-btn { background:none; border:none; color:#8b8ba7; cursor:pointer; padding:8px; border-radius:10px; transition:all 0.2s; display:flex; align-items:center; justify-content:center; }
.icon-btn:hover { background:rgba(168,85,247,0.2); color:#fff; }
.icon-btn svg { width: 1.4em; height: 1.4em; }

/* ЭКРАН ВХОДА */
.auth-screen { position:fixed; inset:0; background:radial-gradient(ellipse at top, #1a0a2e 0%, #0a0a12 70%); display:flex; align-items:center; justify-content:center; padding:16px; z-index:2000; overflow-y:auto; }
.auth-box { background:rgba(20,15,35,0.85); backdrop-filter:blur(20px); border:1px solid rgba(138,43,226,0.3); border-radius:16px; padding:40px 32px; width:100%; max-width:420px; box-shadow:0 0 60px rgba(138,43,226,0.3), 0 0 120px rgba(0,255,255,0.1); animation:slideUp 0.5s ease; }
@keyframes slideUp { from { transform:translateY(30px); opacity:0; } to { transform:translateY(0); opacity:1; } }
.auth-box h1 { font-size:32px; margin-bottom:8px; text-align:center; background:linear-gradient(135deg, #a855f7, #06b6d4); -webkit-background-clip:text; -webkit-text-fill-color:transparent; font-weight:800; letter-spacing:-0.5px; }
.auth-box p { color:#8b8ba7; font-size:14px; margin-bottom:28px; text-align:center; }
.auth-tabs { display:flex; gap:8px; margin-bottom:24px; background:rgba(10,10,18,0.6); padding:4px; border-radius:10px; }
.auth-tab { flex:1; padding:10px; background:none; color:#8b8ba7; border:none; border-radius:8px; cursor:pointer; font-size:14px; font-weight:600; transition:all 0.2s; }
.auth-tab.active { background:linear-gradient(135deg, #a855f7, #6366f1); color:white; box-shadow:0 0 20px rgba(168,85,247,0.5); }
.auth-field { margin-bottom:18px; }
.auth-field label { display:block; color:#a0a0c0; font-size:11px; text-transform:uppercase; font-weight:700; margin-bottom:8px; letter-spacing:1px; }
.auth-field input { width:100%; background:rgba(10,10,18,0.8); border:1px solid rgba(138,43,226,0.2); border-radius:10px; padding:12px 14px; color:#e0e0ff; font-size:15px; outline:none; transition:all 0.2s; }
.auth-field input:focus { border-color:#a855f7; box-shadow:0 0 0 3px rgba(168,85,247,0.15); }
.auth-btn { width:100%; background:linear-gradient(135deg, #a855f7, #6366f1); color:white; border:none; padding:14px; border-radius:10px; font-size:15px; font-weight:700; cursor:pointer; margin-top:8px; box-shadow:0 0 30px rgba(168,85,247,0.4); transition:all 0.2s; display:flex; align-items:center; justify-content:center; gap:8px; }
.auth-btn:hover { box-shadow:0 0 50px rgba(168,85,247,0.7); transform:translateY(-1px); }
.auth-error { color:#ff3366; font-size:13px; margin-top:14px; text-align:center; min-height:18px; }

/* ОСНОВНОЙ ИНТЕРФЕЙС */
.app { display:none; width:100%; height:100%; }
.app.active { display:flex; }

/* ПАНЕЛЬ СЕРВЕРОВ */
.guilds { width:76px; background:linear-gradient(180deg, #0a0a12 0%, #12082a 100%); border-right:1px solid rgba(138,43,226,0.15); display:flex; flex-direction:column; align-items:center; padding:14px 0; gap:10px; flex-shrink:0; overflow-y:auto; }
.guild { width:50px; height:50px; border-radius:16px; background:rgba(30,20,50,0.8); border:1px solid rgba(138,43,226,0.2); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:18px; color:#a0a0c0; cursor:pointer; transition:all 0.25s cubic-bezier(0.4,0,0.2,1); flex-shrink:0; overflow:hidden; position:relative; }
.guild:hover { border-radius:14px; background:linear-gradient(135deg, rgba(168,85,247,0.3), rgba(6,182,212,0.3)); border-color:#a855f7; color:white; box-shadow:0 0 20px rgba(168,85,247,0.5); transform:translateY(-2px); }
.guild.active { border-radius:14px; background:linear-gradient(135deg, #a855f7, #06b6d4); color:white; box-shadow:0 0 25px rgba(168,85,247,0.7), 0 0 50px rgba(6,182,212,0.3); }
.guild svg { width:26px; height:26px; fill:currentColor; }
.guild img { width:100%; height:100%; object-fit:cover; }
.guild-divider { width:36px; height:1px; background:linear-gradient(90deg, transparent, rgba(138,43,226,0.4), transparent); flex-shrink:0; }
.guild-add { background:rgba(30,20,50,0.6); border:1px dashed rgba(0,255,170,0.4); color:#00ffaa; font-size:24px; }
.guild-add:hover { background:rgba(0,255,170,0.15); border-color:#00ffaa; border-style:solid; color:#00ffaa; box-shadow:0 0 20px rgba(0,255,170,0.4); }

/* САЙДБАР */
.sidebar { width:260px; background:linear-gradient(180deg, #12082a 0%, #0f0520 100%); border-right:1px solid rgba(138,43,226,0.15); display:flex; flex-direction:column; flex-shrink:0; }
.sidebar-header { height:56px; padding:0 20px; display:flex; align-items:center; justify-content:space-between; background:rgba(20,15,35,0.6); border-bottom:1px solid rgba(138,43,226,0.15); font-weight:700; color:#e0e0ff; cursor:pointer; flex-shrink:0; font-size:15px; letter-spacing:0.3px; }
.sidebar-header:hover { background:rgba(30,20,50,0.8); }
.sidebar-content { flex:1; overflow-y:auto; padding:10px; }
.channel-cat { font-size:11px; text-transform:uppercase; color:#6b6b8a; font-weight:700; padding:18px 10px 6px; display:flex; justify-content:space-between; align-items:center; letter-spacing:1.2px; }
.channel-cat .add { cursor:pointer; color:#8b8ba7; font-size:16px; transition:all 0.2s; }
.channel-cat .add:hover { color:#00ffaa; text-shadow:0 0 10px rgba(0,255,170,0.8); }
.channel { padding:8px 10px; border-radius:8px; color:#8b8ba7; cursor:pointer; font-size:14px; display:flex; align-items:center; gap:8px; margin-bottom:2px; font-weight:500; transition:all 0.15s; }
.channel:hover { background:rgba(168,85,247,0.1); color:#e0e0ff; }
.channel.active { background:linear-gradient(90deg, rgba(168,85,247,0.2), rgba(6,182,212,0.1)); color:#ffffff; border-left:3px solid #a855f7; box-shadow:inset 0 0 20px rgba(168,85,247,0.1); }
.channel svg { width:18px; height:18px; fill:#6b6b8a; }

/* ПАНЕЛЬ ПРОФИЛЯ */
.user-panel { height:60px; background:rgba(10,5,20,0.8); border-top:1px solid rgba(138,43,226,0.15); display:flex; align-items:center; padding:0 10px; gap:10px; flex-shrink:0; }
.avatar { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg, #a855f7, #06b6d4); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-weight:700; color:white; font-size:14px; overflow:hidden; position:relative; }
.avatar img { width:100%; height:100%; object-fit:cover; }
.avatar.premium::after { content:'👑'; position:absolute; bottom:-4px; right:-4px; font-size:12px; background:#0a0a12; border-radius:50%; width:18px; height:18px; display:flex; align-items:center; justify-content:center; border:1px solid #ffd700; }
.user-panel .user-info { flex:1; min-width:0; cursor:pointer; }
.user-panel .user-name { color:#e0e0ff; font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.user-panel .user-status { color:#6b6b8a; font-size:11px; display:flex; align-items:center; gap:4px; }
.user-panel .user-status::before { content:''; width:8px; height:8px; border-radius:50%; background:#00ffaa; box-shadow:0 0 8px #00ffaa; animation:pulseDot 2s infinite; }
@keyframes pulseDot { 0%,100% { opacity:1; } 50% { opacity:0.5; } }

/* ОСНОВНАЯ ОБЛАСТЬ */
.main { flex:1; display:flex; flex-direction:column; background:#0a0a12; min-width:0; position:relative; }
.main::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse at top right, rgba(138,43,226,0.08) 0%, transparent 50%), radial-gradient(ellipse at bottom left, rgba(6,182,212,0.05) 0%, transparent 50%); pointer-events:none; }
.main-header { height:56px; padding:0 20px; display:flex; align-items:center; gap:10px; background:rgba(15,8,28,0.6); border-bottom:1px solid rgba(138,43,226,0.15); font-weight:700; color:#e0e0ff; flex-shrink:0; font-size:15px; position:relative; z-index:1; }
.main-header svg.hash { color:#a855f7; width:22px; height:22px; filter:drop-shadow(0 0 8px rgba(168,85,247,0.8)); }

/* СООБЩЕНИЯ */
.messages { flex:1; overflow-y:auto; padding:20px 20px 0; position:relative; z-index:1; display:flex; flex-direction:column; gap:4px; }
.message { display:flex; gap:16px; padding:6px 8px; margin-bottom:2px; border-radius:10px; transition:background 0.15s; animation:msgIn 0.3s ease-out; }
@keyframes msgIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
.message:hover { background:rgba(138,43,226,0.06); }
.message .avatar { width:42px; height:42px; font-size:16px; }
.msg-content { flex:1; min-width:0; padding-top:2px; }
.msg-header { display:flex; align-items:baseline; gap:8px; margin-bottom:3px; }
.username { font-weight:700; color:#e0e0ff; font-size:14px; }
.timestamp { font-size:11px; color:#6b6b8a; }
.msg-text { color:#c0c0e0; font-size:14px; line-height:1.5; word-wrap:break-word; }
.msg-file { max-width:400px; max-height:300px; border-radius:12px; margin-top:8px; border:1px solid rgba(138,43,226,0.2); }

/* ПОЛЕ ВВОДА */
.input-area { padding:12px 20px 28px; flex-shrink:0; position:relative; z-index:1; }
.input-box { background:rgba(20,15,35,0.8); border:1px solid rgba(138,43,226,0.2); border-radius:14px; display:flex; align-items:center; padding:0 18px; gap:10px; transition:all 0.2s; }
.input-box:focus-within { border-color:#a855f7; box-shadow:0 0 25px rgba(168,85,247,0.3); }
.input-box input[type="text"] { flex:1; background:none; border:none; outline:none; color:#e0e0ff; font-size:14px; padding:14px 0; font-family:inherit; }
.input-box input::placeholder { color:#5a5a7a; }
.icon-btn svg { width:1.4em; height:1.4em; }

/* ДРУЗЬЯ */
.friends-screen { display:none; flex-direction:column; flex:1; overflow:hidden; position:relative; z-index:1; }
.friends-screen.active { display:flex; }
.friends-topbar { height:56px; padding:0 20px; display:flex; align-items:center; gap:20px; border-bottom:1px solid rgba(138,43,226,0.15); flex-shrink:0; overflow-x:auto; background:rgba(15,8,28,0.6); }
.friends-tab { color:#8b8ba7; padding:6px 12px; border-radius:8px; cursor:pointer; font-size:14px; font-weight:600; white-space:nowrap; transition:all 0.2s; }
.friends-tab:hover { background:rgba(168,85,247,0.1); color:#e0e0ff; }
.friends-tab.active { background:linear-gradient(135deg, rgba(168,85,247,0.3), rgba(6,182,212,0.2)); color:#ffffff; box-shadow:0 0 15px rgba(168,85,247,0.3); }
.friends-body { flex:1; overflow-y:auto; padding:20px 28px; }
.friends-body h3 { font-size:11px; text-transform:uppercase; color:#6b6b8a; font-weight:700; margin:20px 0 10px; letter-spacing:1.2px; }
.friend-row { display:flex; align-items:center; gap:14px; padding:12px 14px; border-radius:12px; cursor:pointer; margin-bottom:4px; transition:all 0.2s; border:1px solid transparent; }
.friend-row:hover { background:rgba(168,85,247,0.08); border-color:rgba(168,85,247,0.2); }
.friend-row .avatar { width:40px; height:40px; }
.friend-name { color:#e0e0ff; font-weight:700; font-size:14px; }
.friend-status { color:#6b6b8a; font-size:12px; }
.friend-actions { margin-left:auto; display:flex; gap:8px; }
.friend-actions button { width:38px; height:38px; border-radius:10px; background:rgba(30,20,50,0.8); border:1px solid rgba(138,43,226,0.2); color:#a0a0c0; cursor:pointer; font-size:16px; transition:all 0.2s; display:flex; align-items:center; justify-content:center; }
.friend-actions button:hover { background:rgba(168,85,247,0.2); color:#fff; border-color:#a855f7; }
.add-friend-box { background:rgba(20,15,35,0.6); border:1px solid rgba(138,43,226,0.2); border-radius:12px; padding:18px; margin-top:10px; }
.add-friend-box p { color:#a0a0c0; font-size:11px; text-transform:uppercase; font-weight:700; margin-bottom:10px; letter-spacing:1px; }
.add-friend-input { display:flex; gap:10px; }
.add-friend-input input { flex:1; background:rgba(10,10,18,0.8); border:1px solid rgba(138,43,226,0.2); border-radius:10px; padding:12px 14px; color:#e0e0ff; font-size:14px; outline:none; transition:all 0.2s; }
.add-friend-input input:focus { border-color:#a855f7; box-shadow:0 0 0 3px rgba(168,85,247,0.15); }
.add-friend-input button { background:linear-gradient(135deg, #a855f7, #6366f1); color:white; border:none; padding:0 20px; border-radius:10px; font-weight:700; cursor:pointer; box-shadow:0 0 20px rgba(168,85,247,0.4); transition:all 0.2s; display:flex; align-items:center; justify-content:center; }
.add-friend-input button:hover { box-shadow:0 0 30px rgba(168,85,247,0.7); }

/* ЛС */
.dm-screen { display:none; flex-direction:column; flex:1; overflow:hidden; position:relative; z-index:1; }
.dm-screen.active { display:flex; }

/* МОДАЛКИ */
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(5,0,15,0.85); backdrop-filter:blur(8px); z-index:1500; align-items:center; justify-content:center; padding:16px; overflow-y:auto; }
.modal-overlay.open { display:flex; }
.modal { background:linear-gradient(180deg, rgba(30,20,50,0.98), rgba(15,8,28,0.98)); border:1px solid rgba(138,43,226,0.3); border-radius:16px; width:100%; max-width:560px; max-height:90vh; overflow-y:auto; position:relative; box-shadow:0 0 80px rgba(138,43,226,0.5); animation:modalIn 0.3s cubic-bezier(0.2,0.9,0.3,1); }
@keyframes modalIn { from { transform:scale(0.9); opacity:0; } to { transform:scale(1); opacity:1; } }
.banner { height:140px; background:linear-gradient(135deg, #a855f7, #06b6d4); border-radius:16px 16px 0 0; position:relative; overflow:hidden; }
.banner img { width:100%; height:100%; object-fit:cover; }
.banner-edit { position:absolute; top:10px; right:10px; background:rgba(0,0,0,0.7); color:white; border:1px solid rgba(168,85,247,0.5); padding:8px 14px; border-radius:8px; cursor:pointer; font-size:12px; font-weight:600; backdrop-filter:blur(10px); }
.banner-edit:hover { background:rgba(168,85,247,0.3); }
.profile-avatar { width:96px; height:96px; border-radius:50%; background:linear-gradient(135deg, #a855f7, #06b6d4); border:6px solid #1a0a2e; position:absolute; top:92px; left:24px; display:flex; align-items:center; justify-content:center; font-size:38px; font-weight:700; color:white; overflow:hidden; cursor:pointer; box-shadow:0 0 30px rgba(168,85,247,0.5); }
.profile-avatar img { width:100%; height:100%; object-fit:cover; }
.profile-info { padding:64px 28px 28px; }
.profile-info h2 { font-size:24px; margin-bottom:20px; background:linear-gradient(135deg, #a855f7, #06b6d4); -webkit-background-clip:text; -webkit-text-fill-color:transparent; font-weight:800; }
.profile-info label { display:block; color:#a0a0c0; font-size:11px; text-transform:uppercase; font-weight:700; margin:18px 0 8px; letter-spacing:1px; }
.save-btn { margin-top:16px; width:100%; background:linear-gradient(135deg, #a855f7, #6366f1); color:white; border:none; padding:14px; border-radius:10px; font-size:14px; font-weight:700; cursor:pointer; box-shadow:0 0 25px rgba(168,85,247,0.4); transition:all 0.2s; display:flex; align-items:center; justify-content:center; gap:8px; }
.save-btn:hover { box-shadow:0 0 40px rgba(168,85,247,0.7); }
.save-btn.green { background:linear-gradient(135deg, #00ffaa, #06b6d4); }
.save-btn.red { background:linear-gradient(135deg, #ff3366, #a855f7); }
.save-btn.gold { background:linear-gradient(135deg, #ffd700, #ff8c00); color:#1a0a2e; }
.close-btn { position:absolute; top:14px; right:14px; background:rgba(0,0,0,0.7); color:white; border:1px solid rgba(255,255,255,0.2); width:36px; height:36px; border-radius:50%; cursor:pointer; font-size:16px; z-index:10; backdrop-filter:blur(10px); display:flex; align-items:center; justify-content:center; }
.close-btn:hover { background:rgba(255,51,102,0.5); }

/* ВСПЛЫВАШКИ */
.toast { position:fixed; bottom:24px; right:24px; background:linear-gradient(135deg, rgba(30,20,50,0.98), rgba(15,8,28,0.98)); border:1px solid rgba(168,85,247,0.4); border-radius:14px; padding:16px; box-shadow:0 0 40px rgba(168,85,247,0.5); z-index:3000; display:flex; gap:12px; align-items:center; max-width:360px; animation:slideIn 0.3s; backdrop-filter:blur(20px); }
@keyframes slideIn { from { transform:translateX(400px); opacity:0; } to { transform:translateX(0); opacity:1; } }
.toast .avatar { width:42px; height:42px; font-size:16px; }
.toast-text { flex:1; }
.toast-title { color:#e0e0ff; font-weight:700; font-size:14px; margin-bottom:4px; }
.toast-sub { color:#8b8ba7; font-size:12px; }

/* ЗВОНОК */
.call-modal { display:none; position:fixed; inset:0; background:radial-gradient(ellipse at center, rgba(30,10,60,0.98), rgba(5,0,15,0.99)); z-index:2500; align-items:center; justify-content:center; flex-direction:column; gap:20px; }
.call-modal.open { display:flex; }
.call-avatar { width:140px; height:140px; border-radius:50%; background:linear-gradient(135deg, #a855f7, #06b6d4); display:flex; align-items:center; justify-content:center; font-size:56px; color:white; font-weight:700; overflow:hidden; box-shadow:0 0 60px rgba(168,85,247,0.7), 0 0 120px rgba(6,182,212,0.4); animation:pulse 2s infinite; }
@keyframes pulse { 0%, 100% { box-shadow:0 0 60px rgba(168,85,247,0.7), 0 0 120px rgba(6,182,212,0.4); } 50% { box-shadow:0 0 80px rgba(168,85,247,0.9), 0 0 160px rgba(6,182,212,0.6); } }
.call-avatar img { width:100%; height:100%; object-fit:cover; }
.call-name { color:#e0e0ff; font-size:24px; font-weight:700; text-shadow:0 0 20px rgba(168,85,247,0.5); }
.call-status { color:#8b8ba7; font-size:14px; }
.call-actions { display:flex; gap:20px; margin-top:20px; }
.call-btn { width:64px; height:64px; border-radius:50%; border:none; cursor:pointer; font-size:24px; color:white; transition:all 0.2s; display:flex; align-items:center; justify-content:center; }
.call-btn.accept { background:linear-gradient(135deg, #00ffaa, #06b6d4); color:#0a0a12; box-shadow:0 0 30px rgba(0,255,170,0.6); }
.call-btn.decline { background:linear-gradient(135deg, #ff3366, #a855f7); box-shadow:0 0 30px rgba(255,51,102,0.6); }
.call-btn:hover { transform:scale(1.1); }

/* АДАПТИВ */
@media (max-width:768px) {
    .guilds { width:60px; padding:10px 0; }
    .guild { width:44px; height:44px; font-size:16px; }
    .sidebar { position:fixed; left:60px; top:0; bottom:0; z-index:500; transform:translateX(-120%); transition:transform 0.25s; box-shadow:8px 0 30px rgba(0,0,0,0.8); }
    .sidebar.open { transform:translateX(0); }
    .main-header .burger { display:block; }
    .messages { padding:14px 14px 0; }
    .message { gap:12px; }
    .message .avatar { width:38px; height:38px; }
    .input-area { padding:10px 14px 20px; }
    .friends-body { padding:14px 18px; }
    .overlay-backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:400; }
    .overlay-backdrop.open { display:block; }
}

::-webkit-scrollbar { width:8px; height:8px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:linear-gradient(180deg, #a855f7, #6366f1); border-radius:4px; }
::-webkit-scrollbar-thumb:hover { background:linear-gradient(180deg, #06b6d4, #a855f7); }
</style>
</head>
<body>

<div class="auth-screen" id="authScreen">
    <div class="auth-box">
        <h1>Belugacord</h1>
        <p>Войди или создай аккаунт</p>
        <div class="auth-tabs">
            <button class="auth-tab active" id="tabLogin" onclick="switchTab('login')">Вход</button>
            <button class="auth-tab" id="tabRegister" onclick="switchTab('register')">Регистрация</button>
        </div>
        <div class="auth-field">
            <label>Имя пользователя</label>
            <input type="text" id="authUsername" maxlength="32" autocomplete="off">
            <div class="auth-status" id="usernameStatus"></div>
        </div>
        <div class="auth-field">
            <label>Пароль</label>

<script>
let token = localStorage.getItem('belugacord_token') || '';
let me = null, ws = null;
let currentServerId = null, currentChannelId = null;
let currentDMUser = null;
let avatarData = null, bannerData = null, pendingAvatar = null, pendingBanner = null;
let authMode = 'login';
let pc = null, localStream = null, callTarget = null;

function switchTab(mode) {
    authMode = mode;
    document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
    document.getElementById('tabRegister').classList.toggle('active', mode === 'register');
    document.getElementById('authBtn').innerHTML = mode === 'login' ? '<svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5v10z"/></svg> Войти' : 'Зарегистрироваться';
    document.getElementById('authError').textContent = '';
}

let checkTimer = null;
function checkUsername() {
    const val = document.getElementById('authUsername').value.trim();
    const status = document.getElementById('usernameStatus');
    if (authMode !== 'register') { status.textContent = ''; return; }
    if (val.length < 2) { status.textContent = ''; return; }
    clearTimeout(checkTimer);
    checkTimer = setTimeout(async () => {
        try {
            const r = await fetch('/api/check_username?username=' + encodeURIComponent(val));
            const d = await r.json();
            if (d.available) { status.textContent = '✓ Ник свободен'; status.className = 'auth-status ok'; }
            else { status.textContent = '✕ Ник занят'; status.className = 'auth-status bad'; }
        } catch(e) { status.textContent = ''; }
    }, 400);
}
document.getElementById('authUsername').addEventListener('input', checkUsername);

async function submitAuth() {
    const username = document.getElementById('authUsername').value.trim();
    const password = document.getElementById('authPassword').value;
    const err = document.getElementById('authError');
    err.textContent = '';
    if (!username || !password) { err.textContent = 'Заполни все поля'; return; }
    const url = authMode === 'login' ? '/api/login' : '/api/register';
    try {
        const r = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username, password}) });
        const d = await r.json();
        if (!r.ok) { err.textContent = d.detail || 'Ошибка'; return; }
        token = d.token;
        localStorage.setItem('belugacord_token', token);
        me = d.user;
        enterApp();
    } catch(e) { err.textContent = 'Ошибка соединения'; }
}

function logout() {
    localStorage.removeItem('belugacord_token');
    token = ''; me = null;
    if (ws) ws.close();
    document.getElementById('app').classList.remove('active');
    document.getElementById('authScreen').style.display = 'flex';
}

async function boot() {
    if (token) {
        try {
            const r = await fetch('/api/me?token=' + encodeURIComponent(token));
            if (r.ok) { me = await r.json(); enterApp(); return; }
        } catch(e) {}
        token = ''; localStorage.removeItem('belugacord_token');
    }
    document.getElementById('authScreen').style.display = 'flex';
}

function enterApp() {
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('app').classList.add('active');
    renderProfile();
    loadServers();
    connectWS();
    showFriends();
}

function renderProfile() {
    const av = document.getElementById('userAvatarSmall');
    if (me.avatar) av.innerHTML = '<img src="' + me.avatar + '">';
    else av.textContent = me.username.charAt(0).toUpperCase();
    document.getElementById('userNameSmall').textContent = me.username;
    document.getElementById('profileName').textContent = me.username;
    avatarData = me.avatar; bannerData = me.banner;
    const bigAv = document.getElementById('avatarPreview');
    if (avatarData) bigAv.innerHTML = '<img src="' + avatarData + '">';
    else bigAv.textContent = me.username.charAt(0).toUpperCase();
    const banner = document.getElementById('bannerPreview');
    const oldImg = banner.querySelector('img');
    if (oldImg) oldImg.remove();
    if (bannerData) {
        const img = document.createElement('img');
        img.src = bannerData;
        banner.insertBefore(img, banner.firstChild);
    }
}
function openProfile() { document.getElementById('profileModal').classList.add('open'); }
function closeProfile() { document.getElementById('profileModal').classList.remove('open'); }

document.getElementById('avatarInput').addEventListener('change', (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => { pendingAvatar = ev.target.result; avatarData = pendingAvatar; renderProfile(); };
    reader.readAsDataURL(file);
});
document.getElementById('bannerInput').addEventListener('change', (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => { pendingBanner = ev.target.result; bannerData = pendingBanner; renderProfile(); };
    reader.readAsDataURL(file);
});

async function saveProfile() {
    try {
        await fetch('/api/update_profile', { method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ token, avatar: pendingAvatar, banner: pendingBanner }) });
        me.avatar = avatarData; me.banner = bannerData;
        closeProfile();
    } catch(e) { alert('Ошибка сохранения'); }
}

async function loadServers() {
    try {
        const r = await fetch('/api/servers/list?token=' + encodeURIComponent(token));
        const servers = await r.json();
        const list = document.getElementById('serverList');
        list.innerHTML = '';
        servers.forEach(s => {
            const d = document.createElement('div');
            d.className = 'guild';
            d.textContent = s.name.charAt(0).toUpperCase();
            d.title = s.name;
            d.onclick = () => openServer(s.id, s.name);
            list.appendChild(d);
        });
    } catch(e) {}
}
async function openCreateServer() {
    const name = prompt('Название сервера:');
    if (!name) return;
    try {
        const fd = new FormData(); fd.append('name', name);
        const r = await fetch('/api/servers/create?token=' + encodeURIComponent(token), { method:'POST', body: fd });
        const d = await r.json();
        if (r.ok) { loadServers(); openServer(d.id, d.name); }
        else alert(d.detail || 'Ошибка');
    } catch(e) { alert('Ошибка'); }
}
async function openJoinServer() { alert('Вход по инвайту скоро!'); }

async function openServer(id, name) {
    currentServerId = id;
    document.getElementById('sidebarTitle').textContent = name;
    document.getElementById('friendsScreen').classList.remove('active');
    document.getElementById('dmScreen').classList.remove('active');
    document.getElementById('chatScreen').style.display = 'flex';
    try {
        const r = await fetch('/api/servers/' + id + '/channels?token=' + encodeURIComponent(token));
        const channels = await r.json();
        renderChannels(channels);
        if (channels.length) openChannel(channels[0].id, channels[0].name);
    } catch(e) {}
}

function renderChannels(channels) {
    const c = document.getElementById('sidebarContent');
    c.innerHTML = '<div class="channel-cat">Каналы <span class="add" onclick="createChannel()">+</span></div>';
    channels.forEach(ch => {
        const d = document.createElement('div');
        d.className = 'channel' + (ch.id === currentChannelId ? ' active' : '');
        d.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 3h2v6h4V3h2v6h4v2h-4v6h4v2h-4v6h-2v-6h-4v6H8v-6H4v-2h4V9H4V7h4V3zm2 8v6h4V9h-4z"/></svg> ' + escapeHtml(ch.name);
        d.onclick = () => openChannel(ch.id, ch.name);
        c.appendChild(d);
    });
}

async function createChannel() {
    const name = prompt('Название канала:');
    if (!name) return;
    try {
        const fd = new FormData(); fd.append('server_id', currentServerId); fd.append('name', name);
        const r = await fetch('/api/channels/create?token=' + encodeURIComponent(token), { method:'POST', body: fd });
        if (r.ok) openServer(currentServerId, document.getElementById('sidebarTitle').textContent);
    } catch(e) {}
}

async function openChannel(id, name) {
    currentChannelId = id;
    document.getElementById('channelName').textContent = name;
    document.getElementById('chat').innerHTML = '';
    try {
        const r = await fetch('/api/channels/' + id + '/messages?token=' + encodeURIComponent(token));
        const d = await r.json();
        (d.messages || []).forEach(m => addMessage(m.username, m.text, m.avatar, m.file_url, m.created_at));
    } catch(e) {}
    if (window.innerWidth <= 768) toggleSidebar();
}

function showFriends() {
    document.getElementById('friendsScreen').classList.add('active');
    document.getElementById('chatScreen').style.display = 'none';
    document.getElementById('dmScreen').classList.remove('active');
    document.getElementById('sidebarTitle').textContent = 'Друзья';
    document.getElementById('sidebarContent').innerHTML = '';
    loadFriends();
    if (window.innerWidth <= 768) toggleSidebar();
}

async function loadFriends() {
    try {
        const r = await fetch('/api/friends/list?token=' + encodeURIComponent(token));
        const friends = await r.json();
        document.getElementById('friendsTitle').textContent = 'Друзья — ' + friends.filter(f => f.status === 'accepted').length;
        const list = document.getElementById('friendsList');
        list.innerHTML = '';
        friends.forEach(f => {
            const d = document.createElement('div');
            d.className = 'friend-row';
            const av = f.avatar ? '<img src="' + f.avatar + '">' : f.username.charAt(0).toUpperCase();
            let actions = '';
            if (f.status === 'incoming') {
                actions = '<button onclick="event.stopPropagation();acceptFriend(' + f.request_id + ')" title="Принять"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></button>';
            }
            d.innerHTML = '<div class="avatar">' + av + '</div><div style="flex:1;"><div class="friend-name">' + escapeHtml(f.username) + '</div><div class="friend-status">' + (f.status === 'accepted' ? 'в друзьях' : 'запрос') + '</div></div><div class="friend-actions">' + actions + '</div>';
            if (f.status === 'accepted') d.onclick = () => openDM(f.id, f.username, f.avatar);
            list.appendChild(d);
        });
    } catch(e) {}
}

async function addFriend() {
    const inp = document.getElementById('addFriendInput');
    const username = inp.value.trim();
    if (!username) return;
    try {
        const r = await fetch('/api/friends/request', { method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ token, username }) });
        const d = await r.json();
        if (r.ok) { alert('Запрос отправлен'); inp.value = ''; loadFriends(); }
        else alert(d.detail || 'Ошибка');
    } catch(e) { alert('Ошибка'); }
}

async function acceptFriend(id) {
    try {
        await fetch('/api/friends/accept', { method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ token, request_id: id }) });
        loadFriends();
    } catch(e) {}
}

async function openDM(userId, username, avatar) {
    currentDMUser = { id: userId, username, avatar };
    document.getElementById('dmScreen').classList.add('active');
    document.getElementById('chatScreen').style.display = 'none';
    document.getElementById('friendsScreen').classList.remove('active');
    const av = document.getElementById('dmAvatar');
    if (avatar) av.innerHTML = '<img src="' + avatar + '">';
    else av.textContent = username.charAt(0).toUpperCase();
    document.getElementById('dmName').textContent = username;
    document.getElementById('dmChat').innerHTML = '';
    try {
        const r = await fetch('/api/dm/' + userId + '/messages?token=' + encodeURIComponent(token));
        const msgs = await r.json();
        msgs.forEach(m => addDMMessage(m.username, m.text, m.avatar, m.file_url, m.created_at));
    } catch(e) {}
    if (window.innerWidth <= 768) toggleSidebar();
}

function addDMMessage(name, text, avatar, fileUrl, createdAt) {
    const chat = document.getElementById('dmChat');
    const div = document.createElement('div');
    div.className = 'message';
    const t = createdAt ? new Date(createdAt).toLocaleTimeString('ru-RU', {hour:'2-digit',minute:'2-digit'}) : new Date().toLocaleTimeString('ru-RU', {hour:'2-digit',minute:'2-digit'});
    let av = '<div class="avatar">' + name.charAt(0).toUpperCase() + '</div>';
    if (avatar) av = '<div class="avatar"><img src="' + avatar + '"></div>';
    let fileHTML = '';
    if (fileUrl) {
        const isVideo = /\.(mp4|webm|mov)$/i.test(fileUrl);
        fileHTML = isVideo ? '<video class="msg-file" controls src="' + fileUrl + '"></video>' : '<img class="msg-file" src="' + fileUrl + '">';
    }
    div.innerHTML = av + '<div class="msg-content"><div class="msg-header"><span class="username">' + escapeHtml(name) + '</span><span class="timestamp">' + t + '</span></div><div class="msg-text">' + escapeHtml(text || '') + '</div>' + fileHTML + '</div>';
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function sendDM() {
    const inp = document.getElementById('dmInp');
    const text = inp.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN || !currentDMUser) return;
    ws.send(JSON.stringify({ type:'dm', to_user: currentDMUser.id, text }));
    inp.value = '';
}
document.getElementById('dmInp').addEventListener('keydown', e => { if (e.key === 'Enter') sendDM(); });

async function uploadDMFile(input) {
    const file = input.files[0]; if (!file || !currentDMUser) return;
    const fd = new FormData();
    fd.append('token', token); fd.append('file', file);
    try {
        const r = await fetch('/api/upload', { method:'POST', body: fd });
        const d = await r.json();
        if (d.url) ws.send(JSON.stringify({ type:'dm', to_user: currentDMUser.id, text:'', file_url: d.url }));
    } catch(e) {}
    input.value = '';
}

function connectWS() {
    const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
    ws = new WebSocket(proto + location.host + '/ws?token=' + encodeURIComponent(token));
    ws.onmessage = (event) => {
        let data; try { data = JSON.parse(event.data); } catch(e) { return; }
        if (data.type === 'message') {
            if (data.channel_id === currentChannelId) addMessage(data.username, data.text, data.avatar, data.file_url, data.created_at);
        } else if (data.type === 'dm') {
            if (currentDMUser && (data.from_user === currentDMUser.id || data.to_user === currentDMUser.id)) {
                addDMMessage(data.username, data.text, data.avatar, data.file_url, data.created_at);
            }
        }
    };
    ws.onclose = () => setTimeout(connectWS, 2000);
}

function addMessage(name, text, avatar, fileUrl, createdAt) {
    const chat = document.getElementById('chat');
    const div = document.createElement('div');
    div.className = 'message';
    const t = createdAt ? new Date(createdAt).toLocaleTimeString('ru-RU', {hour:'2-digit',minute:'2-digit'}) : new Date().toLocaleTimeString('ru-RU', {hour:'2-digit',minute:'2-digit'});
    let av = '<div class="avatar">' + name.charAt(0).toUpperCase() + '</div>';
    if (avatar) av = '<div class="avatar"><img src="' + avatar + '"></div>';
    let fileHTML = '';
    if (fileUrl) {
        const isVideo = /\.(mp4|webm|mov)$/i.test(fileUrl);
        fileHTML = isVideo ? '<video class="msg-file" controls src="' + fileUrl + '"></video>' : '<img class="msg-file" src="' + fileUrl + '">';
    }
    div.innerHTML = av + '<div class="msg-content"><div class="msg-header"><span class="username">' + escapeHtml(name) + '</span><span class="timestamp">' + t + '</span></div><div class="msg-text">' + escapeHtml(text || '') + '</div>' + fileHTML + '</div>';
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function send() {
    const inp = document.getElementById('inp');
    const text = inp.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type:'message', channel_id: currentChannelId, text }));
    inp.value = '';
}
document.getElementById('inp').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

async function uploadFile(input) {
    const file = input.files[0]; if (!file) return;
    const fd = new FormData();
    fd.append('token', token); fd.append('file', file);
    try {
        const r = await fetch('/api/upload', { method:'POST', body: fd });
        const d = await r.json();
        if (d.url) ws.send(JSON.stringify({ type:'message', channel_id: currentChannelId, text:'', file_url: d.url }));
    } catch(e) {}
    input.value = '';
}

function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('backdrop').classList.toggle('open');
}

boot();
</script>
</body>
