<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>BelugaCord — Мессенджер нового поколения</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Courier New',monospace; -webkit-tap-highlight-color:transparent; }
:root { 
  --bg:#020005; --ac:#d946ef; --ac2:#8b5cf6; --ac3:#22d3ee; --gold:#ffd700; 
  --tx:#e8e0ff; --td:#9d8fc4; --tm:#6b5f8a; 
  --glass:rgba(255,255,255,.05); --gb:rgba(255,255,255,.1); 
}
body { background:var(--bg); color:var(--tx); height:100vh; overflow:hidden; display:flex; align-items:center; justify-content:center; position:relative; }
body::before { content:''; position:fixed; inset:0; background-image:linear-gradient(rgba(217,70,239,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(217,70,239,.06) 1px,transparent 1px); background-size:40px 40px; pointer-events:none; z-index:0; }
body::after { content:''; position:fixed; inset:0; background:repeating-linear-gradient(0deg,rgba(0,0,0,.15),rgba(0,0,0,.15) 1px,transparent 1px,transparent 2px); opacity:.15; pointer-events:none; z-index:100; animation:scan 8s linear infinite; }
@keyframes scan { from{background-position:0 0} to{background-position:0 100px} }

/* УГЛЫ */
.cp-corner { position:fixed; width:30px; height:30px; z-index:5; pointer-events:none; }
.cp-corner.tl { top:10px; left:10px; border-top:2px solid var(--ac3); border-left:2px solid var(--ac3); }
.cp-corner.tr { top:10px; right:10px; border-top:2px solid var(--ac3); border-right:2px solid var(--ac3); }
.cp-corner.bl { bottom:10px; left:10px; border-bottom:2px solid var(--ac3); border-left:2px solid var(--ac3); }
.cp-corner.br { bottom:10px; right:10px; border-bottom:2px solid var(--ac3); border-right:2px solid var(--ac3); }

/* ЛЕНДИНГ */
.landing { position:relative; z-index:10; text-align:center; padding:24px; max-width:600px; width:100%; }
.logo { font-size:72px; margin-bottom:10px; animation:float 3s ease-in-out infinite; text-shadow:0 0 30px rgba(217,70,239,.6); }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
.title { font-size:36px; font-weight:900; background:linear-gradient(135deg,var(--ac),var(--ac3)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; margin-bottom:12px; letter-spacing:6px; }
.subtitle { font-size:15px; color:var(--td); margin-bottom:32px; line-height:1.6; }
.buttons { display:flex; flex-direction:column; gap:14px; margin-bottom:32px; }
.btn { padding:18px; border-radius:14px; font-weight:900; font-size:15px; letter-spacing:2px; cursor:pointer; border:none; font-family:inherit; transition:all .2s; text-transform:uppercase; }
.btn-primary { background:linear-gradient(135deg,var(--ac),var(--ac2)); color:#fff; box-shadow:0 0 25px rgba(217,70,239,0.5); }
.btn-primary:hover { transform:scale(1.02); box-shadow:0 0 35px rgba(217,70,239,0.8); }
.btn-secondary { background:var(--glass); border:1px solid var(--gb); color:var(--tx); }
.btn-secondary:hover { background:rgba(255,255,255,0.1); }
.features { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:20px; }
.feature { padding:14px 10px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1); border-radius:12px; font-size:11px; color:var(--td); clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%); }
.feature span { color:var(--ac); font-weight:900; display:block; margin-bottom:4px; font-size:18px; }
.footer { position:fixed; bottom:20px; left:0; right:0; text-align:center; font-size:10px; color:var(--tm); z-index:10; letter-spacing:2px; }
</style>
</head>
<body>
<div class="cp-corner tl"></div><div class="cp-corner tr"></div><div class="cp-corner bl"></div><div class="cp-corner br"></div>

<div class="landing">
  <div class="logo">🐱</div>
  <div class="title">BELUGACORD</div>
  <div class="subtitle">Мессенджер нового поколения.<br>Анонимность, скорость и стиль в одном месте.</div>
  
  <div class="buttons">
    <button class="btn btn-primary" id="mainBtn" onclick="window.location.href='/login'">ВОЙТИ В СИСТЕМУ</button>
    <button class="btn btn-secondary" onclick="alert('📱 Мобильное приложение в разработке.\n\nПока что используйте веб-версию — она полностью функциональна!')">СКАЧАТЬ ПРИЛОЖЕНИЕ</button>
  </div>

  <div class="features">
    <div class="feature"><span>🔒</span> Полная анонимность</div>
    <div class="feature"><span>⚡</span> Мгновенные сообщения</div>
    <div class="feature"><span>🎥</span> Видеозвонки</div>
    <div class="feature"><span>🎮</span> Игры и экономика</div>
  </div>
</div>

<div class="footer">BELUGACORD 4.3 — CYBER PULSE © 2026</div>

<script>
// Проверяем, залогинен ли юзер
window.addEventListener('DOMContentLoaded', () => {
  const token = localStorage.getItem('bc_token');
  if(token) {
    // Если токен есть, меняем кнопку на "Открыть мессенджер"
    const btn = document.getElementById('mainBtn');
    btn.textContent = 'ОТКРЫТЬ МЕССЕНДЖЕР';
    btn.onclick = () => window.location.href = '/app';
  }
});
</script>
</body>
</html>
