<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Регистрация — BelugaCord</title>
<style>
:root {
  --bg: #050a05; --ac: #22c55e; --ac2: #f97316; --tx: #e8f5e9; --td: #81c784; --glass: rgba(34,197,94,0.05); --gb: rgba(34,197,94,0.15);
}
* { margin:0; padding:0; box-sizing:border-box; font-family:'Courier New',monospace; -webkit-tap-highlight-color:transparent; }
body { background:var(--bg); color:var(--tx); height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; background-image:radial-gradient(circle at 20% 20%, rgba(34,197,94,0.1), transparent 50%), radial-gradient(circle at 80% 80%, rgba(249,115,22,0.08), transparent 50%); }
.box { width:100%; max-width:400px; padding:24px; border:1px solid var(--gb); background:rgba(10,18,10,0.9); border-radius:20px; box-shadow:0 0 30px rgba(34,197,94,0.3); }
h1 { text-align:center; font-size:28px; font-weight:900; color:var(--ac2); margin-bottom:24px; letter-spacing:3px; }
input { width:100%; padding:14px 18px; background:rgba(20,16,32,0.9); border:1px solid var(--gb); color:#fff; font-size:14px; margin-bottom:12px; outline:none; border-radius:12px; }
input:focus { border-color:var(--ac); }
button { width:100%; padding:16px; background:linear-gradient(135deg,var(--ac),var(--ac2)); border:none; color:#000; font-size:15px; font-weight:900; letter-spacing:2px; cursor:pointer; border-radius:12px; margin-top:10px; }
.err { color:#dc2626; font-size:12px; text-align:center; margin-top:12px; min-height:18px; font-weight:900; }
.link { text-align:center; margin-top:18px; font-size:12px; color:var(--td); }
.link a { color:var(--ac2); text-decoration:none; font-weight:800; }
</style>
</head>
<body>
<div class="box">
  <h1>🐱 РЕГИСТРАЦИЯ</h1>
  <input type="text" id="regUser" placeholder="Username (латиница)">
  <input type="text" id="regDisplay" placeholder="Ник (отображается)">
  <input type="password" id="regPass" placeholder="Пароль (мин 4)">
  <input type="text" id="regPromo" placeholder="Промокод (необязательно)">
  <button onclick="doRegister()">СОЗДАТЬ АККАУНТ</button>
  <div class="err" id="errMsg"></div>
  <div class="link">Уже есть аккаунт? <a href="/login">Войти</a></div>
  <div class="link"><a href="/">← На главную</a></div>
</div>
<script>
async function doRegister() {
  const u = document.getElementById('regUser').value.trim();
  const d = document.getElementById('regDisplay').value.trim();
  const p = document.getElementById('regPass').value;
  const promo = document.getElementById('regPromo').value.trim();
  const err = document.getElementById('errMsg');
  err.textContent = '';
  if(!u || !p) { err.textContent = 'Заполни username и пароль'; return; }
  if(p.length < 4) { err.textContent = 'Пароль мин 4 символа'; return; }
  try {
    const r = await fetch('/api/register', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ username: u, display_name: d || u, password: p, promo_code: promo })
    });
    const data = await r.json();
    if(r.ok) {
      localStorage.setItem('bc_token', data.token);
      
      // АВТОПОДПИСКА НА КАНАЛЫ
      try {
        await fetch('/api/channels/subscribe_by_username', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ token: data.token, username: 'belugacord' }) });
        await fetch('/api/channels/subscribe_by_username', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ token: data.token, username: 'gudraworld' }) });
      } catch(e) {}
      
      window.location.href = '/app';
    } else {
      err.textContent = data.detail || 'Ошибка регистрации';
    }
  } catch(e) { err.textContent = 'Ошибка сети'; }
}
</script>
</body>
</html>
