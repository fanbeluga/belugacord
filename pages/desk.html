<style>
.desk-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(250px, 1fr)); gap:15px; }
.desk-card { background:rgba(10,18,10,0.8); border:1px solid var(--border); padding:20px; position:relative; transition:0.3s; cursor:pointer; }
.desk-card:hover { border-color:var(--ac); box-shadow:0 0 20px rgba(34,197,94,0.2); transform:translateY(-2px); }
.desk-card h2 { font-size:16px; color:var(--ac); margin-bottom:10px; display:flex; justify-content:space-between; }
.desk-card p { font-size:12px; color:var(--td); line-height:1.5; }
.desk-stat { font-size:28px; font-weight:bold; color:var(--ac2); text-shadow:var(--glow-orange); margin-top:10px; }
</style>

<div class="desk-grid">
  <div class="desk-card" onclick="navigate('dm')">
    <h2>СООБЩЕНИЯ <span>[💬]</span></h2>
    <p>Ваши зашифрованные каналы связи.</p>
    <div class="desk-stat">3 NEW</div>
  </div>
  <div class="desk-card" onclick="navigate('friends')">
    <h2>АГЕНТЫ <span>[👥]</span></h2>
    <p>Список доверенных лиц в сети.</p>
    <div class="desk-stat">12 ONLINE</div>
  </div>
  <div class="desk-card" onclick="navigate('channels')">
    <h2>ТРАНСЛЯЦИИ <span>[📢]</span></h2>
    <p>Публичные потоки данных и новости.</p>
    <div class="desk-stat">5 ACTIVE</div>
  </div>
  <div class="desk-card" onclick="navigate('me')">
    <h2>МОЙ ПРОФИЛЬ <span>[👤]</span></h2>
    <p>Данные агента, инвентарь и баланс.</p>
    <div class="desk-stat" id="deskCoins">0 🪙</div>
  </div>
</div>

<script>
function init_desk() {
  if (window.me) {
      document.getElementById('deskCoins').innerText = window.me.coins + ' 🪙';
  }
}
</script>
