<div style="padding:16px; height:100%; overflow-y:auto; box-sizing:border-box;">

<style>
.d-icon { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:12px 6px; background:var(--glass); border:1px solid var(--gb); border-radius:14px; cursor:pointer; text-align:center; gap:6px; transition:0.2s; }
.d-icon:active { background:rgba(34,197,94,.15); border-color:var(--ac); }
.d-icon .ic { width:40px; height:40px; display:flex; align-items:center; justify-content:center; font-size:22px; background:rgba(34,197,94,.1); border-radius:12px; }
.d-icon .nm { font-size:10px; color:var(--td); font-weight:700; line-height:1.2; }
</style>

<script>
function init_desk() {
  fetch('/api/me?token=' + token)
    .then(r => r.json())
    .then(u => {
      const h = document.getElementById('deskHello');
      if(h) h.textContent = 'Привет, ' + (u.display_name || u.username) + ' 👋';
    }).catch(()=>{});
}
</script>
