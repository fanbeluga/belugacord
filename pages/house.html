<div style="position:relative; width:100%; height:100%; overflow:hidden; background:linear-gradient(180deg,#171a21,#0f1115); touch-action:none;" id="houseStage">
  <!-- Шапка -->
  <div style="position:absolute; top:0; left:0; right:0; padding:12px 14px; padding-top:calc(12px + env(safe-area-inset-top)); display:flex; align-items:center; gap:10px; background:linear-gradient(180deg, rgba(15,17,21,.9), transparent); z-index:10;">
    <button onclick="navigate('desk')" style="width:44px; height:44px; border-radius:14px; background:rgba(255,255,255,.12); color:#fff; font-size:20px; display:flex; align-items:center; justify-content:center; border:none; cursor:pointer;">←</button>
    <div id="houseTitle" style="flex:1; color:#fff; font-weight:900; font-size:15px;">🏠 Мой дом</div>
    <button onclick="openHouseShop()" style="width:44px; height:44px; border-radius:14px; background:rgba(255,255,255,.12); color:#fff; font-size:20px; display:flex; align-items:center; justify-content:center; border:none; cursor:pointer;">🛒</button>
  </div>
  
  <div id="houseItems" style="position:absolute; inset:0;"></div>
</div>

<style>
.house-item {
  position:absolute; font-size:40px; transform:translate(-50%,-50%);
  cursor:pointer; user-select:none; touch-action:none; z-index:5;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.5));
}
</style>

<script>
let houseData = null;

async function openHouse() {
  const box = document.getElementById('houseItems');
  if(box) box.innerHTML = '<div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px;">⏳</div>';
  
  try {
    const r = await fetch('/api/house/my?token=' + token);
    houseData = await r.json();
    if(!r.ok) { alert('Ошибка загрузки дома'); return; }
    
    document.getElementById('houseTitle').textContent = '🏠 ' + (houseData.name || 'Мой дом');
    renderHouseItems();
  } catch(e) { alert('Ошибка сети'); }
}

function renderHouseItems() {
  const box = document.getElementById('houseItems');
  if(!box) return;
  box.innerHTML = '';
  
  if(!houseData || !houseData.items || !houseData.items.length) {
    box.innerHTML = '<div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px; text-align:center; padding:20px;">Дом пуст<br><br>Купи мебель 🛒</div>';
    return;
  }
  
  const cat = { "sofa": "🛋️", "table": "🪑", "bed": "🛏️", "tv": "📺", "plant": "🪴", "lamp": "💡", "carpet": "🟫", "fridge": "🧊", "flashlight": "🔦" };
  
  houseData.items.forEach(it => {
    const el = document.createElement('div');
    el.className = 'house-item';
    el.style.left = it.x + '%';
    el.style.top = it.y + '%';
    el.textContent = cat[it.item_id] || '📦';
    
    let isDragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
    
    el.addEventListener('pointerdown', (e) => {
      isDragging = true; sx = e.clientX; sy = e.clientY;
      ox = parseFloat(el.style.left) || 50; oy = parseFloat(el.style.top) || 50;
      try { el.setPointerCapture(e.pointerId); } catch(ex) {}
      e.preventDefault();
    }, { passive: false });
    
    el.addEventListener('pointermove', (e) => {
      if(!isDragging) return;
      const parent = box.getBoundingClientRect();
      const dx = ((e.clientX - sx) / parent.width) * 100;
      const dy = ((e.clientY - sy) / parent.height) * 100;
      el.style.left = Math.max(5, Math.min(95, ox + dx)) + '%';
      el.style.top = Math.max(5, Math.min(95, oy + dy)) + '%';
    }, { passive: false });
    
    el.addEventListener('pointerup', () => {
      if(!isDragging) return;
      isDragging = false;
      const nx = parseFloat(el.style.left) || 50;
      const ny = parseFloat(el.style.top) || 50;
      fetch('/api/house/place', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ token, item_row_id: it.id, x: nx, y: ny, rot: 0 }) }).catch(()=>{});
    }, { passive: false });
    
    box.appendChild(el);
  });
}

async function openHouseShop() {
  const name = prompt('Что купить? (sofa, table, bed, tv, plant, lamp)');
  if(!name) return;
  try {
    const r = await fetch('/api/house/buy', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ token, item_id: name }) });
    const d = await r.json();
    if(r.ok) { alert('✅ Куплено'); openHouse(); }
    else { alert('❌ ' + (d.detail || 'Ошибка')); }
  } catch(e) { alert('❌ Ошибка'); }
}

function init_house() { openHouse(); }
</script>
