<div style="padding:20px; height:100%; overflow-y:auto; background:var(--bg);">
  <!-- Шапка профиля -->
  <div style="text-align:center; margin-bottom:24px;">
    <div id="meAv" onclick="document.getElementById('avatarInput').click()" style="width:110px; height:110px; border-radius:50%; background:linear-gradient(135deg, var(--ac), var(--ac2)); margin:0 auto 16px; display:flex; align-items:center; justify-content:center; font-size:40px; font-weight:900; color:#000; overflow:hidden; cursor:pointer; border:4px solid var(--bg2); box-shadow:0 0 20px rgba(34,197,94,0.3);">?</div>
    <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="uploadAvatar(this)">
    
    <h2 id="meName" style="font-size:22px; font-weight:900; color:var(--tx); margin-bottom:4px;">Юзер</h2>
    <div id="meUser" style="color:var(--ac); font-size:14px; font-weight:700;">@username</div>
    
    <button onclick="document.getElementById('avatarInput').click()" style="margin-top:12px; padding:8px 16px; background:var(--glass); border:1px solid var(--gb); color:var(--tx); border-radius:20px; font-size:12px; cursor:pointer;">📷 Сменить аватарку</button>
  </div>

  <!-- Статистика -->
  <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-bottom:24px;">
    <div style="background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:12px; text-align:center;">
      <div id="meCoins" style="font-size:20px; font-weight:900; color:var(--gold);">0</div>
      <div style="font-size:10px; color:var(--td);">Бекоины</div>
    </div>
    <div style="background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:12px; text-align:center;">
      <div id="meLevel" style="font-size:20px; font-weight:900; color:var(--ac3);">1</div>
      <div style="font-size:10px; color:var(--td);">Уровень</div>
    </div>
    <div style="background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:12px; text-align:center;">
      <div id="meMsgs" style="font-size:20px; font-weight:900; color:var(--ac);">0</div>
      <div style="font-size:10px; color:var(--td);">Сообщений</div>
    </div>
  </div>

  <!-- Кнопки меню -->
  <div style="display:flex; flex-direction:column; gap:8px;">
    <div onclick="openWall()" style="padding:14px; background:var(--bg2); border:1px solid var(--border); border-radius:12px; display:flex; align-items:center; gap:12px; cursor:pointer;">
      <div style="font-size:20px;">💬</div>
      <div style="flex:1; font-weight:700; color:var(--tx);">Моя стена</div>
      <div style="color:var(--td);">›</div>
    </div>
    <div onclick="openPremium()" style="padding:14px; background:var(--bg2); border:1px solid var(--border); border-radius:12px; display:flex; align-items:center; gap:12px; cursor:pointer;">
      <div style="font-size:20px;">💎</div>
      <div style="flex:1; font-weight:700; color:var(--tx);">Премиум</div>
      <div style="color:var(--td);">›</div>
    </div>
    <div onclick="navigate('settings')" style="padding:14px; background:var(--bg2); border:1px solid var(--border); border-radius:12px; display:flex; align-items:center; gap:12px; cursor:pointer;">
      <div style="font-size:20px;">⚙️</div>
      <div style="flex:1; font-weight:700; color:var(--tx);">Настройки</div>
      <div style="color:var(--td);">›</div>
    </div>
    <div onclick="logout()" style="padding:14px; background:rgba(220,38,38,0.1); border:1px solid #dc2626; border-radius:12px; display:flex; align-items:center; gap:12px; cursor:pointer; margin-top:12px;">
      <div style="font-size:20px;">🚪</div>
      <div style="flex:1; font-weight:700; color:#dc2626;">Выйти</div>
      <div style="color:#dc2626;">›</div>
    </div>
  </div>
</div>

<script>
async function loadMe() {
  try {
    const r = await fetch('/api/me?token=' + token);
    const u = await r.json();
    const avSrc = u.gif_avatar || u.avatar;
    const av = document.getElementById('meAv');
    if(avSrc) av.innerHTML = `<img src="${esc(avSrc)}" style="width:100%;height:100%;object-fit:cover">`;
    else av.textContent = (u.display_name || u.username).charAt(0).toUpperCase();
    
    document.getElementById('meName').textContent = u.display_name || u.username;
    document.getElementById('meUser').textContent = '@' + u.username;
    document.getElementById('meCoins').textContent = u.coins || 0;
    document.getElementById('meLevel').textContent = u.level || 1;
    document.getElementById('meMsgs').textContent = u.messages_count || 0;
  } catch(e) { console.error(e); }
}

async function uploadAvatar(input) {
  const f = input.files[0]; if(!f) return;
  const fd = new FormData(); fd.append('token', token); fd.append('file', f);
  alert('Загрузка...');
  try {
    const r = await fetch('/api/upload_avatar', { method: 'POST', body: fd });
    const d = await r.json();
    if(r.ok) { alert('✅ Аватарка обновлена'); loadMe(); }
    else alert('❌ ' + (d.detail || 'Ошибка'));
  } catch(e) { alert('❌ Ошибка сети'); }
  input.value = '';
}

function openWall() { alert('Стена профиля скоро'); }
function init_me() { loadMe(); }
</script>
