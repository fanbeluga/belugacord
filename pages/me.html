<style>
.profile-grid { display:grid; grid-template-columns:1fr 1fr; gap:15px; }
.dossier-card { background:rgba(10,18,10,0.8); border:1px solid var(--border); padding:20px; position:relative; }
.dossier-card::after { content:''; position:absolute; bottom:0; right:0; width:20px; height:20px; border-bottom:2px solid var(--ac2); border-right:2px solid var(--ac2); }
.dossier-title { font-size:12px; color:var(--ac); text-transform:uppercase; margin-bottom:15px; border-bottom:1px dashed var(--border); padding-bottom:5px; }
.dossier-val { font-size:24px; color:var(--tx); font-weight:bold; text-shadow:var(--glow); }
.dossier-sub { font-size:11px; color:var(--td); margin-top:5px; }
.avatar-box { width:100px; height:100px; border:2px solid var(--ac); background:#000; display:flex; align-items:center; justify-content:center; font-size:40px; margin-bottom:15px; position:relative; }
.avatar-box img { width:100%; height:100%; object-fit:cover; }
</style>

<div class="profile-grid">
  <!-- Левая колонка: Основная инфа -->
  <div class="dossier-card" style="grid-column: span 2; display:flex; gap:20px; align-items:center;">
    <div class="avatar-box" id="meAvatar">👤</div>
    <div>
      <div style="font-size:20px; color:var(--ac); font-weight:bold;" id="meName">@username</div>
      <div style="font-size:12px; color:var(--td); margin-top:5px;" id="meStatus">Status: Active</div>
      <div style="font-size:12px; color:var(--ac2); margin-top:10px;">ID: <span id="meId">---</span></div>
    </div>
  </div>

  <!-- Баланс -->
  <div class="dossier-card">
    <div class="dossier-title">Крипто-баланс</div>
    <div class="dossier-val" id="meCoins">0 🪙</div>
    <div class="dossier-sub">BelugaCoins</div>
  </div>
  
  <!-- Уровень -->
  <div class="dossier-card">
    <div class="dossier-title">Ранг</div>
    <div class="dossier-val" id="meLevel">1 LVL</div>
    <div class="dossier-sub">XP: <span id="meXp">0</span></div>
  </div>

  <!-- Кнопка перехода в магазин -->
  <div class="dossier-card" style="grid-column: span 2; cursor:pointer;" onclick="navigate('shop')">
    <div class="dossier-title" style="color:var(--ac2);">Магазин снаряжения</div>
    <div style="font-size:14px;">Купить подарки, рамки и премиум →</div>
  </div>
</div>

<script>
function init_me() {
  if (!window.me) return;
  document.getElementById('meName').innerText = '@' + window.me.username;
  document.getElementById('meId').innerText = window.me.id;
  document.getElementById('meCoins').innerText = window.me.coins + ' 🪙';
  document.getElementById('meLevel').innerText = window.me.level + ' LVL';
  document.getElementById('meXp').innerText = window.me.xp;
  
  if (window.me.avatar) {
    document.getElementById('meAvatar').innerHTML = `<img src="${window.me.avatar}">`;
  }
}
</script>
