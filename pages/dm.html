<div style="display:flex; height:100%; width:100%; background:var(--bg);">
  <!-- СПИСОК ЧАТОВ (СЛЕВА) -->
  <div id="dmPanel" style="width:100%; height:100%; display:flex; flex-direction:column; background:var(--bg2); border-right:1px solid var(--border);">
    <div style="padding:16px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px;">
      <div style="font-weight:900; font-size:18px; color:var(--ac);">💬 Чаты</div>
      <div style="flex:1;"></div>
    </div>
    
    <div style="padding:8px 12px; border-bottom:1px solid var(--border);">
      <input type="text" placeholder="🔍 Поиск..." style="width:100%; padding:10px 14px; background:var(--glass); border:1px solid var(--gb); border-radius:10px; color:var(--tx); outline:none; font-size:13px;">
    </div>

    <div id="dmList" style="flex:1; overflow-y:auto; padding:8px;">
      <div style="padding:40px; text-align:center; color:var(--td);">Загрузка...</div>
    </div>
  </div>

  <!-- ОКНО ЧАТА (СПРАВА) -->
  <div id="chatWindow" class="chat-window" style="flex:1; display:none; flex-direction:column; background:var(--bg);">
    <div style="height:60px; padding:0 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; background:var(--bg2);">
      <button onclick="closeChat()" style="background:none; border:none; color:var(--ac); font-size:24px; cursor:pointer; padding:8px;">←</button>
      <div id="chatTitle" style="font-weight:700; font-size:16px; color:var(--tx);">Чат</div>
      <button onclick="startCall()" style="margin-left:auto; background:none; border:none; color:var(--ac2); font-size:20px; cursor:pointer; padding:8px;">📞</button>
    </div>
    
    <div id="chatBody" style="flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:8px;"></div>
    
    <div style="padding:12px; border-top:1px solid var(--border); background:var(--bg2); display:flex; gap:8px; align-items:center; padding-bottom:calc(12px + env(safe-area-inset-bottom));">
      <input type="text" id="msgInput" placeholder="Сообщение..." style="flex:1; background:var(--bg3); border:1px solid var(--border); border-radius:20px; padding:12px 16px; color:var(--tx); outline:none; font-size:14px;" onkeydown="if(event.key==='Enter')sendMsg()">
      <button onclick="sendMsg()" style="background:linear-gradient(135deg,var(--ac),var(--ac2)); border:none; width:44px; height:44px; border-radius:50%; color:#000; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center;">➤</button>
    </div>
  </div>
</div>

<script>
let curDM = null;

async function loadDMList() {
  const box = document.getElementById('dmList');
  box.innerHTML = '<div style="padding:40px; text-align:center; color:var(--td);">Загрузка...</div>';
  
  try {
    const r = await fetch('/api/friends/list?token=' + token);
    if(!r.ok) throw new Error('Ошибка сервера');
    const friends = await r.json();
    
    const accepted = Array.isArray(friends) ? friends.filter(f => f.status === 'accepted') : [];
    
    if(!accepted.length) {
      box.innerHTML = '<div style="padding:40px; text-align:center; color:var(--td);">Нет друзей</div>';
      return;
    }

    box.innerHTML = '';
    accepted.forEach(f => {
      const d = document.createElement('div');
      d.className = 'dm-item'; // Класс из app.html
      // Если стилей нет, добавим инлайн
      d.style.cssText = 'display:flex; align-items:center; gap:12px; padding:12px; border-radius:12px; margin-bottom:4px; background:var(--glass); border:1px solid var(--gb); cursor:pointer;';
      
      const av = f.avatar ? `<img src="${esc(f.avatar)}" style="width:100%;height:100%;object-fit:cover;">` : esc((f.display_name || f.username).charAt(0).toUpperCase());
      d.innerHTML = `
        <div style="width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;font-size:20px;flex-shrink:0;overflow:hidden;">${av}</div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:15px;font-weight:700;color:var(--tx);">${esc(f.display_name || f.username)}</div>
          <div style="font-size:12px;color:var(--td);">@${esc(f.username)}</div>
        </div>
      `;
      d.onclick = () => openDM(f); 
      box.appendChild(d);
    });
  } catch(e) {
    console.error(e);
    box.innerHTML = '<div style="padding:40px; text-align:center; color:#dc2626;">Ошибка загрузки</div>';
  }
}

async function openDM(user) {
  if(!user) return;
  curDM = user;
  
  document.getElementById('dmPanel').style.display = 'none'; // Скрываем список
  document.getElementById('chatWindow').style.display = 'flex'; // Показываем чат
  document.getElementById('chatTitle').textContent = user.display_name || user.username;
  
  const body = document.getElementById('chatBody');
  body.innerHTML = '<div style="text-align:center; color:var(--td);">Загрузка...</div>';
  
  try {
    const r = await fetch('/api/dm/' + user.id + '/messages?token=' + token);
    const msgs = await r.json();
    body.innerHTML = '';
    if(Array.isArray(msgs)) msgs.forEach(m => addMsg(m));
  } catch(e) { body.innerHTML = 'Ошибка загрузки'; }
}

function addMsg(m) {
  const body = document.getElementById('chatBody');
  const isMe = m.from_user === me.id;
  const d = document.createElement('div');
  d.style.cssText = `display:flex; gap:10px; align-items:flex-end; max-width:85%; margin-bottom:4px; ${isMe ? 'align-self:flex-end; flex-direction:row-reverse;' : ''}`;
  
  const time = new Date(m.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
  const av = (m.display_name || m.username || '?').charAt(0).toUpperCase();
  
  d.innerHTML = `
    <div style="width:34px;height:34px;border-radius:10px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--td);font-size:14px;flex-shrink:0;">${esc(av)}</div>
    <div style="display:flex; flex-direction:column; ${isMe ? 'align-items:flex-end;' : ''}">
      <div style="display:flex; gap:8px; margin-bottom:4px; font-size:12px; color:var(--td);">
        <span style="font-weight:600; color:var(--ac2);">${esc(m.display_name || m.username || '?')}</span>
        <span>${time}</span>
      </div>
      <div style="font-size:15px; line-height:1.5; padding:10px 14px; border-radius:12px; word-break:break-word; background:${isMe ? 'var(--msg-out)' : 'var(--msg-in)'}; color:var(--tx); border:1px solid ${isMe ? 'transparent' : 'var(--border)'};">${esc(m.text || '')}</div>
    </div>
  `;
  body.appendChild(d);
  body.scrollTop = body.scrollHeight;
}

function closeChat() {
  document.getElementById('dmPanel').style.display = 'flex';
  document.getElementById('chatWindow').style.display = 'none';
  curDM = null;
}

function sendMsg() {
  const inp = document.getElementById('msgInput');
  const text = inp.value.trim();
  if(!text || !curDM) return;
  
  wsSend({ type: 'dm', to_user: curDM.id, text: text });
  inp.value = '';
}

function init_dm() { loadDMList(); }
</script>
