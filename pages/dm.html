<style>
.dm-container { display:flex; flex-direction:column; height:100%; border:1px solid var(--border); background:rgba(0,0,0,0.6); }
.dm-header { padding:15px; border-bottom:1px solid var(--border); background:rgba(34,197,94,0.1); display:flex; justify-content:space-between; align-items:center; }
.dm-header h2 { font-size:16px; color:var(--ac); }
.dm-messages { flex:1; padding:15px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; font-size:13px; }
.msg-line { display:flex; gap:10px; }
.msg-time { color:var(--td); font-size:11px; min-width:60px; }
.msg-author { color:var(--ac2); font-weight:bold; min-width:80px; }
.msg-text { color:var(--tx); word-break:break-word; }
.msg-input { padding:15px; border-top:1px solid var(--border); display:flex; gap:10px; }
.msg-input input { flex:1; background:rgba(0,0,0,0.8); border:1px solid var(--border); color:var(--ac); padding:10px; font-family:inherit; outline:none; }
.msg-input button { background:var(--ac); color:#000; border:none; padding:10px 20px; font-weight:bold; cursor:pointer; }
</style>

<div class="dm-container">
  <div class="dm-header">
    <h2>// КАНАЛ СВЯЗИ: _fan_beluga_</h2>
    <span style="color:var(--ac); font-size:12px;">[ SECURE ]</span>
  </div>
  <div class="dm-messages" id="dmMessages">
    <div class="msg-line"><span class="msg-time">12:00</span><span class="msg-author">SYSTEM:</span><span class="msg-text">Соединение установлено.</span></div>
    <div class="msg-line"><span class="msg-time">12:01</span><span class="msg-author">_fan_beluga_:</span><span class="msg-text">Привет, агент. Как дела?</span></div>
  </div>
  <div class="msg-input">
    <input type="text" id="dmInput" placeholder="Введите сообщение..." onkeydown="if(event.key==='Enter') sendDM()">
    <button onclick="sendDM()">SEND</button>
  </div>
</div>

<script>
function init_dm() {
    // Прокрутка вниз
    const msgs = document.getElementById('dmMessages');
    msgs.scrollTop = msgs.scrollHeight;
}

function sendDM() {
    const input = document.getElementById('dmInput');
    const text = input.value.trim();
    if(!text) return;
    
    // Добавляем сообщение на экран
    const msgs = document.getElementById('dmMessages');
    const time = new Date().toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
    msgs.innerHTML += `<div class="msg-line"><span class="msg-time">${time}</span><span class="msg-author">ВЫ:</span><span class="msg-text">${text}</span></div>`;
    
    input.value = '';
    msgs.scrollTop = msgs.scrollHeight;
    
    // Здесь потом добавишь отправку через WS
    // wsSend({type: 'dm', to: 'user_id', text: text});
}
</script>
