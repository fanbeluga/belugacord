<div style="flex:1; display:flex; flex-direction:column; height:100%; background:var(--bg);">
  <!-- Заголовок -->
  <div style="padding:16px; border-bottom:1px solid var(--gb); display:flex; align-items:center; gap:12px; background:var(--bg2);">
    <button onclick="closeApp()" style="background:none; border:none; color:var(--ac3); font-size:24px; cursor:pointer;">←</button>
    <div style="font-weight:900; font-size:18px; color:var(--tx);">📢 Каналы</div>
    <button onclick="alert('Создать канал')" style="margin-left:auto; background:linear-gradient(135deg,var(--ac),var(--ac2)); border:none; color:#000; padding:8px 16px; border-radius:12px; font-weight:900; font-size:12px; cursor:pointer;">＋</button>
  </div>

  <!-- Список -->
  <div id="channelsList" style="flex:1; overflow-y:auto; padding:12px;">
    <div style="text-align:center; color:var(--tm); padding:40px;">Загрузка...</div>
  </div>
</div>

<script>
async function loadChannels() {
  const box = document.getElementById('channelsList');
  try {
    const r = await fetch('/api/channels/my?token=' + token);
    const arr = await r.json();
    if(!Array.isArray(arr) || !arr.length) { box.innerHTML = '<div style="text-align:center; color:var(--tm); padding:40px;">Нет каналов</div>'; return; }
    box.innerHTML = '';
    arr.forEach(c => {
      const d = document.createElement('div');
      d.style.cssText = 'display:flex; align-items:center; gap:12px; padding:14px; background:var(--glass); border:1px solid var(--gb); border-radius:16px; margin-bottom:8px; cursor:pointer;';
      d.innerHTML = `
        <div style="width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#22c55e,#f97316);display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;">${c.avatar ? `<img src="${esc(c.avatar)}" style="width:100%;height:100%;object-fit:cover">` : '📢'}</div>
        <div style="flex:1;min-width:0;">
          <div style="font-weight:800;font-size:15px;color:var(--tx);">${esc(c.name)}</div>
          <div style="font-size:11px;color:var(--td);">@${esc(c.username||'')} · ${c.subscribers_count||0} подп.</div>
        </div>
      `;
      box.appendChild(d);
    });
  } catch(e) { box.innerHTML = 'Ошибка'; }
}
function init_channels() { loadChannels(); }
</script>
