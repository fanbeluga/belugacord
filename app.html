<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>BelugaCord x GudraWorld</title>
<style>
:root {
  --bg: #050a05; --bg2: #0a120a; --bg3: #121a12;
  --ac: #22c55e; --ac2: #f97316; --ac3: #4ade80;
  --tx: #e8f5e9; --td: #81c784; --tm: #4caf50;
  --glass: rgba(34,197,94,0.05); --gb: rgba(34,197,94,0.15);
  --border: rgba(34,197,94,0.15); --msg-in: rgba(34,197,94,0.08); --msg-out: rgba(249,115,22,0.15);
}
* { margin:0; padding:0; box-sizing:border-box; font-family:'Courier New',monospace; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; overflow:hidden; background:var(--bg); color:var(--tx); }
body::before { content:''; position:fixed; inset:0; background-image:linear-gradient(rgba(34,197,94,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(34,197,94,.06) 1px,transparent 1px); background-size:40px 40px; pointer-events:none; z-index:0; }
body::after { content:''; position:fixed; inset:0; background:repeating-linear-gradient(0deg,rgba(0,0,0,.15),rgba(0,0,0,.15) 1px,transparent 1px,transparent 2px); opacity:.15; pointer-events:none; z-index:100; animation:cp-scan 8s linear infinite; }
@keyframes cp-scan { from{background-position:0 0} to{background-position:0 100px} }

.cp-corner { position:fixed; width:30px; height:30px; z-index:5; pointer-events:none; }
.cp-corner.tl { top:10px; left:10px; border-top:2px solid var(--ac); border-left:2px solid var(--ac); }
.cp-corner.tr { top:10px; right:10px; border-top:2px solid var(--ac); border-right:2px solid var(--ac); }
.cp-corner.bl { bottom:10px; left:10px; border-bottom:2px solid var(--ac2); border-left:2px solid var(--ac2); }
.cp-corner.br { bottom:10px; right:10px; border-bottom:2px solid var(--ac2); border-right:2px solid var(--ac2); }

#topBar { height:60px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; background:rgba(10,18,10,.9); border-bottom:1px solid rgba(34,197,94,.3); z-index:20; backdrop-filter:blur(10px); flex-shrink:0; padding-top:env(safe-area-inset-top); }
.tb-logo { font-size:18px; font-weight:900; color:var(--ac); text-shadow:0 0 15px rgba(34,197,94,.6); letter-spacing:2px; cursor:pointer; }
.tb-tabs { display:flex; gap:6px; flex:1; justify-content:center; }
.tb-tab { display:flex; flex-direction:column; align-items:center; justify-content:center; width:44px; height:44px; background:rgba(20,16,32,.8); border:1px solid rgba(34,197,94,.2); color:var(--td); transition:all .2s; clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%); cursor:pointer; }
.tb-tab .ic { font-size:18px; }
.tb-tab span:not(.ic):not(.badge) { display:none; }
.tb-tab.on { background:rgba(34,197,94,.2); border-color:var(--ac); color:#fff; box-shadow:0 0 15px rgba(34,197,94,.6); }
.tb-act { display:flex; gap:6px; }
.tb-ico { width:40px; height:40px; display:flex; align-items:center; justify-content:center; background:rgba(20,16,32,.8); border:1px solid rgba(34,197,94,.2); color:var(--td); font-size:18px; clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%); cursor:pointer; }
#appContent { flex:1; overflow-y:auto; position:relative; z-index:10; display:flex; flex-direction:column; }
.loading { display:flex; align-items:center; justify-content:center; height:100%; color:var(--td); font-size:14px; }
.spinner { width:40px; height:40px; border:3px solid rgba(34,197,94,.3); border-top-color:var(--ac); border-radius:50%; animation:spin 1s linear infinite; margin-right:12px; }
@keyframes spin { to { transform:rotate(360deg); } }

#bottomNav { display:none; height:64px; background:rgba(10,18,10,.98); border-top:1px solid rgba(34,197,94,.3); justify-content:space-around; align-items:center; flex-shrink:0; padding-bottom:env(safe-area-inset-bottom); z-index:20; }
.bn-item { display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--td); font-size:10px; cursor:pointer; }
.bn-item .ic { font-size:22px; }
.bn-item.active { color:var(--ac); text-shadow:0 0 10px rgba(34,197,94,.5); }

@media (max-width: 768px) {
  #bottomNav { display:flex; }
  .tb-tabs { display:none; }
}
</style>
</head>
<body>
<div class="cp-corner tl"></div><div class="cp-corner tr"></div><div class="cp-corner bl"></div><div class="cp-corner br"></div>

<div id="topBar">
  <div class="tb-logo" onclick="navigate('desk')">BELUGA</div>
  <div class="tb-tabs">
    <div class="tb-tab" data-page="dm" onclick="navigate('dm')"><span class="ic">💬</span></div>
    <div class="tb-tab" data-page="friends" onclick="navigate('friends')"><span class="ic">👥</span></div>
    <div class="tb-tab" data-page="channels" onclick="navigate('channels')"><span class="ic">📢</span></div>
    <div class="tb-tab" data-page="street" onclick="navigate('street')"><span class="ic">🌆</span></div>
    <div class="tb-tab" data-page="desk" onclick="navigate('desk')"><span class="ic">🖥️</span></div>
    <div class="tb-tab" data-page="me" onclick="navigate('me')"><span class="ic">👤</span></div>
  </div>
  <div class="tb-act">
    <div class="tb-ico" onclick="navigate('desk')">🔍</div>
    <div class="tb-ico" onclick="navigate('desk')">☰</div>
  </div>
</div>

<div id="appContent">
  <div class="loading"><div class="spinner"></div> Загрузка...</div>
</div>

<div id="bottomNav">
  <div class="bn-item" onclick="navigate('dm')"><div class="ic">💬</div><div>Чаты</div></div>
  <div class="bn-item" onclick="navigate('friends')"><div class="ic">👥</div><div>Друзья</div></div>
  <div class="bn-item" onclick="navigate('channels')"><div class="ic">📢</div><div>Каналы</div></div>
  <div class="bn-item" onclick="navigate('me')"><div class="ic">👤</div><div>Профиль</div></div>
</div>

<script>
// 1. Проверка токена (без редиректа, если он есть)
const token = localStorage.getItem('bc_token');
if (!token) {
    window.location.href = '/login';
}

// Глобальные переменные
let me = null;
let ws = null;
let offlineQ = [];
let curPage = null;
let ICE_SERVERS = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

function g(id) { return document.getElementById(id); }
function esc(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function wsSend(p) { const j = JSON.stringify(p); if(ws && ws.readyState === 1) ws.send(j); else offlineQ.push(j); }

// 2. WebSocket подключение
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  ws = new WebSocket(proto + location.host + '/ws?token=' + encodeURIComponent(token));
  ws.onopen = function() { while(offlineQ.length) { ws.send(offlineQ.shift()); } };
  ws.onmessage = function(ev) { 
    try { 
      const d = JSON.parse(ev.data); 
      if (typeof handlePageWS === 'function') handlePageWS(d); 
    } catch(e) {} 
  };
  ws.onclose = function() { setTimeout(connectWS, 3000); };
}

// 3. Навигация по страницам
async function navigate(page) {
  if (curPage === page) return;
  curPage = page;
  
  // Подсветка активной вкладки
  document.querySelectorAll('.tb-tab').forEach(t => t.classList.toggle('on', t.dataset.page === page));
  
  const container = g('appContent');
  container.innerHTML = '<div class="loading"><div class="spinner"></div> Загрузка...</div>';
  
  // Меняем URL без перезагрузки страницы
  history.pushState(null, '', '/app/' + page);
  
  try {
    const r = await fetch('/pages/' + page + '.html');
    if (!r.ok) throw new Error('404');
    const html = await r.text();
    container.innerHTML = html;
    
    // Перезапускаем скрипты внутри загруженной страницы
    const scripts = container.querySelectorAll('script');
    scripts.forEach(oldScript => {
      const newScript = document.createElement('script');
      Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
      newScript.appendChild(document.createTextNode(oldScript.innerHTML));
      oldScript.parentNode.replaceChild(newScript, oldScript);
    });

    // Вызываем функцию инициализации страницы (например, init_desk)
    const initFn = window['init_' + page];
    if (typeof initFn === 'function') initFn();

  } catch(e) {
    container.innerHTML = '<div style="text-align:center;padding:40px;color:#dc2626;">Ошибка загрузки страницы</div>';
    console.error(e);
  }
}

// 4. Старт приложения
window.addEventListener('DOMContentLoaded', async () => {
  // Проверяем токен у сервера
  try {
    const r = await fetch('/api/me', {
        method: 'GET',
        headers: { 
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
        }
    });
    
    if (!r.ok) {
        throw new Error('Unauthorized');
    }
    
    me = await r.json();
    console.log("Успешный вход! Профиль:", me);
    
  } catch(e) {
    console.error("Ошибка авторизации:", e);
    localStorage.removeItem('bc_token');
    window.location.href = '/login';
    return;
  }

  // Пытаемся получить настройки WebRTC (если есть)
  try {
    const iceR = await fetch('/api/webrtc/config');
    if (iceR.ok) {
      const iceD = await iceR.json();
      if (iceD.iceServers) ICE_SERVERS = { iceServers: iceD.iceServers };
    }
  } catch(e) {}

  // Подключаем WebSocket и открываем десктоп
  connectWS();
  const urlPage = location.pathname.split('/').pop();
  const startPage = urlPage && urlPage !== 'app' ? urlPage : 'desk';
  navigate(startPage);
});

// 5. Обработка кнопок "Назад/Вперед" в браузере
window.addEventListener('popstate', () => {
  const urlPage = location.pathname.split('/').pop();
  if (urlPage) navigate(urlPage);
});
</script>
</body>
</html>
