<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>BELUGA // TERMINAL</title>
<style>
:root {
  --bg: #030603; --panel: rgba(10,18,10,0.85); --border: rgba(34,197,94,0.2);
  --ac: #22c55e; --ac2: #f97316; --tx: #e8f5e9; --td: #81c784;
  --glow: 0 0 10px rgba(34,197,94,0.4); --glow-orange: 0 0 15px rgba(249,115,22,0.4);
}
* { margin:0; padding:0; box-sizing:border-box; font-family:'Courier New',monospace; -webkit-tap-highlight-color:transparent; }
body { height:100vh; overflow:hidden; background:var(--bg); color:var(--tx); display:flex; flex-direction:column; }
/* Сетка на фоне */
body::before { content:''; position:fixed; inset:0; background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px); background-size:20px 20px; opacity:0.3; z-index:0; pointer-events:none; }
/* Эффект сканирования */
body::after { content:''; position:fixed; inset:0; background:linear-gradient(transparent 50%, rgba(0,0,0,0.1) 50%); background-size:100% 4px; pointer-events:none; z-index:999; opacity:0.3; }

/* Верхняя панель */
#topBar { height:60px; background:var(--panel); border-bottom:1px solid var(--ac); display:flex; align-items:center; justify-content:space-between; padding:0 20px; z-index:10; backdrop-filter:blur(5px); }
.tb-logo { font-size:20px; font-weight:bold; color:var(--ac); text-shadow:var(--glow); letter-spacing:2px; cursor:pointer; display:flex; align-items:center; gap:10px; }
.tb-status { display:flex; gap:20px; font-size:12px; color:var(--td); }
.status-indicator { width:8px; height:8px; background:var(--ac); border-radius:50%; box-shadow:var(--glow); display:inline-block; margin-right:5px; animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* Основной макет */
#layout { display:flex; flex:1; overflow:hidden; position:relative; z-index:1; }
/* Левая навигация (Вертикальная) */
#sideNav { width:80px; background:var(--panel); border-right:1px solid var(--border); display:flex; flex-direction:column; align-items:center; padding:20px 0; gap:15px; z-index:10; }
.nav-btn { width:50px; height:50px; border:1px solid var(--border); background:rgba(0,0,0,0.5); color:var(--td); font-size:24px; display:flex; align-items:center; justify-content:center; cursor:pointer; clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%); transition:all 0.2s; }
.nav-btn:hover, .nav-btn.on { background:rgba(34,197,94,0.2); border-color:var(--ac); color:var(--ac); box-shadow:var(--glow); }
/* Центр */
#mainContent { flex:1; padding:20px; overflow-y:auto; display:flex; flex-direction:column; }
/* Правая панель виджетов */
#rightPanel { width:300px; background:var(--panel); border-left:1px solid var(--border); padding:20px; overflow-y:auto; }
.widget { border:1px solid var(--border); padding:15px; margin-bottom:15px; background:rgba(0,0,0,0.4); position:relative; }
.widget::before { content:''; position:absolute; top:0; left:0; width:10px; height:2px; background:var(--ac2); }
.widget h3 { font-size:12px; color:var(--ac); margin-bottom:10px; text-transform:uppercase; letter-spacing:1px; }

/* Мобильная адаптация */
@media (max-width: 900px) {
  #rightPanel { display:none; }
  #sideNav { position:fixed; bottom:0; left:0; right:0; width:100%; height:70px; flex-direction:row; justify-content:space-around; border-right:none; border-top:1px solid var(--ac); padding:0; gap:0; background:rgba(10,18,10,0.98); }
  .nav-btn { border:none; clip-path:none; background:transparent; height:100%; width:60px; }
  #mainContent { padding:10px; padding-bottom:80px; }
}
</style>
</head>
<body>
<div id="topBar">
  <div class="tb-logo" onclick="navigate('desk')">BELUGA // TERMINAL</div>
  <div class="tb-status">
    <span><span class="status-indicator"></span>ONLINE</span>
    <span id="sysTime">--:--:--</span>
  </div>
</div>

<div id="layout">
  <div id="sideNav">
    <div class="nav-btn on" data-page="desk" onclick="navigate('desk')">🖥️</div>
    <div class="nav-btn" data-page="dm" onclick="navigate('dm')">💬</div>
    <div class="nav-btn" data-page="friends" onclick="navigate('friends')">👥</div>
    <div class="nav-btn" data-page="channels" onclick="navigate('channels')">📢</div>
    <div class="nav-btn" data-page="street" onclick="navigate('street')">🌆</div>
    <div class="nav-btn" data-page="me" onclick="navigate('me')">👤</div>
  </div>

  <div id="mainContent">
    <div style="text-align:center; padding-top:20%; color:var(--td);">
      <div style="font-size:40px; margin-bottom:20px;">[ INITIALIZING SYSTEM ]</div>
      <div style="font-size:14px;">Установка защищенного соединения...</div>
    </div>
  </div>

  <div id="rightPanel">
    <div class="widget">
      <h3>System Status</h3>
      <div style="font-size:12px; line-height:1.8;">
        CPU: <span style="color:var(--ac);">12%</span><br>
        RAM: <span style="color:var(--ac);">4.2 GB</span><br>
        NET: <span style="color:var(--ac2);">SECURE</span>
      </div>
    </div>
    <div class="widget" id="profileWidget">
      <h3>Agent Profile</h3>
      <div style="font-size:12px;">Загрузка данных...</div>
    </div>
    <div class="widget">
      <h3>Quick Log</h3>
      <div id="sysLog" style="font-size:10px; color:var(--td); height:100px; overflow:hidden; display:flex; flex-direction:column-reverse;">
        <div>> System ready...</div>
        <div>> Auth token verified.</div>
      </div>
    </div>
  </div>
</div>

<script>
const token = localStorage.getItem('bc_token');
if (!token) window.location.href = '/login';

let me = null, ws = null, curPage = null;

function g(id) { return document.getElementById(id); }

// Часы
setInterval(() => {
    const d = new Date();
    g('sysTime').innerText = d.toLocaleTimeString('ru-RU');
}, 1000);

// WebSocket заглушка
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  ws = new WebSocket(proto + location.host + '/ws?token=' + encodeURIComponent(token));
  ws.onopen = () => { addLog("WebSocket connected."); };
  ws.onclose = () => { addLog("WebSocket disconnected. Retrying..."); setTimeout(connectWS, 3000); };
}

function addLog(msg) {
    const log = g('sysLog');
    const div = document.createElement('div');
    div.innerText = `> ${msg}`;
    log.prepend(div);
    if (log.children.length > 5) log.lastChild.remove();
}

async function navigate(page) {
  if (curPage === page) return;
  curPage = page;
  document.querySelectorAll('.nav-btn').forEach(t => t.classList.toggle('on', t.dataset.page === page));
  
  const container = g('mainContent');
  container.innerHTML = '<div style="color:var(--ac); font-size:20px;">[ LOADING MODULE: ' + page.toUpperCase() + ' ]</div>';
  history.pushState(null, '', '/app/' + page);
  
  try {
    const r = await fetch('/pages/' + page + '.html');
    if (!r.ok) throw new Error('404');
    const html = await r.text();
    container.innerHTML = html;
    
    const scripts = container.querySelectorAll('script');
    scripts.forEach(oldScript => {
      const newScript = document.createElement('script');
      Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
      newScript.appendChild(document.createTextNode(oldScript.innerHTML));
      oldScript.parentNode.replaceChild(newScript, oldScript);
    });

    const initFn = window['init_' + page];
    if (typeof initFn === 'function') initFn();
    addLog(`Module [${page}] loaded.`);

  } catch(e) {
    container.innerHTML = '<div style="color:#dc2626; font-size:18px;">[ ERROR: MODULE NOT FOUND ]</div>';
    addLog(`Error loading [${page}].`);
  }
}

window.addEventListener('DOMContentLoaded', async () => {
  try {
    const r = await fetch('/api/me', {
        headers: { 'Authorization': 'Bearer ' + token }
    });
    if (!r.ok) throw new Error('Unauthorized');
    me = await r.json();
    
    // Заполняем виджет профиля
    g('profileWidget').innerHTML = `
      <h3>Agent Profile</h3>
      <div style="font-size:14px; color:var(--ac); font-weight:bold;">@${me.username}</div>
      <div style="font-size:12px; margin-top:5px;">Coins: ${me.coins} 🪙</div>
      <div style="font-size:12px;">Level: ${me.level} ⭐</div>
    `;
  } catch(e) {
    localStorage.removeItem('bc_token');
    window.location.href = '/login';
    return;
  }

  connectWS();
  const urlPage = location.pathname.split('/').pop();
  navigate(urlPage && urlPage !== 'app' ? urlPage : 'desk');
});
</script>
</body>
</html>
